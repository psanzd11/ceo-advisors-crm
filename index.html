function buildTimelineEvents(deals,acts){
  const ev=[];
  acts.forEach(a=>{
    const t=ACTIVITY_TYPES[a.type];
    ev.push({date:a.date,kind:'activity',subkind:a.type,title:a.title,sub:t.label+(a.notes?' · '+a.notes.slice(0,90)+(a.notes.length>90?'…':''):''),onClick:`openActivity('${a.id}')`,icon:actIcon(a.type),cls:t.cls,dealId:a.dealId,docs:(a.docs||[]).length});
    (a.docs||[]).forEach(dc=>{if(dc.uploadedAt){ev.push({date:dc.uploadedAt,kind:'doc',title:'Documento: '+dc.name,sub:(dc.size||'')+(dc.uploadedBy?' · '+(findConsultant(dc.uploadedBy)?.name||''):'')+' · en "'+a.title+'"',onClick:`openActivity('${a.id}')`,icon:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',cls:'doc'})}});
  });
  deals.forEach(d=>{
    const t=dealType(d.type);
    if(d.createdAt)ev.push({date:d.createdAt,kind:'deal-open',title:'Deal creado: '+d.title,sub:t.label+' · '+fmtMoney(d.amount),onClick:`openDeal('${d.id}')`,icon:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>',cls:'deal-open'});
    if((d.stage==='won'||d.stage==='lost')&&d.closeDate){const won=d.stage==='won';ev.push({date:d.closeDate,kind:won?'deal-won':'deal-lost',title:(won?'Deal ganado: ':'Deal perdido: ')+d.title,sub:t.label+' · '+fmtMoney(d.amount),onClick:`openDeal('${d.id}')`,icon:won?'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>':'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>',cls:won?'deal-won':'deal-lost'})}
  });
  ev.sort((a,b)=>b.date.localeCompare(a.date));
  return ev;
}
/* ctx: { filterKey: string (global window key), newActArgs: object } */
function renderTimeline(ctx,deals,acts){
  const ev=buildTimelineEvents(deals,acts);
  if(!ev.length)return '<div class="empty">Sin eventos todavía.</div>';
  const counts={all:ev.length,activity:ev.filter(x=>x.kind==='activity').length,deal:ev.filter(x=>x.kind.startsWith('deal-')).length,doc:ev.filter(x=>x.kind==='doc').length};
  const f=(window[ctx.filterKey]||'all');
  const groups={};ev.forEach(e=>{if(f!=='all'){if(f==='activity'&&e.kind!=='activity')return;if(f==='deal'&&!e.kind.startsWith('deal-'))return;if(f==='doc'&&e.kind!=='doc')return}const m=e.date.slice(0,7);(groups[m]=groups[m]||[]).push(e)});
  const months=Object.keys(groups).sort().reverse();
  const mLbl=m=>{const [y,mo]=m.split('-');return new Date(y,parseInt(mo)-1,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'}).replace(/^./,s=>s.toUpperCase())};
  const argStr=JSON.stringify(ctx.newActArgs||{}).replace(/"/g,'&quot;');
  return `
    <div class="flex jb ac" style="margin-bottom:10px">
      <div class="tl-chips">
        <button class="tl-chip ${f==='all'?'active':''}" data-tlf="all">Todo · ${counts.all}</button>
        <button class="tl-chip ${f==='activity'?'active':''}" data-tlf="activity">Actividades · ${counts.activity}</button>
        <button class="tl-chip ${f==='deal'?'active':''}" data-tlf="deal">Deals · ${counts.deal}</button>
        <button class="tl-chip ${f==='doc'?'active':''}" data-tlf="doc">Documentos · ${counts.doc}</button>
      </div>
      <button class="btn sm primary" onclick="openNew('activity',${argStr})">+ Actividad</button>
    </div>
    <div class="tl-wrap">
      ${months.map(m=>`<div class="tl-month"><div class="tl-month-hd">${mLbl(m)} <span class="muted" style="font-weight:400;font-size:11.5px">· ${groups[m].length} evento${groups[m].length===1?'':'s'}</span></div>${groups[m].map(e=>`
        <div class="tl-event" onclick="${e.onClick}">
          <div class="tl-node ${e.cls}">${e.icon}</div>
          <div class="tl-body">
            <div class="flex jb ac gap-s"><div class="sb" style="color:var(--ink);font-size:13.5px">${e.title}</div><div class="muted" style="font-size:11.5px">${fmtDate(e.date)}</div></div>
            <div class="muted" style="font-size:12px;margin-top:2px">${e.sub||''}</div>
          </div>
        </div>`).join('')}</div>`).join('')}
    </div>${months.length===0?'<div class="empty">Sin eventos con este filtro.</div>':''}`;
}
function wireTimelineFilters(ctx,deals,acts){
  $$('.tl-chip',drawerBody).forEach(b=>b.addEventListener('click',()=>{window[ctx.filterKey]=b.dataset.tlf;$('#tabPane',drawerBody).innerHTML=renderTimeline(ctx,deals,acts);wireTimelineFilters(ctx,deals,acts)}));
}

/* Pane de salud dentro del drawer del cliente */
function renderClientHealthPane(c){
  const h=clientHealth(c);
  const DAY=864e5;const now=new Date();
  const touches=DB.activities.filter(a=>a.clientId===c.id&&['meeting','call','email'].includes(a.type)).sort((a,b)=>a.date.localeCompare(b.date));
  const last6=touches.filter(a=>new Date(a.date)>=new Date(now.getTime()-180*DAY));
  const byType={meeting:0,call:0,email:0};touches.forEach(a=>{byType[a.type]=(byType[a.type]||0)+1});
  /* gaps entre toques para estimar cadencia real */
  let avgGap=null;if(touches.length>=2){let tot=0;for(let i=1;i<touches.length;i++){tot+=(new Date(touches[i].date)-new Date(touches[i-1].date))/DAY}avgGap=Math.round(tot/(touches.length-1))}
  const status=h.status;
  const statusColor=status==='healthy'?'var(--positive)':status==='watch'?'#D97706':'#B91C1C';
  const statusBg=status==='healthy'?'#E6F6EC':status==='watch'?'#FDF4E3':'#FEF2F2';
  const statusLabel=status==='healthy'?'Relación sana':status==='watch'?'Atención requerida':'Relación fría';
  const nextDue=h.last?new Date(new Date(h.last).getTime()+h.cadenceDays*DAY):null;
  const nextStr=nextDue?(nextDue<now?'Vencido hace '+Math.round((now-nextDue)/DAY)+'d':'En '+Math.round((nextDue-now)/DAY)+'d · '+fmtDate(nextDue.toISOString().slice(0,10))):'Aún sin historial';
  /* Recomendación breve */
  const reco=status==='cold'?'Agendar una llamada esta semana · han pasado '+(h.lastTouchDays||'??')+' días.':status==='watch'?'Programar un toque en los próximos '+Math.max(1,h.cadenceDays-h.lastTouchDays+7)+' días.':'Mantener cadencia actual. Próximo toque sugerido: '+nextStr.toLowerCase()+'.';
  /* Línea de toques — últimos 6 meses */
  const weeks=26;const buckets=Array(weeks).fill(0);const t0=now.getTime()-weeks*7*DAY;
  last6.forEach(a=>{const idx=Math.floor((new Date(a.date)-t0)/(7*DAY));if(idx>=0&&idx<weeks)buckets[idx]++});
  const maxB=Math.max(1,...buckets);
  const spark=buckets.map((v,i)=>{const hgt=v?6+Math.round(v/maxB*28):2;const today=i===weeks-1;return `<div title="Semana -${weeks-1-i}: ${v} toque${v===1?'':'s'}" style="width:9px;height:${hgt}px;background:${v?'var(--brand)':'#E4EAF2'};border-radius:2px;${today?'outline:1.5px solid var(--brand-2);outline-offset:1px':''}"></div>`}).join('');
  return `
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card" style="border-left:3px solid ${statusColor}">
        <div class="bd">
          <div class="flex jb ac" style="margin-bottom:10px"><div class="flex ac gap-m">${healthBadge(h,'lg')}<div><div class="sb" style="color:var(--ink);font-size:14px">${statusLabel}</div><div class="muted" style="font-size:12px">Tier ${h.tier.label} · cadencia objetivo ${h.cadenceDays} días</div></div></div><div style="text-align:right"><div class="sb" style="font-size:22px;color:${statusColor};line-height:1">${h.score}</div><div class="muted" style="font-size:10.5px">score /100</div></div></div>
          <div style="background:var(--surface-3);border-radius:6px;height:8px;overflow:hidden;margin-bottom:8px"><div style="height:100%;width:${h.score}%;background:${statusColor};transition:width .3s"></div></div>
          <div class="muted" style="font-size:12.5px;line-height:1.5">${reco}</div>
        </div>
      </div>
      <div class="field-grid">
        <div class="field"><label>Último toque</label><div class="v sb">${h.last?fmtDate(h.last)+' <span class="muted" style="font-weight:400;font-size:12px">· hace '+h.lastTouchDays+'d</span>':'<span class="muted">Sin registro</span>'}</div></div>
        <div class="field"><label>Próximo toque objetivo</label><div class="v sb" style="color:${nextDue&&nextDue<now?'#B91C1C':'var(--ink)'}">${nextStr}</div></div>
        <div class="field"><label>Cadencia real observada</label><div class="v sb">${avgGap!=null?avgGap+' días entre toques':'<span class="muted">Insuficiente historial</span>'}</div></div>
        <div class="field"><label>Toques (últimos 6 meses)</label><div class="v sb">${last6.length}</div></div>
      </div>
      <div class="card">
        <div class="hd"><h3>Actividad por tipo</h3><span class="muted" style="font-size:11.5px">histórico completo</span></div>
        <div class="bd"><div style="display:flex;gap:14px">
          ${[['meeting','Reuniones'],['call','Llamadas'],['email','Emails']].map(([k,lbl])=>`<div style="flex:1;padding:12px;background:var(--surface-2);border-radius:8px;text-align:center"><div class="sb" style="font-size:20px;color:var(--ink)">${byType[k]||0}</div><div class="muted" style="font-size:11.5px">${lbl}</div></div>`).join('')}
        </div></div>
      </div>
      <div class="card">
        <div class="hd"><h3>Cadencia · últimas 26 semanas</h3><span class="muted" style="font-size:11.5px">cada barra = 1 semana</span></div>
        <div class="bd"><div style="display:flex;align-items:flex-end;gap:2px;height:42px">${spark}</div><div class="flex jb" style="margin-top:6px;font-size:10.5px;color:var(--muted)"><span>hace 6 meses</span><span>hoy</span></div></div>
      </div>
      <div class="card">
        <div class="hd"><h3>Criterios del score</h3></div>
        <div class="bd"><div class="muted" style="font-size:12.5px;line-height:1.6">El score se calcula según los días desde el último toque relevante (reunión, llamada o email) contra la cadencia objetivo del tier. Dentro de la ventana el score se mantiene en zona sana; al sobrepasarla cae linealmente hacia 0 al triplicar la cadencia. Se aplica un pequeño ajuste positivo si hay deals abiertos con el cliente.</div></div>
      </div>
    </div>`;
}

function moveDeal(id,stage){
  const d=findDeal(id);if(!d)return;
  if(d.stage===stage)return;
  const from=d.stage;
  /* Win / Loss capture */
  if(stage==='lost'){
    const reason=window.prompt('Motivo de pérdida (Pricing, Timing, Competitor, Fit, Cambio decisor, Presupuesto, Otro):',d.lostReason||'Otro');
    if(reason===null)return; /* cancel */
    d.lostReason=reason||'Otro';
    d.lostNotes=window.prompt('Comentarios adicionales (opcional):',d.lostNotes||'')||'';
    /* añadimos motivo al catálogo si es nuevo */
    if(d.lostReason&&!DB.winLossReasons.includes(d.lostReason))DB.winLossReasons.push(d.lostReason);
  }
  if(stage==='won'){
    d.wonAt=todayISO();
  }
  d.stage=stage;
  recordStageMove(d, from, stage);
  saveDB();
  openDeal(id);render();
}

    let total=0;const rows=won.map(d=>{const comm=d.amount*rate;total+=comm;const cl=findClient(d.clientId),t=dealType(d.type);const splitCells=(d.splits||[]).map(sp=>{const cc=findConsultant(sp.u);if(!cc)return'';const credit=d.amount*sp.pct/100,commC=credit*rate;return `<div class="flex ac gap-s" style="padding:3px 0"><div class="pill-avatar" style="width:22px;height:22px;font-size:9px;background:${CONSULTANT_COLORS[cc.id]};color:#fff">${initials(cc.name)}</div><span style="font-size:12px">${cc.name.split(' ')[0]}</span><span class="muted" style="font-size:11.5px;margin-left:auto">${sp.pct}% · ${fmtMoney(commC)}</span></div>`}).join('');return `<tr class="click" onclick="openDeal('${d.id}')"><td>${fmtDate(d.closeDate)}</td><td class="sb">${d.title}</td><td>${cl?cl.name:'—'}</td><td><span class="tag ${t.color}">${t.label}</span></td><td class="num sb" style="text-align:right">${fmtMoney(d.amount)}</td><td class="num sb" style="text-align:right;color:var(--brand)">${fmtMoney(comm)}</td><td style="min-width:180px">${splitCells||'<span class="muted">—</span>'}</td></tr>`});

    body=`
      <div class="kpis" style="grid-template-columns:repeat(3,1fr);margin-bottom:0">
        ${kpi('Comisión si cierran',fmtMoney(total),open.length+' deals abiertos',true,'wallet')}

      <div class="card"><div class="hd"><h3>Deals abiertos (${open.length})</h3></div><div class="bd p0"><table class="tbl"><thead><tr><th>Deal</th><th>Cliente</th><th>Etapa</th><th>Tipo</th><th style="text-align:right">Monto</th><th style="text-align:right">Comisión</th><th style="text-align:right">Ponderada</th><th>Reparto</th></tr></thead><tbody>${rows.join('')||'<tr><td colspan="8"><div class="empty">Sin deals abiertos.</div></td></tr>'}</tbody></table></div></div>`;

    const stats=commissionStats().slice().sort((a,b)=>b.paid-a.paid);

        </div>`}).join('')}
      </div></div></div>`;
  }
  drawerBody.innerHTML=body||'<div class="empty">Sin datos.</div>';
  openDrawer();
}

async function dropDocOnActivity(ev, actId){
  ev.preventDefault();
  const dz=document.getElementById('dz_'+actId);if(dz)dz.classList.remove('over');
  const a=DB.activities.find(x=>x.id===actId);if(!a)return;
  const files=ev.dataTransfer&&ev.dataTransfer.files?[...ev.dataTransfer.files]:[];
  if(!files.length)return;
  if(!Array.isArray(a.docs))a.docs=[];
  await ingestDocs(files,a.docs,'activity',actId);
  files.forEach(f=>{
    if(a.dealId)logAudit('doc','deal',a.dealId,f.name);
    if(a.clientId)logAudit('doc','client',a.clientId,f.name);
    if(a.companyId)logAudit('doc','company',a.companyId,f.name);
  });
  try{saveDB()}catch(e){alert('Algunos archivos no se pudieron guardar (cuota localStorage llena). Borra documentos antiguos.')}
  openActivity(actId);
}

function activityConsultants(a){
  /* Combina: creador + (si hay deal) splits del deal + consultores del scope cliente/empresa. Ordenados, sin duplicados. */
  const ids=new Map();
  if(a.createdBy)ids.set(a.createdBy,{fromCreator:true});
  if(a.dealId){const d=findDeal(a.dealId);(d?.splits||[]).forEach(sp=>{const ex=ids.get(sp.u)||{};ex.splitPct=(ex.splitPct||0)+sp.pct;ids.set(sp.u,ex)})}
  else if(a.clientId||a.companyId){
    /* Si la actividad no está atada a un deal, enlazamos consultores por deals del cliente/empresa. */
    const rel=DB.deals.filter(d=>(a.clientId&&d.clientId===a.clientId)||(a.companyId&&d.companyId===a.companyId));
    const tally={};rel.forEach(d=>{(d.splits||[]).forEach(sp=>{tally[sp.u]=(tally[sp.u]||0)+1})});
    Object.entries(tally).sort((x,y)=>y[1]-x[1]).slice(0,3).forEach(([u])=>{if(!ids.has(u))ids.set(u,{})});
  }
  return [...ids.entries()].map(([u,meta])=>{const c=findConsultant(u);if(!c)return null;return {...c,...meta}}).filter(Boolean);
}

function dealAllDocs(d){
  /* Combina docs directos del deal + docs de actividades del deal, marcando la fuente. */
  const out=[];
  (d.docs||[]).forEach((dc,i)=>out.push({...dc,source:'deal',_dealIdx:i}));
  DB.activities.filter(a=>a.dealId===d.id).forEach(a=>{
    (a.docs||[]).forEach((dc,i)=>out.push({...dc,source:'activity',_actId:a.id,_actIdx:i,_actSubject:a.subject||a.type}));
  });
  return out.sort((a,b)=>(b.uploadedAt||'').localeCompare(a.uploadedAt||''));
}

    :'<div class="empty">No hay documentos asociados a este deal aún.</div>';
  return `<div class="card">
    <div class="hd"><h3>Documentos (${docs.length})</h3><button class="btn sm primary" onclick="addDealDoc('${d.id}')">+ Documento</button></div>

        <span>Arrastra archivos aquí o haz clic para añadir</span>
      </div>
      <div style="margin-top:12px">${rows}</div>

function readFileAsDataUrl(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
const DOC_MAX_BYTES=4*1024*1024; /* 4 MB — sobre eso, sólo metadatos, no descargable */
async function ingestDocs(files,target,kind,id){
  for(const f of files){
    const sz=f.size>=1e6?(f.size/1e6).toFixed(1)+' MB':f.size>=1e3?(f.size/1e3).toFixed(0)+' KB':f.size+' B';
    const doc={name:f.name,size:sz,bytes:f.size,mime:f.type||'application/octet-stream',uploadedBy:DB.currentUserId,uploadedAt:todayISO()};
    if(f.size<=DOC_MAX_BYTES){
      try{doc.dataUrl=await readFileAsDataUrl(f)}catch(e){doc.dataUrl=null}
    }else{
      doc.tooLarge=true;
    }
    target.push(doc);
    logAudit('doc',kind,id,f.name);
  }
}
function downloadDoc(dataUrl,name,mime){
  if(!dataUrl){alert('Este documento no tiene archivo adjunto disponible.');return}
  const a=document.createElement('a');a.href=dataUrl;a.download=name||'documento';document.body.appendChild(a);a.click();a.remove();
}
function downloadDealDoc(did,idx){const d=findDeal(did);if(!d||!d.docs||!d.docs[idx])return;const dc=d.docs[idx];downloadDoc(dc.dataUrl,dc.name,dc.mime)}
function downloadActivityDoc(aid,idx){const a=(DB.activities||[]).find(x=>x.id===aid);if(!a||!a.docs||!a.docs[idx])return;const dc=a.docs[idx];downloadDoc(dc.dataUrl,dc.name,dc.mime)}
async function dropDocOnDeal(ev, did){
  ev.preventDefault();

  await ingestDocs(files,d.docs,'deal',did);
  try{saveDB()}catch(e){alert('Algunos archivos no se pudieron guardar (cuota localStorage llena). Borra documentos antiguos.')}
  openDeal(did);
}

function shell(title,inner,onSave){
  modalEl.innerHTML=`<div class="modal-hd"><h3>${title}</h3><button class="drawer-close" onclick="closeModal()">✕</button></div><div class="modal-body">${inner}</div><div class="modal-ft"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" id="saveBtn">Guardar</button></div>`;

      <select onchange="window.__splits[${i}].u=this.value">${DB.consultants.map(c=>`<option value="${c.id}" ${sp.u===c.id?'selected':''}>${c.name} · ${c.role}</option>`).join('')}</select>
      <input type="number" min="0" max="100" step="5" value="${sp.pct}" oninput="window.__splits[${i}].pct=+this.value;document.getElementById('splitTotal').className='split-total '+((window.__splits.reduce((s,x)=>s+(+x.pct||0),0)===100)?'ok':'bad');document.getElementById('splitTotalNum').textContent=window.__splits.reduce((s,x)=>s+(+x.pct||0),0)+'%'" />

    <div id="splitTotal" class="split-total ${ok?'ok':'bad'}">Total: <b id="splitTotalNum">${total}%</b> ${ok?'✓':'(debe ser 100%)'}</div>`;
  };

  shell(existing?(editingSplitsOnly?'Editar splits — '+existing.title:'Editar deal'):'Nuevo deal',`

    <div class="row"><div class="field"><label>Monto (USD)</label><input id="f_amount" type="number" value="${d.amount||0}" /></div><div class="field"><label>Fecha cierre</label><input id="f_close" type="date" value="${d.closeDate||''}" /></div></div>

    <div class="field"><label>Notas</label><textarea id="f_notes" rows="3" placeholder="Contexto del deal, próximos pasos, riesgos…">${d.notes||''}</textarea></div>

    const title=$('#f_title').value.trim();if(!title){alert('Título requerido');return false}

      DB.deals.push(newDeal);

    return true;
  });

async function resetConsultantPassword(id){
  if(!isAdmin()){alert('Solo admins.');return}
  const c=findConsultant(id);if(!c||c.isCEO)return;
  if(!c.email){alert('Este consultor no tiene email — añade uno antes de resetear.');return}
  if(!confirm('Enviar email de recuperación de contraseña a '+c.name+' ('+c.email+')?'))return;
  try{
    await sendPasswordResetEmail(c.email);
    logAudit('edit','consultant',id,'Password reset email enviado por admin (Supabase Auth)');
    alert('Email de recuperación enviado a '+c.email+'. El usuario recibirá un enlace para establecer nueva contraseña.');
  }catch(e){
    alert('No se pudo enviar el email: '+(e.message||e));
  }
}
function deleteConsultant(id){
  if(!isAdmin()){alert('Solo admins.');return}
  const c=findConsultant(id);if(!c)return;
  if(c.isCEO){alert('No se puede eliminar al CEO.');return}
  if(c.id===DB.currentUserId){alert('No puedes eliminar la cuenta con la que estás conectado.');return}
  const hasSplits=DB.deals.some(d=>(d.splits||[]).some(sp=>sp.u===id));
  const hasActs=DB.activities.some(a=>a.createdBy===id);
  if(hasSplits||hasActs){
    if(!confirm(c.name+' tiene deals o actividades asociados. Al eliminar se conservarán pero quedarán huérfanos. ¿Continuar?'))return;
  }else if(!confirm('Eliminar a '+c.name+'?'))return;
  DB.consultants=DB.consultants.filter(x=>x.id!==id);
  saveDB();closeDrawer();renderUserSwitcher();render();
}

/* ──────────── Analítica avanzada ──────────── */
function renderAnalytics(root){
  const period=state.anaPeriod||'year';
  const days=period==='month'?30:period==='quarter'?90:365;
  const now=new Date();const fromDt=new Date(now.getTime()-days*864e5);
  const myDeals=scopedDeals();
  const closed=myDeals.filter(d=>(d.stage==='won'||d.stage==='lost')&&d.closeDate&&new Date(d.closeDate)>=fromDt);
  const won=closed.filter(d=>d.stage==='won');
  const lost=closed.filter(d=>d.stage==='lost');
  const winRate=closed.length?Math.round(won.length/closed.length*100):0;
  /* velocity: días promedio entre primer y último stageHistory para deals cerrados */
  const cyclePerDeal=closed.map(d=>{
    const sh=d.stageHistory||[];if(sh.length<2)return null;
    const ts0=new Date(sh[0].ts).getTime();const ts1=new Date(sh[sh.length-1].ts).getTime();
    return Math.max(1,Math.round((ts1-ts0)/864e5));
  }).filter(x=>x!=null);
  const avgCycle=cyclePerDeal.length?Math.round(cyclePerDeal.reduce((s,x)=>s+x,0)/cyclePerDeal.length):0;
  const avgWonAmt=won.length?won.reduce((s,d)=>s+d.amount,0)/won.length:0;
  /* velocity formula: Pipeline Velocity = (#oportunidades × valor medio × win rate) / ciclo */
  const openCount=myDeals.filter(d=>d.stage!=='won'&&d.stage!=='lost').length;
  const velocity=avgCycle?(openCount*avgWonAmt*(winRate/100))/avgCycle:0;
  /* Win/Loss por motivo */
  const lossByReason={};
  lost.forEach(d=>{const r=d.lostReason||'Otro';lossByReason[r]=(lossByReason[r]||0)+1});
  const lossRows=Object.entries(lossByReason).sort((a,b)=>b[1]-a[1]);
  const totalLost=lost.length;
  /* Forecast 3 escenarios */
  const open=myDeals.filter(d=>d.stage!=='won'&&d.stage!=='lost');
  const total=open.reduce((s,d)=>s+d.amount,0);
  const weighted=open.reduce((s,d)=>{const st=stageBy(d.stage);return s+d.amount*(st?st.prob:0)/100},0);
  const forecasts={
    pess:open.reduce((s,d)=>{const st=stageBy(d.stage);return s+d.amount*Math.max(0,((st?st.prob:0)-15))/100},0),
    real:weighted,
    opt:open.reduce((s,d)=>{const st=stageBy(d.stage);return s+d.amount*Math.min(100,((st?st.prob:0)+15))/100},0),
  };
  /* Cohort retention (renovación): por mes de primera actividad won del cliente, cuántos siguen activos */
  const clientFirstWonMonth={};
  myDeals.filter(d=>d.stage==='won').forEach(d=>{
    if(!d.clientId||!d.closeDate)return;
    const m=d.closeDate.slice(0,7);
    if(!clientFirstWonMonth[d.clientId]||clientFirstWonMonth[d.clientId]>m)clientFirstWonMonth[d.clientId]=m;
  });
  /* Generamos 6 cohortes de los últimos 12 meses, agrupados por trimestre para que la tabla sea legible */
  const cohorts={};
  Object.entries(clientFirstWonMonth).forEach(([cid,m])=>{
    const [yy,mm]=m.split('-').map(Number);
    const q='Q'+Math.ceil(mm/3)+' '+yy;
    cohorts[q]=cohorts[q]||{key:q,clients:[],activeNow:0};
    cohorts[q].clients.push(cid);
  });
  Object.values(cohorts).forEach(co=>{
    co.activeNow=co.clients.filter(cid=>{
      /* "activo" = ha tenido alguna actividad o deal abierto/won en últimos 90 días */
      const cutoff=new Date(now.getTime()-90*864e5).toISOString().slice(0,10);
      const hasAct=DB.activities.some(a=>a.clientId===cid&&a.date>=cutoff);
      const hasDeal=myDeals.some(d=>d.clientId===cid&&((d.stage!=='won'&&d.stage!=='lost')||(d.closeDate&&d.closeDate>=cutoff)));
      return hasAct||hasDeal;
    }).length;
  });
  const cohortRows=Object.values(cohorts).sort((a,b)=>{const pa=a.key.split(' ');const pb=b.key.split(' ');return (pb[1]+pb[0]).localeCompare(pa[1]+pa[0])}).slice(0,8);
  /* New vs Churn ratio: nuevos clientes en periodo vs perdidos (sin actividad >180d y sin deals abiertos) */
  const newClients=DB.clients.filter(c=>{
    const firstAct=DB.activities.filter(a=>a.clientId===c.id).map(a=>a.date).sort()[0];
    return firstAct&&new Date(firstAct)>=fromDt;
  });
  const cutoff180=new Date(now.getTime()-180*864e5).toISOString().slice(0,10);
  const churned=DB.clients.filter(c=>{
    const lastAct=DB.activities.filter(a=>a.clientId===c.id).map(a=>a.date).sort().pop();

function loadSheetJS(){
  return new Promise((resolve,reject)=>{
    if(window.XLSX) return resolve(window.XLSX);
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload=()=>resolve(window.XLSX);
    s.onerror=()=>reject(new Error('No se pudo cargar SheetJS desde el CDN.'));
    document.head.appendChild(s);

}

/* ──────────── import (replace + merge) ──────────── */
$('#btnImport').addEventListener('click',()=>{
  if(!isCEO()&&!DB.consultants.find(c=>c.id===DB.currentUserId)?.isAdmin){alert('Solo el CEO o un Admin puede importar datos.');return;}
  $('#importFileInput').click();
});
$('#importFileInput').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const imported=JSON.parse(ev.target.result);
      // Schema drift warning
      if(imported.schemaVersion&&imported.schemaVersion!==SCHEMA_VERSION){
        if(!confirm(`Schema del archivo (${imported.schemaVersion}) ≠ schema del CRM (${SCHEMA_VERSION}).\n¿Continuar de todos modos?`)){e.target.value='';return;}
      }
      // MERGE MODE: añade solo IDs nuevos, no toca lo existente
      if(imported._mode==='merge'){
        const counts={consultants:0,clients:0,companies:0,deals:0,activities:0,pupilos:0};
        for(const k of Object.keys(counts)){
          const existing=new Set((DB[k]||[]).map(x=>x.id));
          const incoming=imported[k]||[];
          const news=incoming.filter(x=>!existing.has(x.id));
          DB[k]=(DB[k]||[]).concat(news);
          counts[k]=news.length;
        }
        migrateAuth(DB);migrateExtra(DB);saveDB();render();
        const summary=Object.entries(counts).map(([k,n])=>`${k}:+${n}`).join(' | ');
        alert(`✓ Merge aplicado. ${summary}\n\nNo se modificaron registros existentes.`);
        e.target.value='';return;
      }
      // REPLACE MODE
      if(!imported.consultants||!imported.clients||!imported.deals){alert('Archivo JSON inválido — faltan secciones requeridas.');return;}
      if(!confirm(`¿Reemplazar todos los datos con los del archivo "${file.name}"?\n\nEsta acción no se puede deshacer. Se recomienda exportar primero como respaldo.`))return;
      Object.assign(DB,imported);
      migrateAuth(DB);migrateExtra(DB);saveDB();
      render();
      alert('✓ Datos importados correctamente.');
    }catch(err){alert('Error al leer el archivo: '+err.message);}
    e.target.value='';
  };
  reader.readAsText(file);
});

const _gs={open:false,q:'',idx:0,results:[]};
function gsClose(){_gs.open=false;const dd=document.getElementById('gsDropdown');if(dd)dd.remove()}
function gsSearch(q){
  q=(q||'').trim().toLowerCase();
  if(!q)return [];
  const out=[];
  const push=(type,id,title,sub,icon)=>out.push({type,id,title,sub,icon});
  (DB.clients||[]).forEach(c=>{
    const hay=(c.name+' '+(c.email||'')+' '+(c.country||'')+' '+(c.city||'')+' '+(c.notes||'')).toLowerCase();
    if(hay.includes(q))push('client',c.id,c.name,(c.country||'')+(c.tier?' · tier '+c.tier:''),'👤');
  });
  (DB.companies||[]).forEach(co=>{
    const hay=(co.name+' '+(co.industry||'')+' '+(co.country||'')+' '+(co.website||'')+' '+(co.notes||'')).toLowerCase();
    if(hay.includes(q))push('company',co.id,co.name,(co.industry||'')+(co.country?' · '+co.country:''),'🏢');
  });
  (DB.deals||[]).forEach(d=>{
    const hay=(d.title+' '+(d.notes||'')+' '+d.type+' '+d.stage).toLowerCase();
    if(hay.includes(q)){const cli=findClient(d.clientId);push('deal',d.id,d.title,(cli?cli.name+' · ':'')+d.stage+' · '+fmtMoney(d.amount),'💼')}
  });
  (DB.activities||[]).forEach(a=>{
    const hay=((a.title||'')+' '+(a.notes||'')+' '+a.type).toLowerCase();
    if(hay.includes(q))push('activity',a.id,a.title||a.type,a.date+' · '+a.type,'📋');
  });
  (DB.pupilos||[]).forEach(p=>{
    const hay=(p.name+' '+(p.email||'')+' '+(p.university||'')+' '+(p.program||'')+' '+(p.region||'')+' '+(p.leftCompany||'')).toLowerCase();
    if(hay.includes(q))push('pupilo',p.id,p.name,(p.university||'')+(p.program?' · '+p.program:''),'🎓');
  });
  (DB.consultants||[]).forEach(c=>{
    const hay=(c.name+' '+(c.email||'')+' '+(c.role||'')+' '+(c.region||'')).toLowerCase();
    if(hay.includes(q))push('consultant',c.id,c.name,c.role+(c.region?' · '+c.region:''),'⚙');
  });
  return out.slice(0,30);
}
function gsRender(){
  const q=document.getElementById('globalSearch').value;
  _gs.q=q; _gs.results=gsSearch(q); _gs.idx=0;
  let dd=document.getElementById('gsDropdown');
  if(!_gs.results.length&&!q.trim()){if(dd)dd.remove();_gs.open=false;return}
  if(!dd){
    dd=document.createElement('div');dd.id='gsDropdown';
    dd.style.cssText='position:absolute;top:46px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.18);max-height:420px;overflow:auto;z-index:500;font-size:13px';
    const wrapper=document.getElementById('globalSearch').parentElement;
    wrapper.style.position='relative';
    wrapper.appendChild(dd);
  }
  if(!_gs.results.length){dd.innerHTML='<div style="padding:18px;color:var(--ink-2);text-align:center">Sin resultados para "'+q.replace(/[<>]/g,'')+'"</div>';_gs.open=true;return}
  const groups={};
  _gs.results.forEach(r=>{(groups[r.type]=groups[r.type]||[]).push(r)});
  const labels={client:'Clientes',company:'Empresas',deal:'Deals',activity:'Actividades',pupilo:'Pupilos',consultant:'Consultores'};
  let html='';let n=0;
  for(const k of Object.keys(labels)){
    if(!groups[k])continue;
    html+='<div style="padding:6px 12px 4px;font-size:10.5px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;background:var(--surface-2)">'+labels[k]+' · '+groups[k].length+'</div>';

/* ──────────── 3.4 Bulk CSV import (clientes/empresas/pupilos) ──────────── */
function csvParse(text){
  /* Parser RFC 4180 simple: respeta comillas, escape "" dentro de comillas. */
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i],n=text[i+1];
    if(q){
      if(c==='"'&&n==='"'){cur+='"';i++}
      else if(c==='"'){q=false}
      else cur+=c;
    } else {
      if(c==='"'){q=true}
      else if(c===','){row.push(cur);cur=''}
      else if(c==='\n'||c==='\r'){if(cur||row.length){row.push(cur);rows.push(row);row=[];cur=''} if(c==='\r'&&n==='\n')i++}
      else cur+=c;
    }
  }
  if(cur||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.length&&r.some(c=>String(c).trim()));
}

/* ──────────── F4.2 Calendar export (.ics RFC 5545) ──────────── */
function _icsEscape(s){return (s||'').toString().replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
function _icsDate(d){
  /* d puede ser 'YYYY-MM-DD' o ISO completo. Devuelve YYYYMMDDTHHMMSSZ. */
  if(!d)return '';
  const dt=new Date(d.length===10?d+'T09:00:00Z':d);
  if(isNaN(dt))return '';
  return dt.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
}
function buildICS(events){
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//CEO Advisors CRM//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  events.forEach(e=>{
    const dtStart=_icsDate(e.date);
    if(!dtStart)return;
    /* Sin hora explicita: evento all-day de 1h por defecto */
    const startD=new Date(e.date.length===10?e.date+'T09:00:00Z':e.date);
    const endD=new Date(startD.getTime()+60*60*1000);
    const dtEnd=endD.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
    const dtStamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
    lines.push('BEGIN:VEVENT');
    lines.push('UID:'+(e.id||Math.random().toString(36).slice(2))+'@ceoadvisors.crm');
    lines.push('DTSTAMP:'+dtStamp);
    lines.push('DTSTART:'+dtStart);
    lines.push('DTEND:'+dtEnd);
    lines.push('SUMMARY:'+_icsEscape((e.title||e.type||'Actividad')));
    if(e.notes)lines.push('DESCRIPTION:'+_icsEscape(e.notes));
    /* Categoría según tipo */
    lines.push('CATEGORIES:CRM,'+(e.type||'task').toUpperCase());
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}
function exportActivityICS(actId){
  const a=(DB.activities||[]).find(x=>x.id===actId);if(!a)return;
  if(!a.date){alert('La actividad no tiene fecha; no se puede exportar.');return}
  const ics=buildICS([a]);
  const blob=new Blob([ics],{type:'text/calendar'});
  const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=(a.title||'actividad').replace(/[^\w]+/g,'_')+'.ics';link.click();
}
function exportUpcomingICS(){
  const today=todayISO();
  const upcoming=(DB.activities||[]).filter(a=>a.date&&a.date>=today&&!a.done);
  if(!upcoming.length){alert('No hay actividades futuras pendientes.');return}
  const ics=buildICS(upcoming);
  const blob=new Blob([ics],{type:'text/calendar'});
  const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='ceoadvisors_upcoming_'+today+'.ics';link.click();
}

/* ──────────── F5.2 Auto-tier desde net worth ──────────── */
function autoTier(nw){
  const n=Number(nw)||0;
  if(n>=50000000)return 'A';
  if(n>=10000000)return 'B';
  if(n>0)return 'C';
  return '';
}

/* ──────────── F5.3 Duplicate detection ──────────── */
function findSimilarName(name, list){
  if(!name)return null;
  const n=name.toLowerCase().trim();
  /* Exacto */
  let exact=list.find(x=>(x.name||'').toLowerCase().trim()===n);
  if(exact)return exact;
  /* Subcadena (>= 4 chars para evitar false positives) */
  if(n.length>=4){
    const sub=list.find(x=>{const xn=(x.name||'').toLowerCase().trim();return xn.includes(n)||n.includes(xn)});
    if(sub)return sub;
  }
  return null;
}
function confirmDuplicate(name, kind, existing, openFn){
  const msg='Ya existe un '+kind+' con nombre similar:\n\n  "'+existing.name+'" (id: '+existing.id+')\n\n¿Crear de todos modos un nuevo registro "'+name+'"?\n\n[Cancelar] = abrir el existente · [OK] = crear nuevo';
  if(confirm(msg))return true;
  /* User canceló — abrir el existente */
  if(openFn)setTimeout(()=>openFn(existing.id),100);
  return false;
}

/* ──────────── F5.4 Deal age en stage actual ──────────── */
function daysInCurrentStage(d){
  if(!Array.isArray(d.stageHistory)||!d.stageHistory.length)return 0;
  const last=d.stageHistory[d.stageHistory.length-1];
  if(!last||!last.ts)return 0;
  const ms=Date.now()-new Date(last.ts).getTime();
  return Math.max(0,Math.floor(ms/86400000));
}
function dealAgeBadge(d){
  if(d.stage==='won'||d.stage==='lost')return '';
  const days=daysInCurrentStage(d);
  if(days===0)return '<span class="muted" style="font-size:10.5px">hoy</span>';
  if(days<=7)return '<span class="muted" style="font-size:10.5px">'+days+'d</span>';
  if(days<=21)return '<span style="font-size:10.5px;color:#f59e0b" title="'+days+' días en este stage">'+days+'d</span>';
  return '<span style="font-size:10.5px;color:#dc2626;font-weight:600" title="Estancado: '+days+' días sin avanzar de stage">⚠ '+days+'d</span>';
}

/* ──────────── F7.1 Auto-reminders generator ──────────── */
function ensureReminder(key, toUserId, kind, payload){
  /* Idempotente: si ya existe una notif activa con esta key, no la duplica. */
  if(!Array.isArray(DB.notifications))DB.notifications=[];
  const exists=DB.notifications.find(n=>n.to===toUserId&&n._reminderKey===key&&!n.dismissed);
  if(exists)return false;
  DB.notifications.unshift({
    id:uid('nt'),ts:nowISO(),to:toUserId,from:'system',
    kind,payload:payload||{},read:false,
    _reminderKey:key,_auto:true
  });
  if(DB.notifications.length>500)DB.notifications.length=500;
  return true;
}
function generateAutoReminders(){
  const today=todayISO();
  const todayMs=Date.now();
  let added=0;
  /* 1. Tareas vencidas o due hoy/mañana asignadas a alguien */
  (DB.activities||[]).filter(a=>a.type==='task'&&!a.done&&a.assignedTo&&a.date).forEach(a=>{
    if(a.date<today){
      added += ensureReminder('task_overdue_'+a.id, a.assignedTo, 'task_overdue', {entityType:'activity',entityId:a.id,snippet:a.title,daysOverdue:Math.round((todayMs-new Date(a.date).getTime())/86400000)})?1:0;
    } else if(a.date===today){
      added += ensureReminder('task_due_today_'+a.id, a.assignedTo, 'task_due_today', {entityType:'activity',entityId:a.id,snippet:a.title})?1:0;
    }
  });
  /* 2. Deals estancados >21d en stage actual */
  (DB.deals||[]).filter(d=>d.stage!=='won'&&d.stage!=='lost'&&Array.isArray(d.stageHistory)&&d.stageHistory.length).forEach(d=>{
    const last=d.stageHistory[d.stageHistory.length-1];
    if(!last||!last.ts)return;
    const days=Math.floor((todayMs-new Date(last.ts).getTime())/86400000);
    if(days>=21){
      /* Notificar a cada advisor del split */
      (d.splits||[]).forEach(sp=>{
        added += ensureReminder('deal_stuck_'+d.id+'_'+sp.u, sp.u, 'deal_stuck', {entityType:'deal',entityId:d.id,snippet:d.title+' · '+days+'d en '+d.stage,days})?1:0;
      });
    }
  });
  /* 3. Pupilos terminando en <14 días → notif a su mentor */
  (DB.pupilos||[]).filter(p=>p.endDate&&p.mentor).forEach(p=>{
    const daysLeft=Math.floor((new Date(p.endDate).getTime()-todayMs)/86400000);
    if(daysLeft>=0&&daysLeft<=14){
      added += ensureReminder('pupilo_ending_'+p.id, p.mentor, 'pupilo_ending', {entityType:'pupilo',entityId:p.id,snippet:p.name+' termina en '+daysLeft+'d',daysLeft})?1:0;
    }
  });
  if(added>0){try{Storage.write(JSON.stringify(DB))}catch(e){}}
  return added;
}
/* Limpiar notifs auto que ya no aplican (tarea ya hecha, deal movido, pupilo pasado) */
function cleanupStaleReminders(){
  if(!Array.isArray(DB.notifications))return 0;
  const today=todayISO();
  const before=DB.notifications.length;
  DB.notifications=DB.notifications.filter(n=>{
    if(!n._auto)return true; /* sólo tocamos auto */
    const k=n._reminderKey||'';
    if(k.startsWith('task_overdue_')||k.startsWith('task_due_today_')){
      const aid=k.replace(/^task_(overdue|due_today)_/,'');
      const a=(DB.activities||[]).find(x=>x.id===aid);
      if(!a||a.done)return false;
      if(k.startsWith('task_due_today_')&&a.date!==today)return false;
      return true;
    }
    if(k.startsWith('deal_stuck_')){
      const did=k.split('_')[2];
      const d=(DB.deals||[]).find(x=>x.id===did);
      if(!d||d.stage==='won'||d.stage==='lost')return false;
      const last=(d.stageHistory||[]).slice(-1)[0];
      if(!last||!last.ts)return false;
      const days=Math.floor((Date.now()-new Date(last.ts).getTime())/86400000);
      return days>=21;
    }
    if(k.startsWith('pupilo_ending_')){
      const pid=k.replace(/^pupilo_ending_/,'');
      const p=(DB.pupilos||[]).find(x=>x.id===pid);
      if(!p||!p.endDate)return false;
      return new Date(p.endDate).getTime()>=Date.now()-86400000;
    }
    return true;
  });
  return before-DB.notifications.length;
}

/* ──────────── F8.3 @-mention autocomplete en textareas ──────────── */
function _mentionDropdown(ta){
  let dd=document.getElementById('mentionDD');
  if(dd)return dd;
  dd=document.createElement('div');
  dd.id='mentionDD';
  dd.style.cssText='position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.15);max-height:240px;overflow:auto;z-index:1500;font-size:13px;min-width:240px';
  document.body.appendChild(dd);
  return dd;
}
function _hideMentionDropdown(){const dd=document.getElementById('mentionDD');if(dd)dd.remove();_mentionState=null}
let _mentionState=null;
function checkMentionTrigger(ta){
  const cur=ta.selectionStart;
  const before=ta.value.slice(0,cur);
  /* Buscar último @ que no esté precedido por letra o número (para evitar emails) */
  const m=before.match(/(^|\s)@([A-Za-z0-9._-]*)$/);
  if(!m){_hideMentionDropdown();return}
  const query=m[2].toLowerCase();
  const start=cur-m[2].length-1; /* posición del @ */
  const matches=DB.consultants.filter(c=>(c.name||'').toLowerCase().includes(query)||(c.id||'').toLowerCase()===query).slice(0,8);
  if(!matches.length){_hideMentionDropdown();return}
  const dd=_mentionDropdown(ta);
  /* Posicionar el dropdown debajo del cursor de la textarea (aproximación) */
  const r=ta.getBoundingClientRect();
  dd.style.top=(r.bottom+window.scrollY+4)+'px';
  dd.style.left=(r.left+window.scrollX)+'px';
  dd.innerHTML=matches.map((c,i)=>'<div data-i="'+i+'" class="mention-row" style="padding:6px 10px;cursor:pointer;display:flex;align-items:center;gap:8px;'+(i===0?'background:var(--brand-soft)':'')+'"><div class="pill-avatar" style="width:24px;height:24px;font-size:10px">'+initials(c.name)+'</div><div><div style="font-weight:600;color:var(--ink)">'+c.name+'</div><div class="muted" style="font-size:11px">'+c.role+'</div></div></div>').join('');
  _mentionState={ta,start,query,matches,idx:0};
  /* Click handlers */
  dd.querySelectorAll('.mention-row').forEach((row,i)=>{
    row.addEventListener('click',()=>insertMention(i));
    row.addEventListener('mouseenter',()=>{_mentionState.idx=i;_refreshMentionHighlight()});
  });
}
function _refreshMentionHighlight(){
  const dd=document.getElementById('mentionDD');if(!dd||!_mentionState)return;
  dd.querySelectorAll('.mention-row').forEach((r,i)=>r.style.background=i===_mentionState.idx?'var(--brand-soft)':'');
}
function insertMention(i){
  if(!_mentionState)return;
  const {ta,start,query,matches}=_mentionState;
  const sel=matches[i!=null?i:_mentionState.idx];if(!sel)return;
  /* Reemplazar @query por @nombre (sin espacios) */
  const before=ta.value.slice(0,start);
  const after=ta.value.slice(start+1+query.length);
  const tag='@'+(sel.name.split(' ')[0])+' ';
  ta.value=before+tag+after;
  const newCur=before.length+tag.length;
  ta.setSelectionRange(newCur,newCur);
  ta.focus();
  _hideMentionDropdown();
  /* Trigger oninput de nuevo para que updateMentionPreview se ejecute */
  ta.dispatchEvent(new Event('input'));
}
/* Listener global para textareas con id ci_ (comentarios) */
document.addEventListener('input',e=>{
  if(e.target.tagName!=='TEXTAREA')return;
  if(!(e.target.id||'').startsWith('ci_'))return;
  checkMentionTrigger(e.target);
});
document.addEventListener('keydown',e=>{
  if(!_mentionState)return;
  if(['ArrowDown','ArrowUp','Enter','Tab','Escape'].includes(e.key)){
    if(e.key==='Escape'){_hideMentionDropdown();return}
    e.preventDefault();
    if(e.key==='ArrowDown'){_mentionState.idx=Math.min(_mentionState.matches.length-1,_mentionState.idx+1);_refreshMentionHighlight()}
    else if(e.key==='ArrowUp'){_mentionState.idx=Math.max(0,_mentionState.idx-1);_refreshMentionHighlight()}
    else if(e.key==='Enter'||e.key==='Tab'){insertMention(_mentionState.idx)}
  }
});
document.addEventListener('click',e=>{if(_mentionState&&!e.target.closest('#mentionDD')&&e.target!==_mentionState.ta)_hideMentionDropdown()});

/* ──────────── F8.4 Saved filter presets ──────────── */
const SAVED_FILTERS_KEY='ceoadvisors_saved_filters_v1';
function _loadSavedFilters(){try{return JSON.parse(localStorage.getItem(SAVED_FILTERS_KEY)||'{}')}catch(e){return {}}}
function _writeSavedFilters(o){try{localStorage.setItem(SAVED_FILTERS_KEY,JSON.stringify(o))}catch(e){}}
function savedFiltersFor(view){const all=_loadSavedFilters();return all[view]||[]}
function saveCurrentFilter(view){
  const name=prompt('Nombre del filtro guardado:');
  if(!name||!name.trim())return;
  const all=_loadSavedFilters();
  all[view]=all[view]||[];
  let snapshot;
  if(view==='clients')snapshot={...state.cFilter};
  else if(view==='deals')snapshot={...(state.dFilter||{})};
  else if(view==='pupilos')snapshot={...(state.pupiloFilter||{})};
  else snapshot={};
  all[view].push({name:name.trim(),filter:snapshot,ts:nowISO()});
  _writeSavedFilters(all);
  alert('Filtro "'+name.trim()+'" guardado.');
  render();
}
function applySavedFilter(view, idx){
  const list=savedFiltersFor(view);
  const item=list[idx];if(!item)return;
  if(view==='clients'){Object.assign(state.cFilter,item.filter)}
  else if(view==='deals'){state.dFilter=state.dFilter||{};Object.assign(state.dFilter,item.filter)}
  else if(view==='pupilos'){state.pupiloFilter=state.pupiloFilter||{};Object.assign(state.pupiloFilter,item.filter)}
  render();
}
function deleteSavedFilter(view, idx){
  if(!confirm('¿Eliminar este filtro guardado?'))return;
  const all=_loadSavedFilters();
  if(!all[view]||!all[view][idx])return;
  all[view].splice(idx,1);
  _writeSavedFilters(all);
  render();
}
function savedFilterChips(view){
  const list=savedFiltersFor(view);
  if(!list.length)return '<button class="btn sm ghost" onclick="saveCurrentFilter(\''+view+'\')" title="Guardar filtros actuales como preset">+ Guardar filtro</button>';

    '<button class="btn sm ghost" onclick="saveCurrentFilter(\''+view+'\')" title="Guardar filtros actuales">+</button>';

/* ──────────── F10.3 Tier A neglected detection ──────────── */
function tierANeglected(){
  const now=Date.now();const DAY=864e5;const cutoff=30;
  const acts=isCEO()?DB.activities:scopedActivities();
  const lastByCli={};(acts||[]).forEach(a=>{if(a.clientId&&a.date){if(!lastByCli[a.clientId]||a.date>lastByCli[a.clientId])lastByCli[a.clientId]=a.date}});
  const cliList=isCEO()?DB.clients:scopedClients();
  return cliList.filter(c=>(c.tier==='A'||(c.netWorth||0)>=50000000)).map(c=>{
    const last=lastByCli[c.id];
    const days=last?Math.floor((now-new Date(last).getTime())/DAY):999;
    return {c,last,days};
  }).filter(x=>x.days>=cutoff).sort((a,b)=>b.days-a.days);
}

/* ──────────── F10.4 Weekly digest generator (clipboard HTML) ──────────── */
function generateWeeklyDigest(){
  const me=currentUser();if(!me)return;
  const now=new Date();const DAY=864e5;
  const weekAgo=new Date(now.getTime()-7*DAY).toISOString().slice(0,10);
  const weekStart=new Date(now.getTime()-7*DAY);
  /* Datos del consultor */
  const myDeals=scopedDeals();
  const myActs=scopedActivities();
  /* Recent: deals con cambio de stage en últimos 7d */
  const recentMoves=myDeals.filter(d=>(d.stageHistory||[]).some(h=>h.ts&&h.ts.slice(0,10)>=weekAgo)).slice(0,10);
  const wonThisWeek=myDeals.filter(d=>d.stage==='won'&&d.closeDate&&d.closeDate>=weekAgo);
  const lostThisWeek=myDeals.filter(d=>d.stage==='lost'&&d.closeDate&&d.closeDate>=weekAgo);
  const tasksDoneWeek=myActs.filter(a=>a.type==='task'&&a.done&&a.date>=weekAgo);
  const meetingsWeek=myActs.filter(a=>(a.type==='meeting'||a.type==='call')&&a.date>=weekAgo&&a.date<=now.toISOString().slice(0,10));
  const pipelineOpen=myDeals.filter(d=>d.stage!=='won'&&d.stage!=='lost').reduce((s,d)=>s+d.amount,0);
  const wonValue=wonThisWeek.reduce((s,d)=>s+d.amount,0);
  /* Build HTML */
  const fmt=n=>'$'+(Math.round((n||0)/1000)*1000).toLocaleString('en-US');
  const dateRange=weekStart.toLocaleDateString('es-ES',{day:'numeric',month:'short'})+' - '+now.toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'});
  let html='<div style="font-family:Georgia,serif;max-width:680px;line-height:1.5;color:#0F1E33">';
  html+='<h2 style="color:#1B4F8C;border-bottom:2px solid #1B4F8C;padding-bottom:6px">Weekly Digest — '+me.name+'</h2>';
  html+='<p style="color:#6B7A90;font-size:13px">Semana '+dateRange+'</p>';
  html+='<table style="width:100%;border-collapse:collapse;margin:16px 0"><tr>';
  html+='<td style="padding:12px;background:#f5f7fa;border-radius:6px;width:33%"><div style="font-size:11px;color:#6B7A90;text-transform:uppercase">Pipeline abierto</div><div style="font-size:20px;font-weight:700;color:#1B4F8C">'+fmt(pipelineOpen)+'</div></td>';
  html+='<td style="padding:12px;background:#f5f7fa;border-radius:6px;width:33%;margin-left:8px"><div style="font-size:11px;color:#6B7A90;text-transform:uppercase">Won esta semana</div><div style="font-size:20px;font-weight:700;color:#0E7A4A">'+wonThisWeek.length+' · '+fmt(wonValue)+'</div></td>';
  html+='<td style="padding:12px;background:#f5f7fa;border-radius:6px;width:33%"><div style="font-size:11px;color:#6B7A90;text-transform:uppercase">Reuniones</div><div style="font-size:20px;font-weight:700">'+meetingsWeek.length+'</div></td>';
  html+='</tr></table>';
  if(wonThisWeek.length){
    html+='<h3 style="color:#0E7A4A">✓ Cerrados ganados</h3><ul>';
    wonThisWeek.forEach(d=>{const c=findClient(d.clientId);html+='<li><b>'+d.title+'</b> '+(c?'· '+c.name:'')+' — '+fmt(d.amount)+'</li>'});
    html+='</ul>';
  }
  if(lostThisWeek.length){
    html+='<h3 style="color:#B91C1C">✗ Perdidos</h3><ul>';
    lostThisWeek.forEach(d=>{const c=findClient(d.clientId);html+='<li>'+d.title+(c?' · '+c.name:'')+(d.lostReason?' — '+d.lostReason:'')+'</li>'});
    html+='</ul>';
  }
  if(recentMoves.length){
    html+='<h3 style="color:#1B4F8C">Movimientos en pipeline</h3><ul>';
    recentMoves.slice(0,5).forEach(d=>{const sh=(d.stageHistory||[]).filter(h=>h.ts&&h.ts.slice(0,10)>=weekAgo);if(!sh.length)return;const c=findClient(d.clientId);html+='<li><b>'+d.title+'</b>'+(c?' · '+c.name:'')+' → ahora en <b>'+d.stage+'</b></li>'});
    html+='</ul>';
  }
  if(tasksDoneWeek.length){
    html+='<h3>Tareas completadas <span style="font-weight:400;color:#6B7A90">('+tasksDoneWeek.length+')</span></h3><ul>';
    tasksDoneWeek.slice(0,8).forEach(a=>{html+='<li>'+a.title+(a.notes?' <span style="color:#6B7A90">— '+a.notes.slice(0,80)+'</span>':'')+'</li>'});
    if(tasksDoneWeek.length>8)html+='<li style="color:#6B7A90">... y '+(tasksDoneWeek.length-8)+' más</li>';
    html+='</ul>';
  }
  /* Próxima semana — meetings agendadas */
  const nextWeekTop=new Date(now.getTime()+7*DAY).toISOString().slice(0,10);
  const upcoming=myActs.filter(a=>(a.type==='meeting'||a.type==='call')&&a.date>now.toISOString().slice(0,10)&&a.date<=nextWeekTop).sort((a,b)=>a.date.localeCompare(b.date));
  if(upcoming.length){
    html+='<h3 style="color:#1B4F8C">Próxima semana</h3><ul>';
    upcoming.slice(0,8).forEach(a=>{html+='<li>'+fmtDate(a.date)+' — '+a.title+'</li>'});
    html+='</ul>';
  }
  html+='<p style="color:#6B7A90;font-size:11px;margin-top:24px">Generado automáticamente por CEO Advisors CRM</p></div>';
  if(navigator.clipboard&&navigator.clipboard.write){
    const blobHtml=new Blob([html],{type:'text/html'});
    const blobText=new Blob([html.replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim()],{type:'text/plain'});
    navigator.clipboard.write([new ClipboardItem({'text/html':blobHtml,'text/plain':blobText})]).then(()=>{
      alert('✓ Digest semanal copiado al portapapeles. Pégalo en un email.');
    }).catch(()=>{
      navigator.clipboard.writeText(html).then(()=>alert('✓ HTML copiado al portapapeles (texto). Pégalo en un email.'));
    });
  } else {
    const blob=new Blob([html],{type:'text/html'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='digest_'+todayISO()+'_'+me.id+'.html';a.click();
  }
  logAudit('edit','consultant',me.id,'Generó digest semanal');
}

let _gKeyArmed=false;
let _gKeyTimer=null;
const G_NAV_MAP={h:'today',d:'dashboard',p:'deals',c:'clients',e:'companies',u:'pupilos',f:'feed',a:'activities',n:'consultants',t:'templates'};
document.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='g'&&!_gKeyArmed){
    _gKeyArmed=true;
    _gKeyTimer=setTimeout(()=>{_gKeyArmed=false},1500);
    /* Toast efímero indicando "g armado" */
    const tip=document.createElement('div');

  }

async function _supaLogAuditRow(entry){
  if(!window.sb) return;
  try{
    const { data:{ user } } = await sb.auth.getUser();
    if(!user) return;
    const me = (DB.consultants||[]).find(c => c._supaId && DB.currentUserId===c.id);
    const entitySupaId = (function(){
      if(!entry.entityType || !entry.entityId) return null;
      const lookup = {client:DB.clients, company:DB.companies, deal:DB.deals, activity:DB.activities, pupilo:DB.pupilos, consultant:DB.consultants};
      const list = lookup[entry.entityType];
      if(!list) return null;
      const row = list.find(r => r.id===entry.entityId);
      return (row && row._supaId) || null;
    })();
    await sb.from('activity_log').insert({
      user_id: user.id,
      action: entry.action || 'unknown',
      entity: entry.entityType || null,
      entity_id: entitySupaId,
      metadata: { code: entry.entityId, details: entry.details || '' }
    });
  }catch(e){ /* fire-and-forget, no propagar */ }
}

/* ──────────── F15.4e: Realtime subscriptions ──────────── */
let _supaChannels = [];

function _supaApplyRealtimeRow(table, row){
  // Mapear snake_case → camelCase usando los maps de DB
  const uMap = new Map((DB.consultants||[]).filter(c=>c._supaId).map(c=>[c._supaId,c.id]));
  const cMap = new Map((DB.clients||[]).filter(c=>c._supaId).map(c=>[c._supaId,c.id]));
  const coMap = new Map((DB.companies||[]).filter(c=>c._supaId).map(c=>[c._supaId,c.id]));
  const dMap = new Map((DB.deals||[]).filter(c=>c._supaId).map(c=>[c._supaId,c.id]));
  if(table==='deals') return {id:row.code,_supaId:row.id,_supaUpdatedAt:row.updated_at,_isDemo:row.is_demo,title:row.title,clientId:cMap.get(row.client_id)||null,companyId:coMap.get(row.company_id)||null,type:row.type,stage:row.stage,amount:Number(row.amount)||0,closeDate:row.close_date,splits:(row.splits||[]).map(s=>({u:uMap.get(s.u)||s.u,pct:s.pct})),notes:row.notes,createdAt:row.created_at?row.created_at.slice(0,10):'',comments:row.comments||[],stageHistory:row.stage_history||[],lostReason:row.lost_reason||null,wonAt:row.won_at||null,lostAt:row.lost_at||null,tags:row.tags||[]};
  if(table==='clients') return {id:row.code,_supaId:row.id,_supaUpdatedAt:row.updated_at,_isDemo:row.is_demo,name:row.name,email:row.email,phone:row.phone,country:row.country,city:row.city,netWorth:Number(row.net_worth)||0,source:row.source,tier:row.tier,notes:row.notes,comments:row.comments||[],tags:row.tags||[]};
  if(table==='activities') return {id:row.code,_supaId:row.id,_supaUpdatedAt:row.updated_at,_isDemo:row.is_demo,type:row.type,date:row.date,clientId:cMap.get(row.client_id)||null,companyId:coMap.get(row.company_id)||null,dealId:dMap.get(row.deal_id)||null,title:row.title,notes:row.notes,done:!!row.done,createdBy:uMap.get(row.created_by)||null,assignedTo:uMap.get(row.assigned_to)||null};
  return null;
}

function _supaHandleRealtime(table, payload){
  const ev = payload.eventType || payload.event;
  const row = payload.new || payload.old;
  if(!row || !row.id) return;
  // Filtrar echo: si la signature en snapshot ya es igual al row entrante, ignorar
  const snap = _supaLoadSnapshot();
  const code = Object.keys((snap[table]||{})).find(k => snap[table][k] && snap[table][k].supaId===row.id);
  if(code && ev !== 'DELETE'){
    const mapped = _supaApplyRealtimeRow(table, row);
    if(mapped){
      const sig = JSON.stringify(_supaToRow(table, mapped));
      if(sig === snap[table][code].sig) return; // echo del propio cliente
    }
  }
  const list = ({deals:DB.deals,clients:DB.clients,activities:DB.activities})[table];
  if(!list) return;
  if(ev === 'DELETE'){
    const idx = list.findIndex(r => r._supaId===row.id);
    if(idx>=0){ list.splice(idx,1); supaToastRealtime(table+' eliminado'); }
  } else {
    const mapped = _supaApplyRealtimeRow(table, row);
    if(!mapped) return;
    const idx = list.findIndex(r => r._supaId===row.id);
    if(idx>=0){ list[idx] = Object.assign(list[idx], mapped); supaToastRealtime(table+' actualizado'); }
    else { list.push(mapped); supaToastRealtime(table+' nuevo'); }
  }
  try{ Storage.write(JSON.stringify(DB)); _supaUpdateSnapshot(); }catch(e){}
  try{ render(); }catch(e){}
}

function _supaHandleNotifRealtime(payload){
  const ev = payload.eventType || payload.event;
  const row = payload.new || payload.old;
  if(!row || ev==='DELETE') return;
  const me = (DB.consultants||[]).find(c => c.id===DB.currentUserId);
  if(!me || !me._supaId || row.user_id !== me._supaId) return;
  if(!Array.isArray(DB.notifications)) DB.notifications=[];
  const localId = (row.payload && row.payload.localId) || row.id;
  const exists = DB.notifications.find(n => n.id===localId || n._supaNotifId===row.id);
  if(exists){ exists.read = !!row.read; }
  else {
    DB.notifications.unshift({
      id: localId, _supaNotifId: row.id, ts: row.created_at, to: DB.currentUserId,
      from: (row.payload && row.payload.from) || null, kind: row.kind,
      payload: (row.payload && row.payload.payload) || {}, read: !!row.read
    });
    supaToastRealtime('Nueva notificación');
  }
  try{ Storage.write(JSON.stringify(DB)); render(); }catch(e){}
}

async function subscribeRealtime(){
  if(!window.sb) return;
  await unsubscribeRealtime();
  ['deals','clients','activities'].forEach(t => {
    const ch = sb.channel('public:'+t).on('postgres_changes', {event:'*', schema:'public', table:t}, p => _supaHandleRealtime(t, p)).subscribe();
    _supaChannels.push(ch);
  });
  const nch = sb.channel('public:notifications').on('postgres_changes', {event:'*', schema:'public', table:'notifications'}, p => _supaHandleNotifRealtime(p)).subscribe();
  _supaChannels.push(nch);
}

async function unsubscribeRealtime(){
  if(!window.sb) return;
  try{ await sb.removeAllChannels(); }catch(e){}
  _supaChannels = [];
}

function supaToastRealtime(msg){
  let t = document.getElementById('supaToast');

    t = document.createElement('div');

}

/* ────────── Chatbot IA Widget (F-Chatbot) ────────── */
const ChatWidget = (function(){
  const KEY = 'ceoadvisors_chat_history_v1';
  const MAX_MESSAGES = 50;
  const MAX_SCOPED_BYTES = 100_000;
  const ENDPOINT = SUPABASE_URL + '/functions/v1/chat-assistant';

  const state = {
    open: false,
    messages: [],
    loading: false,
    abortCtrl: null,
    unread: 0,
    streamingEl: null,
  };

  // ─── Persistencia localStorage ───
  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      if(!raw) return;
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed)){
        state.messages = parsed
          .filter(m => m && typeof m.role === 'string' && typeof m.content === 'string')
          .slice(-MAX_MESSAGES);
      }
    }catch(e){ console.warn('[chat] load failed', e); }
  }
  function save(){
    try{
      if(state.messages.length > MAX_MESSAGES){
        state.messages = state.messages.slice(-MAX_MESSAGES);
      }
      localStorage.setItem(KEY, JSON.stringify(state.messages));
    }catch(e){ console.warn('[chat] save failed', e); }
  }
  function clearHistory(){
    state.messages = [];
    localStorage.removeItem(KEY);
    render();
  }

  // ─── Markdown parser inline (subset) ───
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function safeHref(url){
    return /^https?:\/\//i.test(url) ? url : '#';
  }
  function parseInline(text){
    let out = escapeHtml(text);
    out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, t, u) =>
      `<a href="${safeHref(u)}" target="_blank" rel="noopener">${t}</a>`);
    out = out.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    out = out.replace(/(^|[^\*])\*([^*\n]+)\*/g, '$1<i>$2</i>');
    out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
    return out;
  }
  function parseMarkdown(md){
    const lines = (md || '').split('\n');
    const out = [];
    let i = 0;
    while(i < lines.length){
      const line = lines[i];
      if(/^```/.test(line)){
        const body = [];
        i++;
        while(i < lines.length && !/^```/.test(lines[i])){ body.push(escapeHtml(lines[i])); i++; }
        i++;
        out.push('<pre>'+body.join('\n')+'</pre>');
        continue;
      }
      if(/^\s*\|.+\|\s*$/.test(line) && i+1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1])){
        const headers = line.trim().replace(/^\||\|$/g,'').split('|').map(s=>s.trim());
        i += 2;
        const rows = [];
        while(i < lines.length && /^\s*\|.+\|\s*$/.test(lines[i])){
          rows.push(lines[i].trim().replace(/^\||\|$/g,'').split('|').map(s=>s.trim()));
          i++;
        }
        out.push('<table><thead><tr>'+headers.map(h=>'<th>'+parseInline(h)+'</th>').join('')+'</tr></thead><tbody>'+
          rows.map(r=>'<tr>'+r.map(c=>'<td>'+parseInline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>');
        continue;
      }
      if(/^\s*[-*]\s+/.test(line) || /^\s*\d+\.\s+/.test(line)){
        const ordered = /^\s*\d+\.\s+/.test(line);
        const items = [];
        while(i < lines.length && (/^\s*[-*]\s+/.test(lines[i]) || /^\s*\d+\.\s+/.test(lines[i]))){
          items.push(lines[i].replace(/^\s*(?:[-*]|\d+\.)\s+/, ''));
          i++;
        }
        out.push('<'+(ordered?'ol':'ul')+'>'+items.map(it=>'<li>'+parseInline(it)+'</li>').join('')+'</'+(ordered?'ol':'ul')+'>');
        continue;
      }
      if(line.trim()===''){ out.push(''); i++; continue; }
      out.push('<p>'+parseInline(line)+'</p>');
      i++;
    }
    return out.join('');
  }

  // ─── scopedData builder ───
  function buildScopedData(){
    if(typeof scopedDeals !== 'function') return {};
    const strip = arr => arr.map(o => {
      const c = {...o};
      delete c._supaId; delete c._supaUpdatedAt;
      return c;
    });
    const me = DB.currentUserId;
    let data = {
      deals: strip(scopedDeals()),
      clients: strip(scopedClients()),
      companies: strip(scopedCompanies()),
      activities: strip(scopedActivities()),
      pupilos: strip((DB.pupilos||[]).filter(p => p.mentor === me || isAdmin())),
      consultants: (DB.consultants||[]).map(c => ({code:c.id, name:c.name, role:c.role})),
    };
    if(JSON.stringify(data).length > MAX_SCOPED_BYTES){
      const sortDesc = a => a.slice().sort((x,y) => (y.updatedAt||y.date||'').localeCompare(x.updatedAt||x.date||''));
      data = {
        deals: sortDesc(data.deals).slice(0,100),
        clients: sortDesc(data.clients).slice(0,50),
        companies: data.companies.slice(0,50),
        activities: sortDesc(data.activities).slice(0,30),
        pupilos: data.pupilos.slice(0,30),
        consultants: data.consultants,
        _truncated: true,
      };
    }
    return data;
  }

  // ─── Render ───
  function render(){
    const list = document.getElementById('chatMessages');
    if(!list) return;
    list.innerHTML = '';
    state.messages.forEach(m => {
      const div = document.createElement('div');
      div.className = 'chat-msg chat-msg-' + m.role;
      if(m.role === 'assistant'){
        div.innerHTML = parseMarkdown(m.content || '');
      }else{
        div.textContent = m.content;
      }
      list.appendChild(div);
    });
    list.scrollTop = list.scrollHeight;
    const badge = document.getElementById('chatFabBadge');
    if(badge){ badge.hidden = state.unread === 0; }
  }
  function appendStreaming(text){
    if(!state.streamingEl){
      const list = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = 'chat-msg chat-msg-assistant chat-cursor';
      list.appendChild(div);
      state.streamingEl = div;
    }
    state.streamingEl._buffer = (state.streamingEl._buffer || '') + text;
    state.streamingEl.innerHTML = parseMarkdown(state.streamingEl._buffer);
    const list = document.getElementById('chatMessages');
    list.scrollTop = list.scrollHeight;
  }
  function appendError(msg){
    const list = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = 'chat-msg-error';
    div.textContent = msg;
    list.appendChild(div);
    list.scrollTop = list.scrollHeight;
  }
  function appendInfo(msg){
    const list = document.getElementById('chatMessages');
    if(!list) return;
    const div = document.createElement('div');
    div.className = 'chat-msg-info';
    div.textContent = msg;
    list.appendChild(div);
    list.scrollTop = list.scrollHeight;
  }

  // ─── Send con SSE ───
  async function send(text){
    if(state.loading){ state.abortCtrl?.abort(); }
    if(!text.trim()) return;

    state.messages.push({role:'user', content:text});
    save();
    render();

    state.loading = true;
    state.streamingEl = null;
    const ctrl = new AbortController();
    state.abortCtrl = ctrl;
    const sendBtn = document.getElementById('chatSend');
    if(sendBtn) sendBtn.disabled = true;

    try{
      const { data:{session} } = await sb.auth.getSession();
      if(!session){ throw new Error('NO_SESSION'); }

      const scoped = buildScopedData();
      if(scoped._truncated){ appendInfo('Mostrando un subset reciente de tus datos (los más actuales).'); }
      const body = { messages: state.messages, scopedData: scoped };
      const res = await fetch(ENDPOINT, {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'Authorization':'Bearer ' + session.access_token,
        },
        body: JSON.stringify(body),
        signal: ctrl.signal,
      });

      if(res.status === 401){ appendError('Tu sesión caducó. Recarga la página.'); return; }
      if(res.status === 429){
        const reset = res.headers.get('X-RateLimit-Reset');
        const min = reset ? Math.max(1, Math.ceil((parseInt(reset,10)*1000 - Date.now())/60000)) : '?';
        appendError(`Has alcanzado el límite de 30 mensajes/hora. Reintenta en ~${min} min.`);
        return;
      }
      if(!res.ok || !res.body){ appendError('Error del servidor. Reintenta más tarde.'); return; }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      let fullText = '';
      while(true){
        const { done, value } = await reader.read();
        if(done) break;
        buf += decoder.decode(value, {stream:true});
        let nl;
        while((nl = buf.indexOf('\n\n')) >= 0){
          const block = buf.slice(0, nl);
          buf = buf.slice(nl + 2);
          if(!block.startsWith('data: ')) continue;
          const payload = block.slice(6).trim();
          if(payload === '[DONE]') continue;
          try{
            const parsed = JSON.parse(payload);
            if(parsed.text){
              fullText += parsed.text;
              appendStreaming(parsed.text);
            }
            if(parsed.error){ appendError(parsed.error); }
          }catch{/* skip malformed */}
        }
      }
      if(fullText){
        state.messages.push({role:'assistant', content:fullText});
        save();
        if(!state.open) state.unread++;
      }
    }catch(err){
      if(err.name === 'AbortError'){ /* silent */ }
      else if(err.message === 'NO_SESSION'){ appendError('No estás logueado. Recarga la página.'); }
      else{ appendError('Sin conexión. Reintenta.'); console.error('[chat]', err); }
    }finally{
      state.loading = false;
      state.abortCtrl = null;
      if(state.streamingEl){
        state.streamingEl.classList.remove('chat-cursor');
        state.streamingEl = null;
      }
      if(sendBtn) sendBtn.disabled = false;
      render();
    }
  }

  // ─── Open/close ───
  function open(){
    state.open = true;
    state.unread = 0;
    document.getElementById('chatPopup').hidden = false;
    setTimeout(()=>document.getElementById('chatInput')?.focus(), 50);
    render();
  }
  function close(){
    state.open = false;
    state.abortCtrl?.abort();
    document.getElementById('chatPopup').hidden = true;
  }
  function toggle(){ state.open ? close() : open(); }

  // ─── Wire-up DOM ───
  function init(){
    load();
    const fab = document.getElementById('chatFab');
    const popup = document.getElementById('chatPopup');
    if(!fab || !popup){
      /* El HTML del widget vive despues de este script tag, asi que en boot
         document.getElementById devuelve null. Re-intentar tras DOMContentLoaded. */
      if(document.readyState === 'loading'){
        document.addEventListener('DOMContentLoaded', init, {once:true});
      }
      return;
    }

    fab.addEventListener('click', toggle);
    document.getElementById('chatClose').addEventListener('click', close);
    document.getElementById('chatClear').addEventListener('click', () => {
      if(confirm('¿Borrar el historial del chat?')) clearHistory();
    });

    const form = document.getElementById('chatForm');
    const input = document.getElementById('chatInput');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value;
      input.value = '';
      send(text);
    });
    input.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        form.requestSubmit();
      }
      if(e.key === 'Escape'){ close(); }
    });
    render();
  }

  return { init, open, close, toggle, _state: state };
})();

(async function bootSupabase(){
  if(!sb)return;
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(!session){supaSetOfflineBanner(false);return}
    /* F15.4-hotfix: REFRESH primero para poblar _supaId reales, LUEGO flush.
       Esto evita que el cliente genere UUIDs ficticios para filas que ya existen
       en backend pero cuyo _supaId local no estaba poblado (causa del bug 409). */
    await refreshFromSupabaseIfPossible();
    try{ _supaSanitizeQueue(); }catch(e){ console.warn('boot sanitize:',e) }
    try{ await flushSupabase() }catch(e){ console.warn('boot flush:',e) }
    try{ showConflictModalIfAny(); }catch(e){ console.warn('boot conflicts:',e) }
    const email=(session.user.email||'').toLowerCase();
    const u=DB.consultants.find(c=>(c.email||'').toLowerCase()===email);
    if(u){
      state.authed=true;
      state.authedUserId=u.id;
      DB.currentUserId=u.id;
      Storage.write(JSON.stringify(DB));
      loadUserPrefs();
      const ov=document.getElementById('loginOverlay');if(ov)ov.remove();
      renderUserSwitcher();
      try{ applyAdminToolsVisibility() }catch(e){}
      setView('today');
    }
  }catch(e){console.warn('boot supabase:',e)}
})();
