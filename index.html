const LOGIN_FAIL_KEY='ceoadvisors_login_fails_v1';
const LOCKOUT_LIMIT=5;
const LOCKOUT_MIN=15;
function _failsRead(){try{return JSON.parse(localStorage.getItem(LOGIN_FAIL_KEY)||'{}')}catch(e){return {}}}
function _failsWrite(o){try{localStorage.setItem(LOGIN_FAIL_KEY,JSON.stringify(o))}catch(e){}}
function loginFailsFor(email){
  const all=_failsRead();const rec=all[email]||{count:0,until:0};
  if(rec.until&&Date.now()>rec.until){delete all[email];_failsWrite(all);return {count:0,until:0}}
  return rec;
}
function loginFailRecord(email){
  const all=_failsRead();const rec=all[email]||{count:0,until:0};rec.count+=1;
  if(rec.count>=LOCKOUT_LIMIT)rec.until=Date.now()+LOCKOUT_MIN*60*1000;
  all[email]=rec;_failsWrite(all);return rec;
}
function loginFailClear(email){const all=_failsRead();delete all[email];_failsWrite(all)}
function passwordStrength(s){
  if(!s)return {score:0,label:'—',color:'#ccc'};
  let n=0;if(s.length>=8)n++;if(s.length>=12)n++;if(/[A-Z]/.test(s))n++;if(/[0-9]/.test(s))n++;if(/[^A-Za-z0-9]/.test(s))n++;
  const labels=['Muy débil','Débil','Aceptable','Fuerte','Muy fuerte','Excelente'];
  const colors=['#dc2626','#ef4444','#f59e0b','#10b981','#059669','#047857'];
  return {score:n,label:labels[n],color:colors[n]};
}
async function doLogin(ev){
  if(ev)ev.preventDefault();
  const email=($('#loginEmail').value||'').trim().toLowerCase();
  const pass=($('#loginPass').value||'');
  const lk=loginFailsFor(email);
  if(lk.until&&Date.now()<lk.until){const min=Math.ceil((lk.until-Date.now())/60000);state.authError=`Cuenta bloqueada tras ${LOCKOUT_LIMIT} intentos. Intenta de nuevo en ${min} min.`;render();return false}
  /* F15.3c: Supabase Auth signInWithPassword (sin fallback PBKDF2) */
  if(!sb){state.authError='Cliente Supabase no disponible. Revisa tu conexión.';render();return false}
  let supaResult;
  try{supaResult=await sb.auth.signInWithPassword({email,password:pass})}
  catch(e){state.authError='Error de red: '+e.message;render();return false}
  if(supaResult.error){
    const r=loginFailRecord(email);
    if(r.until){state.authError=`Has fallado ${LOCKOUT_LIMIT} veces. Cuenta bloqueada por ${LOCKOUT_MIN} minutos.`}
    else if(r.count>=3){state.authError=`Credenciales incorrectas. ${LOCKOUT_LIMIT-r.count} intento(s) antes de bloqueo.`}
    else{state.authError='Email o contraseña incorrectos. Si aún no aceptaste la invitación por email, pide un enlace nuevo al admin.'}
    render();return false;
  }
  loginFailClear(email);
  state.authError='';
  /* Refrescar datos desde Supabase ahora que tenemos sesión */
  try{await refreshFromSupabaseIfPossible()}catch(e){console.warn('refresh post-login:',e)}
  const u=DB.consultants.find(c=>(c.email||'').toLowerCase()===email);
  if(!u){
    state.authError='Sesión válida pero sin perfil en el CRM. Contacta a un admin.';
    try{await sb.auth.signOut()}catch(_){}
    render();return false;
  }
  state.authed=true;
  state.authedUserId=u.id;
  DB.currentUserId=u.id;
  saveDB();
  loadUserPrefs();
  const ov=document.getElementById('loginOverlay');if(ov)ov.remove();
  renderUserSwitcher();
  setView('today');
  return false;
}

function renderNotifsDropdown(){
  const me=DB.currentUserId;
  const list=userNotifs(me).slice(0,30);
  const dd=$('#notifDD');if(!dd)return;
  if(!list.length){
    dd.innerHTML=`<div class="hd"><h4>Notificaciones</h4></div><div class="notif-empty">No tienes notificaciones</div>`;
    return;
  }
  const items=list.map(n=>{
    const from=findConsultant(n.from);
    const lead=n.kind==='mention'?`<b>${from?from.name.split(' ')[0]:'Alguien'}</b> te mencionó en un comentario`
              :n.kind==='comment'?`<b>${from?from.name.split(' ')[0]:'Alguien'}</b> comentó en un deal donde participas`
              :n.kind==='task_assigned'?`<b>${from?from.name.split(' ')[0]:'Alguien'}</b> te asignó una tarea`
              :n.kind==='task_overdue'?`⚠️ <b>Tarea vencida</b> hace ${(n.payload&&n.payload.daysOverdue)||'?'}d`
              :n.kind==='task_due_today'?`📅 Tarea pendiente <b>para hoy</b>`
              :n.kind==='deal_stuck'?`🐌 <b>Deal estancado</b> ${(n.payload&&n.payload.days)||''}d sin avanzar`
              :n.kind==='pupilo_ending'?`🎓 <b>Pupilo terminando</b> en ${(n.payload&&n.payload.daysLeft)||'?'}d`
              :n.kind==='stage'?`Cambio de etapa en deal`
              :'Notificación';
    const snippet=n.payload&&n.payload.snippet?`<div class="meta" style="font-style:italic;color:var(--ink-2);margin-top:4px">"${n.payload.snippet.replace(/</g,'&lt;')}"</div>`:'';
    return `<div class="notif-item ${n.read?'':'unread'}" onclick="openNotif('${n.id}')">
      <div class="dot"></div>
      <div class="body">
        <div class="lead">${lead}</div>
        <div class="meta">${fmtRelTime(n.ts)}</div>
        ${snippet}
      </div>
    </div>`;
  }).join('');
  const unreadN=unreadNotifs(me).length;
  dd.innerHTML=`<div class="hd"><h4>Notificaciones${unreadN?` <span style="background:var(--brand);color:#fff;padding:1px 7px;border-radius:10px;font-size:11px;margin-left:6px">${unreadN}</span>`:''}</h4>${unreadN?'<button class="btn sm ghost" onclick="markAllNotifsRead()">Marcar todas leídas</button>':''}</div>${items}`;
}
function openNotif(id){
  const n=(DB.notifications||[]).find(x=>x.id===id);if(!n)return;
  markNotifRead(id);
  state.notifOpen=false;$('#notifDD').classList.remove('show');
  const p=n.payload||{};
  if(p.entityType==='deal'&&p.entityId){openDeal(p.entityId);state.drawerTab.deal='comments';setTimeout(()=>{const t=document.querySelector('[data-drawer-tab="comments"]');if(t)t.click()},50)}
  else if(p.entityType==='client'&&p.entityId){openClient(p.entityId);state.drawerTab.client='comments';setTimeout(()=>{const t=document.querySelector('[data-drawer-tab="comments"]');if(t)t.click()},50)}

  else if(p.entityType==='activity'&&p.entityId){setView('activities')}
  render();
}

/* ──────────── Hoy — landing operativo ──────────── */
function renderToday(root){
  const now=new Date();const today=now.toISOString().slice(0,10);
  const DAY=864e5;
  const in7=new Date(now.getTime()+7*DAY).toISOString().slice(0,10);
  const stuckThresh=new Date(now.getTime()-21*DAY).toISOString().slice(0,10);
  const followThresh=new Date(now.getTime()-14*DAY).toISOString().slice(0,10);

  const acts=scopedActivities();
  const deals=scopedDeals();
  const openDeals=deals.filter(d=>d.stage!=='won'&&d.stage!=='lost');

  /* 1. Tareas vencidas (type=task con fecha < hoy) */
  const overdue=acts.filter(a=>a.type==='task'&&a.date<today).sort((a,b)=>a.date.localeCompare(b.date));

  /* 2. Próximas 7 días (meetings/calls/task en [hoy, hoy+7]) */
  const upcoming=acts.filter(a=>a.date>=today&&a.date<=in7&&(a.type==='meeting'||a.type==='call'||a.type==='task')).sort((a,b)=>a.date.localeCompare(b.date));

  /* 3. Deals estancados — abiertos cuya última actividad es >21 días o sin actividad */
  const lastActByDeal={};acts.forEach(a=>{if(a.dealId){if(!lastActByDeal[a.dealId]||a.date>lastActByDeal[a.dealId])lastActByDeal[a.dealId]=a.date}});
  const stuck=openDeals.map(d=>{const last=lastActByDeal[d.id]||d.createdAt||'';const daysIdle=last?Math.round((now-new Date(last))/DAY):999;return {d,last,daysIdle}}).filter(x=>x.daysIdle>=21).sort((a,b)=>b.daysIdle-a.daysIdle);

  /* 4. Follow-ups sugeridos — clientes con deals abiertos sin contacto reciente (+14d) */
  const clientOpenDeals={};openDeals.forEach(d=>{if(d.clientId){clientOpenDeals[d.clientId]=(clientOpenDeals[d.clientId]||[]);clientOpenDeals[d.clientId].push(d)}});
  const lastActByClient={};acts.forEach(a=>{if(a.clientId){if(!lastActByClient[a.clientId]||a.date>lastActByClient[a.clientId])lastActByClient[a.clientId]=a.date}});
  const followUps=Object.entries(clientOpenDeals).map(([cid,ds])=>{const c=findClient(cid);if(!c)return null;const last=lastActByClient[cid];const daysSince=last?Math.round((now-new Date(last))/DAY):999;return {c,last,daysSince,openDeals:ds,openAmount:ds.reduce((s,d)=>s+d.amount,0)}}).filter(x=>x&&x.daysSince>=14).sort((a,b)=>b.daysSince-a.daysSince);

  const u=currentUser();
  const greet=(()=>{const h=now.getHours();if(h<12)return'Buenos días';if(h<20)return'Buenas tardes';return'Buenas noches'})();
  const niceDate=now.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});

  root.innerHTML=`
    <div class="page-head">
      <div>
        <div class="page-title">${greet}, ${u.name.split(' ')[0]}</div>
        <div class="page-sub" style="text-transform:capitalize">${niceDate} · tu día de un vistazo</div>
      </div>
      <div class="flex ac gap-s">
        <button class="btn outline" onclick="setView('dashboard')">Ver dashboard</button>
        <button class="btn primary" onclick="openNew('activity')">+ Actividad</button>
      </div>
    </div>

    <div class="kpis" style="grid-template-columns:repeat(4,1fr)">
      ${kpi('Tareas vencidas',overdue.length,overdue.length?'requieren atención hoy':'al día',overdue.length===0,'check',"document.getElementById('tdOverdue')?.scrollIntoView({behavior:'smooth',block:'start'})")}
      ${kpi('Próximos 7 días',upcoming.length,upcoming.length?'reuniones, calls y tareas':'sin compromisos',true,'users',"document.getElementById('tdUpcoming')?.scrollIntoView({behavior:'smooth',block:'start'})")}
      ${kpi('Deals estancados',stuck.length,stuck.length?'+21 días sin actividad':'todo en movimiento',stuck.length===0,'flow',"document.getElementById('tdStuck')?.scrollIntoView({behavior:'smooth',block:'start'})")}
      ${kpi('Follow-ups sugeridos',followUps.length,followUps.length?fmtMoney(followUps.reduce((s,f)=>s+f.openAmount,0))+' en riesgo':'clientes al día',followUps.length===0,'wallet',"document.getElementById('tdFollow')?.scrollIntoView({behavior:'smooth',block:'start'})")}
    </div>

    <div class="today-grid">
      <div class="card" id="tdOverdue">
        <div class="hd"><h3>Tareas vencidas</h3>${overdue.length?'<span class="tag red" style="font-size:10.5px">'+overdue.length+'</span>':''}</div>
        <div class="bd">${overdue.length?overdue.slice(0,8).map(a=>{const d=Math.round((now-new Date(a.date))/DAY);const cl=findClient(a.clientId);return `<div class="today-row click" onclick="openActivity('${a.id}')"><div class="act-ico task">${actIcon('task')}</div><div style="flex:1;min-width:0"><div class="sb" style="color:var(--ink);font-size:13.5px">${a.title}</div><div class="muted" style="font-size:11.5px">${cl?cl.name+' · ':''}${fmtDate(a.date)}</div></div><span class="tag red" style="font-size:10.5px">−${d}d</span></div>`}).join('')+(overdue.length>8?`<div class="muted" style="font-size:11.5px;padding-top:6px">+${overdue.length-8} más…</div>`:''):'<div class="empty">Sin tareas vencidas. <span style="color:var(--positive)">Todo al día.</span></div>'}</div>

/* Tira de VIPs en riesgo — Platinum/Gold con salud watch/cold y pipeline abierto */
function renderVipsAtRisk(clients){
  const openByClient={};scopedDeals().filter(d=>d.stage!=='won'&&d.stage!=='lost').forEach(d=>{if(d.clientId)openByClient[d.clientId]=(openByClient[d.clientId]||0)+d.amount});
  const vips=clients.map(c=>{const h=clientHealth(c);return {c,h,open:openByClient[c.id]||0}}).filter(x=>(x.h.tier.id==='platinum'||x.h.tier.id==='gold')&&(x.h.status==='watch'||x.h.status==='cold')).sort((a,b)=>{const rank={cold:0,watch:1};return rank[a.h.status]-rank[b.h.status]||b.open-a.open||b.c.netWorth-a.c.netWorth}).slice(0,6);
  if(!vips.length)return'';
  const totalRisk=vips.reduce((s,v)=>s+v.open,0);
  return `<div class="card" style="margin-top:14px;border-left:3px solid #B91C1C">
    <div class="hd"><h3>VIPs en riesgo <span class="muted" style="font-weight:400;font-size:12px;margin-left:6px">Platinum/Gold fuera de cadencia · ${fmtMoney(totalRisk)} en pipeline afectado</span></h3><button class="btn sm ghost" onclick="setView('clients')">Ver todos</button></div>
    <div class="bd"><div class="vips-strip">${vips.map(v=>`<div class="vip-card" onclick="openClient('${v.c.id}')"><div class="flex jb ac" style="margin-bottom:5px"><div class="sb" style="color:var(--ink);font-size:13px">${v.c.name} <span class="tier-dot" style="background:${v.h.tier.color}"></span></div>${healthBadge(v.h)}</div><div class="muted" style="font-size:11.5px">${v.c.country} · ${v.h.tier.label} · último toque ${v.h.lastTouchDays==null?'—':v.h.lastTouchDays+'d'}${v.open?' · <span style="color:var(--brand);font-weight:600">'+fmtMoney(v.open)+' abierto</span>':''}</div></div>`).join('')}</div></div>
  </div>`;
}

/* ──────────── dashboard charts ──────────── */
function renderFunnelChart(){
  /* Embudo clásico: trapezoides apilados, paleta de marca (azules) + verde para won. */
  const STAGE_COLORS={prospect:'#BCD2E8',qualified:'#90B6DB',proposal:'#5F93CB',negotiation:'#1B4F8C',won:'#16A34A'};
  const stages=PIPELINE_STAGES.filter(s=>s.id!=='lost');
  const typeFilter=state.funnelType||'all';
  const consFilter=isCEO()?(state.funnelConsultant||'all'):'all';
  const metric=state.funnelMetric==='amt'?'amt':'n';
  let src=scopedDeals();
  if(typeFilter!=='all')src=src.filter(d=>d.type===typeFilter);
  if(consFilter!=='all')src=src.filter(d=>(d.splits||[]).some(sp=>sp.u===consFilter));
  const data=stages.map(s=>{const list=src.filter(d=>d.stage===s.id);return {id:s.id,label:s.label,n:list.length,amt:list.reduce((a,d)=>a+d.amount,0)}});
  const valOf=d=>metric==='amt'?d.amt:d.n;
  const maxV=Math.max(1,...data.map(valOf));
  /* Tamaño compacto, padding simétrico arriba y abajo. */
  const W=520,H=300,cx=W/2;
  const padY=20;
  const topY=padY,botY=H-padY;
  const rowH=(botY-topY)/data.length;
  /* Diferencial más marcado pero con un piso suficiente para que el texto interior siempre sea legible. */
  const maxW=W-48,minW=maxW*0.42;
  const widthOf=v=>minW+(maxW-minW)*(v/maxV);
  const tops=data.map(d=>widthOf(valOf(d)));
  const bots=tops.map((w,i)=>i<tops.length-1?tops[i+1]:w);
  const bands=data.map((d,i)=>{
    const yTop=topY+i*rowH, yBot=topY+(i+1)*rowH;
    const wTop=tops[i], wBot=bots[i];
    const tlx=cx-wTop/2, trx=cx+wTop/2;
    const blx=cx-wBot/2, brx=cx+wBot/2;
    const pts=`${tlx.toFixed(1)},${yTop.toFixed(1)} ${trx.toFixed(1)},${yTop.toFixed(1)} ${brx.toFixed(1)},${yBot.toFixed(1)} ${blx.toFixed(1)},${yBot.toFixed(1)}`;
    return `<polygon points="${pts}" fill="${STAGE_COLORS[d.id]}" stroke="var(--surface)" stroke-width="2" onclick="openFunnelStage('${d.id}')" style="cursor:pointer;transition:filter .15s" onmouseenter="this.style.filter='brightness(1.08)'" onmouseleave="this.style.filter='none'"><title>${d.label} · ${d.n} deals · ${fmtMoney(d.amt)} — click para ver</title></polygon>`;
  }).join('');
  /* Etiqueta dentro del trapezoide en una sola línea: "Etapa · N · $X". minW garantiza que entren incluso con valor 0. */
  const labels=data.map((d,i)=>{
    const yMid=topY+(i+0.5)*rowH;
    return `<text x="${cx}" y="${(yMid+4).toFixed(1)}" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#fff;pointer-events:none;font-variant-numeric:tabular-nums;letter-spacing:.01em">${d.label} · ${d.n} · ${fmtMoney(d.amt)}</text>`;
  }).join('');
  /* Stats elegantes debajo del embudo, sin %. Cada fila clickable. */
  /* Total abierto = sólo etapas pre-Won (prospect→negotiation). Won va aparte. */
  const openOnly=data.filter(d=>d.id!=='won');
  const wonRow=data.find(d=>d.id==='won')||{n:0,amt:0};
  const totalN=openOnly.reduce((s,d)=>s+d.n,0),totalA=openOnly.reduce((s,d)=>s+d.amt,0);
  const stats=`<div class="funnel-stats" style="margin-top:12px;border-top:1px solid var(--line-2);padding-top:10px;display:flex;flex-direction:column;gap:2px">
    ${data.map(d=>`<div class="flex ac jb funnel-stat-row click" onclick="openFunnelStage('${d.id}')" style="padding:5px 4px;border-radius:6px;cursor:pointer;font-size:12.5px">
      <div class="flex ac gap-s"><span style="width:10px;height:10px;border-radius:3px;background:${STAGE_COLORS[d.id]};flex:none"></span><span class="sb" style="color:var(--ink)">${d.label}</span></div>
      <div class="flex ac gap-m" style="font-variant-numeric:tabular-nums"><span class="muted">${d.n} deal${d.n===1?'':'s'}</span><span class="sb" style="color:var(--ink);min-width:80px;text-align:right">${fmtMoney(d.amt)}</span></div>
    </div>`).join('')}
    <div class="flex ac jb" style="padding:7px 4px 2px;border-top:1px dashed var(--line-2);margin-top:4px;font-size:12px">
      <span class="muted" style="text-transform:uppercase;letter-spacing:.06em;font-weight:700">Total abierto <span class="muted" style="font-weight:500;text-transform:none;letter-spacing:0">· sin Won</span></span>
      <div class="flex ac gap-m" style="font-variant-numeric:tabular-nums"><span class="muted">${totalN} deals</span><span class="sb" style="color:var(--brand);min-width:80px;text-align:right">${fmtMoney(totalA)}</span></div>
    </div>
  </div>`;
  return `<style>.funnel-stat-row:hover{background:var(--surface-2)}</style><svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;max-width:540px;margin:0 auto;height:auto">
    ${bands}
    ${labels}
  </svg>${stats}`;
}

function openFunnelStage(stageId){
  const typeId=state.funnelType||'all';
  const consId=isCEO()?(state.funnelConsultant||'all'):'all';
  const stage=PIPELINE_STAGES.find(s=>s.id===stageId);if(!stage)return;
  const deals=scopedDeals().filter(d=>d.stage===stageId&&(typeId==='all'||d.type===typeId)&&(consId==='all'||(d.splits||[]).some(sp=>sp.u===consId)));
  const total=deals.reduce((s,d)=>s+d.amount,0);
  const typeLbl=typeId==='all'?'Todos los tipos':(DEAL_TYPES.find(t=>t.id===typeId)?.label||'');
  const consLbl=consId==='all'?'':' · '+(findConsultant(consId)?.name||'');
  const STAGE_COLORS={prospect:'#94A3B8',qualified:'#60A5FA',proposal:'#F59E0B',negotiation:'#8B5CF6',won:'#16A34A',lost:'#DC2626'};
  const probInfo=stageProbInfo(stage.id);
  const probTip=probInfo.source==='dynamic'?`Calculada con ${probInfo.n} deals históricos`:probInfo.source==='fallback'?'Heurística (pocos datos históricos aún)':'Por definición';
  drawerHd.innerHTML=`<div><h2>${stage.label} · ${deals.length} deal${deals.length===1?'':'s'}</h2><div class="meta"><span class="tag" style="background:${STAGE_COLORS[stage.id]}1a;color:${STAGE_COLORS[stage.id]};border:1px solid ${STAGE_COLORS[stage.id]}40" title="${probTip}">${probInfo.prob}% probabilidad${probInfo.source==='dynamic'?' · histórica':''}</span> · ${typeLbl}${consLbl} · ${fmtMoney(total)}</div></div><button class="drawer-close" onclick="closeDrawer()">✕</button>`;
  drawerBody.innerHTML=deals.length?deals.sort((a,b)=>b.amount-a.amount).map(d=>{
    const c=findClient(d.clientId),co=findCompany(d.companyId),t=dealType(d.type);

function renderWonTrend(){
  /* 12 meses hacia atrás */
  const today=new Date();const months=[];
  for(let i=11;i>=0;i--){const d=new Date(today.getFullYear(),today.getMonth()-i,1);months.push({y:d.getFullYear(),m:d.getMonth(),label:d.toLocaleDateString('es-ES',{month:'short'}),total:0,count:0})}
  scopedDeals().filter(d=>d.stage==='won'&&d.closeDate).forEach(d=>{
    const dt=new Date(d.closeDate);const bucket=months.find(x=>x.y===dt.getFullYear()&&x.m===dt.getMonth());
    if(bucket){bucket.total+=d.amount;bucket.count++}
  });
  window._wonMonths=months;
  const maxV=Math.max(1,...months.map(m=>m.total));
  const W=320,H=160,pad={l:40,r:10,t:14,b:26};
  const xStep=(W-pad.l-pad.r)/(months.length-1||1);
  const yFor=v=>pad.t+(H-pad.t-pad.b)*(1-v/maxV);
  const pts=months.map((m,i)=>[pad.l+i*xStep,yFor(m.total)]);
  const pathLine=pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const pathArea=`${pathLine} L${pts[pts.length-1][0]},${H-pad.b} L${pts[0][0]},${H-pad.b} Z`;
  const gridTicks=4;const ticks=[];for(let k=0;k<=gridTicks;k++){const v=maxV*k/gridTicks;ticks.push({v,y:yFor(v)})}
  const total=months.reduce((s,m)=>s+m.total,0);const count=months.reduce((s,m)=>s+m.count,0);
  return `<div style="position:relative"><svg class="chart-svg" viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="gradArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E7BC4" stop-opacity=".35"/><stop offset="1" stop-color="#2E7BC4" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(t=>`<line class="chart-grid-line" x1="${pad.l}" x2="${W-pad.r}" y1="${t.y}" y2="${t.y}"/><text class="chart-lbl" x="${pad.l-6}" y="${t.y+3}" text-anchor="end" style="font-size:10px">${t.v>=1e6?(t.v/1e6).toFixed(0)+'M':t.v>=1e3?(t.v/1e3).toFixed(0)+'K':t.v.toFixed(0)}</text>`).join('')}
    <path d="${pathArea}" fill="url(#gradArea)"/>
    <path d="${pathLine}" fill="none" stroke="#1B4F8C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${months[i].total>0?3.5:2.5}" fill="${months[i].total>0?'#1B4F8C':'#C9D2E0'}"/>`).join('')}
    ${pts.map((p,i)=>`<rect x="${p[0]-xStep/2}" y="${pad.t}" width="${xStep}" height="${H-pad.t-pad.b}" fill="transparent" style="cursor:pointer" onmouseenter="wonTip(event,${i})" onmouseleave="hideTip('wonTip')" onmousemove="wonTip(event,${i})" onclick="openWonMonth(${i})"/>`).join('')}
    ${months.map((m,i)=>`<text class="chart-lbl" x="${pad.l+i*xStep}" y="${H-8}" text-anchor="middle" style="font-size:10px">${m.label}</text>`).join('')}
  </svg>
  <div id="wonTip" class="chart-tip"></div></div>
  <div class="mini-kpi"><span class="muted">Total 12m · <b style="color:var(--success)">${count}</b> deals won</span><span class="v">${fmtMoney(total)}</span></div>`;
}

function renderLeadToCash(){
  /* Lead-to-Cash: duración promedio en cada etapa, calculada con stageHistory (no con pesos fijos). */
  const stages=PIPELINE_STAGES.filter(s=>s.id!=='lost');
  const typeFilter=state.l2cType||'all';
  let src=scopedDeals();
  if(typeFilter!=='all')src=src.filter(d=>d.type===typeFilter);
  const bandColors={prospect:'#C9D2E0',qualified:'#90B6DB',proposal:'#5F93CB',negotiation:'#2E7BC4',won:'#16A34A'};
  /* Acumulamos días-en-etapa de los stageHistory de deals won. Cada fila history[i] cuenta sus días hasta history[i+1]. La última (won) se cuenta como 0 — ya está cerrado. */
  const days={},counts={};
  stages.forEach(s=>{days[s.id]=0;counts[s.id]=0});
  const wonDeals=src.filter(d=>d.stage==='won'&&Array.isArray(d.stageHistory)&&d.stageHistory.length>=2);
  wonDeals.forEach(d=>{
    const sh=d.stageHistory;
    for(let i=0;i<sh.length-1;i++){
      const stg=sh[i].stage;if(!days.hasOwnProperty(stg))continue;
      const dt=Math.max(0,(new Date(sh[i+1].ts)-new Date(sh[i].ts))/86400000);
      days[stg]+=dt;counts[stg]+=1;
    }
  });
  const avgDaysByStage={};stages.forEach(s=>{avgDaysByStage[s.id]=counts[s.id]?Math.round(days[s.id]/counts[s.id]):0});
  const totalCycle=Object.values(avgDaysByStage).reduce((a,b)=>a+b,0);
  const typeLbl=typeFilter==='all'?'':' · '+(DEAL_TYPES.find(t=>t.id===typeFilter)?.label||'');
  const bigLabel=wonDeals.length?totalCycle+' días':'—';
  const bigSub=`Creación → Won (suma de etapas, ${wonDeals.length} deals${typeLbl})`;
  /* Pipeline en curso: para deals abiertos, días desde el último cambio. */
  const openDeals=src.filter(d=>d.stage!=='won'&&d.stage!=='lost'&&Array.isArray(d.stageHistory)&&d.stageHistory.length);
  const openAvg=openDeals.length?Math.round(openDeals.reduce((a,d)=>{const last=d.stageHistory[d.stageHistory.length-1];return a+Math.max(0,(Date.now()-new Date(last.ts))/86400000)},0)/openDeals.length):0;
  const totalForBar=Math.max(1,totalCycle);
  return `
    <div class="mini-kpi" style="margin-bottom:12px"><span class="muted">Ciclo Lead → Cash</span><span class="v" style="font-size:18px">${bigLabel}</span></div>
    <div class="muted" style="font-size:11.5px;margin-bottom:8px">${bigSub}</div>
    <div style="display:flex;height:12px;border-radius:6px;overflow:hidden;margin-bottom:10px">
      ${stages.map(s=>{const w=avgDaysByStage[s.id]/totalForBar*100;return `<div title="${s.label}: ${avgDaysByStage[s.id]} días" style="width:${w}%;background:${bandColors[s.id]}"></div>`}).join('')}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 14px">
      ${stages.map(s=>{const list=src.filter(d=>d.stage===s.id);const dys=avgDaysByStage[s.id];const sm=counts[s.id];return `<div class="flex ac jb" style="font-size:12px" title="${sm} muestras históricas en ${s.label}"><div class="flex ac gap-s"><span style="width:9px;height:9px;border-radius:2px;background:${bandColors[s.id]}"></span>${s.label} <span class="muted" style="font-size:11px">(${list.length})</span></div><span class="sb" style="color:var(--ink);font-variant-numeric:tabular-nums">${dys} d</span></div>`}).join('')}
    </div>
    <div class="flex jb ac" style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)">
      <span class="muted" style="font-size:11.5px">Pipeline en curso (días en etapa actual)</span>
      <span class="sb" style="color:var(--brand);font-variant-numeric:tabular-nums">${openDeals.length?openAvg+' d':'—'}</span>
    </div>`;
}

function renderDealTypeBreakdown(){
  const open=scopedDeals().filter(d=>d.stage!=='won'&&d.stage!=='lost');
  const total=open.reduce((s,d)=>s+d.amount,0);
  const palette={sale:'#7E2D86',finance:'#2E7BC4',expand:'#0E7A4A',advise:'#D97706',wealth:'#6B7A90'};
  const parts=DEAL_TYPES.map(t=>{const list=open.filter(d=>d.type===t.id);const v=list.reduce((s,d)=>s+d.amount,0);return {id:t.id,label:t.label,v,n:list.length,color:palette[t.id]}}).filter(p=>p.v>0);
  window._dealTypeParts=parts.map(p=>({...p,pct:total?(p.v/total*100):0}));
  if(!parts.length||!total)return'<div class="empty">Sin deals abiertos</div>';
  const R=88,cx=100,cy=100;
  let acc=0;
  const slices=parts.map((p,i)=>{
    const frac=p.v/total;
    if(parts.length===1){
      return `<circle cx="${cx}" cy="${cy}" r="${R}" fill="${p.color}" onmouseenter="dealTypeTip(event,${i})" onmousemove="dealTypeTip(event,${i})" onmouseleave="hideTip('pieTip')"/>`;
    }
    const a0=acc*Math.PI*2-Math.PI/2;acc+=frac;const a1=acc*Math.PI*2-Math.PI/2;
    const large=frac>.5?1:0;
    const x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0);
    const x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
    return `<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${R},${R} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${p.color}" onmouseenter="dealTypeTip(event,${i})" onmousemove="dealTypeTip(event,${i})" onmouseleave="hideTip('pieTip')" style="cursor:pointer;transition:opacity .15s" onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'"/>`;
  }).join('');
  return `<div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:12px">
    <svg class="chart-svg" viewBox="0 0 200 200" style="width:180px;height:180px">${slices}</svg>
    <div id="pieTip" class="chart-tip"></div>
    <div style="display:flex;flex-direction:column;gap:6px;width:100%;padding:0 4px">
      ${parts.map(p=>`<div class="flex ac gap-s" style="font-size:12px"><span style="width:10px;height:10px;border-radius:3px;background:${p.color};flex:none"></span><span style="color:var(--ink-2)">${p.label}</span></div>`).join('')}
    </div>
  </div>`;
}
function dealTypeTip(e,idx){
  const p=(window._dealTypeParts||[])[idx];if(!p)return;
  const tip=document.getElementById('pieTip');if(!tip)return;
  tip.innerHTML=`<b>${p.label}</b><br>${fmtMoney(p.v)} · ${p.pct.toFixed(0)}% · ${p.n} deal${p.n===1?'':'s'}`;

}

/* ──────────── deals (pipeline + lista) ──────────── */
const STAGE_COLORS={prospect:'#94A3B8',qualified:'#60A5FA',proposal:'#F59E0B',negotiation:'#8B5CF6',won:'#16A34A',lost:'#DC2626'};
function renderDeals(root){
  const filter=state.pipelineFilter;
  const deals=scopedDeals().filter(d=>filter==='all'||d.type===filter);
  const openDeals=deals.filter(d=>d.stage!=='won'&&d.stage!=='lost');
  const totalOpen=openDeals.reduce((s,d)=>s+d.amount,0);
  /* Forecast ponderado — Σ amount × probabilidad de etapa */
  const stageBreakdown=PIPELINE_STAGES.filter(s=>s.id!=='won'&&s.id!=='lost').map(s=>{
    const list=openDeals.filter(d=>d.stage===s.id);
    const raw=list.reduce((a,d)=>a+d.amount,0);
    return {stage:s,count:list.length,raw,weighted:raw*getStageProb(s.id)/100};
  });
  const weightedPipeline=stageBreakdown.reduce((s,x)=>s+x.weighted,0);
  const yrStart=new Date(new Date().getFullYear(),0,1);
  const wonYTD=deals.filter(d=>d.stage==='won'&&d.closeDate&&new Date(d.closeDate)>=yrStart).reduce((s,d)=>s+d.amount,0);
  const wonCountYTD=deals.filter(d=>d.stage==='won'&&d.closeDate&&new Date(d.closeDate)>=yrStart).length;
  const conversionRate=totalOpen>0?(weightedPipeline/totalOpen*100):0;
  const totalForecast=weightedPipeline+wonYTD;
  const u=currentUser();
  const today=todayISO();
  const myActs=scopedActivities();
  const tasksOpen=myActs.filter(a=>a.type==='task'&&!a.done&&a.assignedTo===u.id);
  const tasksOverdue=tasksOpen.filter(a=>a.date&&a.date<today);
  root.innerHTML=`
    <div class="page-head">
      <div><div class="page-title">Pipeline</div><div class="page-sub">Panorama del pipeline y forecast por etapa${filter!=='all'?' · Filtro activo: <b>'+dealType(filter).label+'</b>':''}</div></div>
      <div class="flex ac gap-s"><button class="btn outline" id="viewList">Lista</button><button class="btn primary" onclick="openNew('deal')">+ Deal</button></div>
    </div>

    <div class="forecast-card">
      <div class="forecast-kpis">
        <div class="fc-kpi">
          <div class="fc-lbl">Pipeline abierto</div>
          <div class="fc-val" style="color:var(--ink)">${fmtMoney(totalOpen)}</div>
          <div class="fc-sub">${openDeals.length} deals en curso</div>
        </div>
        <div class="fc-kpi">
          <div class="fc-lbl">Forecast ponderado</div>
          <div class="fc-val" style="color:var(--brand)">${fmtMoney(weightedPipeline)}</div>
          <div class="fc-sub">conversión ${conversionRate.toFixed(1)}%</div>
        </div>
        <div class="fc-kpi">
          <div class="fc-lbl">Closed Won YTD</div>
          <div class="fc-val" style="color:var(--positive)">${fmtMoney(wonYTD)}</div>
          <div class="fc-sub">${wonCountYTD} deals ganados</div>
        </div>
        <div class="fc-kpi">
          <div class="fc-lbl">Forecast total año</div>
          <div class="fc-val" style="color:var(--ink)">${fmtMoney(totalForecast)}</div>
          <div class="fc-sub">Won + ponderado</div>
        </div>
      </div>
      <div class="forecast-bar">
        ${stageBreakdown.map(b=>b.weighted>0?`<div class="forecast-seg" style="flex:${b.weighted};background:${STAGE_COLORS[b.stage.id]}" title="${b.stage.label}: ${fmtMoney(b.weighted)} ponderado · ${b.count} deals"></div>`:'').join('')||'<div class="forecast-seg" style="flex:1;background:var(--surface-3)"></div>'}
      </div>
      <div class="forecast-legend">
        ${stageBreakdown.map(b=>`<div><span class="dot" style="background:${STAGE_COLORS[b.stage.id]}"></span><span class="sb">${b.stage.label}</span> <span class="muted">${getStageProb(b.stage.id)}% · ${fmtMoney(b.weighted)}${b.count?' · '+b.count:''}</span></div>`).join('')}
      </div>
    </div>

    <div class="filter-bar">
      <span class="filter-label">Filtrar por tipo</span>
      <div class="chip-row">
        <div class="chip ${filter==='all'?'active':''}" onclick="filterPipeline('all')">Todos</div>
        ${DEAL_TYPES.map(t=>`<div class="chip ${filter===t.id?'active':''}" onclick="filterPipeline('${t.id}')">${t.label}</div>`).join('')}
      </div>
    </div>
    <div class="pipeline" id="pipeline"></div>
    <div class="card mt-m" style="display:none" id="dealList">
      <div class="hd"><h3>Deals (lista)</h3></div>
      <div class="bd p0" style="overflow:auto">
        <table class="tbl">
          <thead><tr><th>Deal</th><th>Cliente</th><th>Empresa</th><th>Tipo</th><th>Etapa</th><th>Splits</th><th>Monto</th><th>Cierre</th></tr></thead>
          <tbody>
            ${deals.map(d=>{const c=findClient(d.clientId),co=findCompany(d.companyId);const t=dealType(d.type),s=stageBy(d.stage);
              return `<tr class="click" onclick="openDeal('${d.id}')"><td class="sb" style="color:var(--ink)">${d.title}</td><td>${c?c.name:'—'}</td><td>${co?co.name:'—'}</td><td><span class="tag ${t.color}">${t.label}</span></td><td>${stagePill(s)}</td><td>${splitAvatars(d.splits)}</td><td class="num sb" style="color:var(--ink)">${fmtMoney(d.amount)}</td><td>${fmtDate(d.closeDate)}</td></tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
    ${tasksOpen.length?`<div class="card mt-m"><div class="hd"><h3>Mis tareas pendientes</h3><span class="muted" style="font-size:11.5px">${tasksOverdue.length} vencidas</span></div>
      <div class="bd"><div style="display:flex;flex-direction:column;gap:6px">
        ${tasksOpen.slice(0,15).map(a=>{const overdue=a.date&&a.date<today;return `<div class="click" onclick="openActivity('${a.id}')" style="cursor:pointer;padding:8px 10px;background:var(--surface-2);border-radius:6px;border-left:3px solid ${overdue?'#dc2626':'var(--brand)'}"><div class="flex jb ac"><span class="sb" style="font-size:12.5px;color:var(--ink)">${a.title}</span><span class="muted" style="font-size:11.5px;color:${overdue?'#dc2626':'inherit'}">${a.date||'sin fecha'}</span></div></div>`}).join('')}
      </div></div>
    </div>`:''}`;
  renderPipeline(deals);
  $('#viewList').addEventListener('click',()=>{const el=$('#dealList'),p=$('#pipeline');const hidden=el.style.display==='none';el.style.display=hidden?'block':'none';p.style.display=hidden?'none':'grid';$('#viewList').textContent=hidden?'Pipeline':'Lista'});
}
function stagePill(s){if(!s)return'';const m={prospect:'gray',qualified:'blue',proposal:'amber',negotiation:'purple',won:'green',lost:'red'};return `<span class="tag ${m[s.id]||'gray'}">${s.label}</span>`}
function filterPipeline(id){state.pipelineFilter=id;render()}
function splitAvatars(splits){
  if(!splits||!splits.length)return '<span class="muted">—</span>';
  return `<div class="splits" style="display:flex">${splits.map(sp=>{const c=findConsultant(sp.u);if(!c)return'';return `<div class="a" title="${c.name} · ${sp.pct}%" style="background:${CONSULTANT_COLORS[c.id]};width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);font-size:9.5px;font-weight:700;color:#fff;display:grid;place-items:center;margin-left:-6px">${initials(c.name)}</div>`}).join('')}</div>`;
}
function renderPipeline(deals){
  $('#pipeline').innerHTML=PIPELINE_STAGES.map(s=>{
    const list=deals.filter(d=>d.stage===s.id);const tot=list.reduce((a,d)=>a+d.amount,0);
    return `<div class="stage" data-stage="${s.id}"><div class="stage-hd"><div class="stage-title"><span class="stage-dot" style="background:${STAGE_COLORS[s.id]||'var(--brand-2)'}"></span>${s.label}</div><span class="stage-count">${list.length}</span></div><div class="stage-total">${fmtMoney(tot)}</div><div class="stage-body">${list.length?list.map(dealCardHtml).join(''):'<div class="muted" style="font-size:12px;padding:8px;text-align:center">—</div>'}</div></div>`;
  }).join('');
  wirePipelineDnD();
}
function dealCardHtml(d){
  const c=findClient(d.clientId),co=findCompany(d.companyId);const t=dealType(d.type);
  const ageBadge=dealAgeBadge(d);
  return `<div class="deal-card" draggable="true" data-deal="${d.id}" onclick="openDeal('${d.id}')">
    <div class="t">${d.title}</div>
    <div class="c">${c?c.name:''}${co?' · '+co.name:''}</div>
    <div class="row"><span class="tag ${t.color}" style="font-size:10.5px">${t.label}</span><span class="amt">${fmtMoney(d.amount)}</span></div>
    <div class="row" style="margin-top:4px"><div class="splits" style="display:flex">${(d.splits||[]).map(sp=>{const cc=findConsultant(sp.u);if(!cc)return'';return `<div class="a" title="${cc.name} · ${sp.pct}%" style="background:${CONSULTANT_COLORS[cc.id]};width:20px;height:20px;border-radius:50%;border:2px solid var(--surface);font-size:9px;font-weight:700;color:#fff;display:grid;place-items:center;margin-left:-6px">${initials(cc.name)}</div>`}).join('')}</div>${ageBadge}</div>
  </div>`;

function wirePipelineDnD(){
  const pipe=$('#pipeline');if(!pipe)return;
  let draggedId=null;let dragSuppressClick=false;
  $$('.deal-card[draggable="true"]',pipe).forEach(card=>{
    card.addEventListener('dragstart',e=>{draggedId=card.dataset.deal;card.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',draggedId);dragSuppressClick=true});
    card.addEventListener('dragend',()=>{card.classList.remove('dragging');draggedId=null;setTimeout(()=>{dragSuppressClick=false},50)});
    /* Evitar que un drag dispare openDeal al soltar */
    card.addEventListener('click',e=>{if(dragSuppressClick){e.stopImmediatePropagation();e.preventDefault()}},true);
  });
  $$('.stage',pipe).forEach(stage=>{
    stage.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';stage.classList.add('drag-over')});
    stage.addEventListener('dragleave',e=>{if(!stage.contains(e.relatedTarget))stage.classList.remove('drag-over')});
    stage.addEventListener('drop',e=>{
      e.preventDefault();stage.classList.remove('drag-over');
      const id=e.dataTransfer.getData('text/plain')||draggedId;if(!id)return;
      const d=findDeal(id);const newStage=stage.dataset.stage;if(!d||d.stage===newStage)return;
      d.stage=newStage;if(newStage==='won'||newStage==='lost')d.closeDate=d.closeDate||new Date().toISOString().slice(0,10);
      saveDB();render();
    });
  });
}

        </div>
        <button class="btn primary" onclick="openNew('activity')">+ Actividad</button>

    <div class="kpis" style="grid-template-columns:repeat(4,1fr)">

          <input id="af_q" placeholder="Título, cliente, notas…" value="${f.q}"></div>

/* ──────────── calendario de actividades ──────────── */
function renderActivitiesCalendar(list){
  const cur=state.calCursor||new Date().toISOString().slice(0,7);
  const [y,m]=cur.split('-').map(Number);
  const first=new Date(y,m-1,1);
  const last=new Date(y,m,0);
  /* Semana arranca lunes (es-ES) */
  const startWeekday=(first.getDay()+6)%7; /* 0=lun…6=dom */
  const totalDays=last.getDate();
  const totalCells=Math.ceil((startWeekday+totalDays)/7)*7;
  const todayKey=new Date().toISOString().slice(0,10);
  /* Index de actividades por fecha */
  const byDate={};list.forEach(a=>{(byDate[a.date]=byDate[a.date]||[]).push(a)});
  /* Header de meses navegable */
  const monthLabel=first.toLocaleDateString('es-ES',{month:'long',year:'numeric'});
  let cells='';
  for(let i=0;i<totalCells;i++){
    const dayNum=i-startWeekday+1;
    const inMonth=dayNum>=1&&dayNum<=totalDays;
    const date=inMonth?new Date(y,m-1,dayNum):new Date(y,m-1,dayNum); /* fechas previas/posteriores válidas */
    const ds=date.toISOString().slice(0,10);
    const evts=(byDate[ds]||[]).slice(0,4);
    const more=(byDate[ds]||[]).length-evts.length;
    const isToday=ds===todayKey;
    cells+=`<div class="cal-cell ${inMonth?'':'muted'} ${isToday?'today':''}" onclick="openNew('activity',{date:'${ds}'})" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="dropOnCalendar(event,'${ds}');this.classList.remove('over')">
      <div class="day">${date.getDate()}</div>
      ${evts.map(a=>{const t=ACTIVITY_TYPES[a.type];return `<div class="cal-evt ${a.type}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','act:${a.id}')" onclick="event.stopPropagation();openActivity('${a.id}')">${t?t.label.slice(0,1):'·'} · ${a.title.slice(0,28)}</div>`}).join('')}
      ${more>0?`<div class="muted" style="font-size:10.5px">+${more} más</div>`:''}
    </div>`;
  }
  const wkHd=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(w=>`<div>${w}</div>`).join('');
  return `<div class="card"><div class="bd">
    <div class="flex jb ac" style="margin-bottom:10px">
      <div class="flex ac gap-s">
        <button class="btn sm outline" onclick="shiftCalendar(-1)">‹</button>
        <button class="btn sm outline" onclick="shiftCalendar(0)">Hoy</button>
        <button class="btn sm outline" onclick="shiftCalendar(1)">›</button>
        <div style="font-family:'IBM Plex Serif',serif;font-size:16px;font-weight:600;text-transform:capitalize;margin-left:6px">${monthLabel}</div>
      </div>
      <div class="muted" style="font-size:11.5px">Click en un día → nueva actividad · arrastra una actividad a otro día para reprogramarla</div>
    </div>
    <div class="cal-hd">${wkHd}</div>
    <div class="cal-grid">${cells}</div>
  </div></div>`;
}
function shiftCalendar(delta){
  const cur=state.calCursor||new Date().toISOString().slice(0,7);
  if(delta===0){state.calCursor=new Date().toISOString().slice(0,7);render();return}
  const [y,m]=cur.split('-').map(Number);
  const d=new Date(y,m-1+delta,1);
  state.calCursor=d.toISOString().slice(0,7);render();
}
function dropOnCalendar(ev, newDate){
  ev.preventDefault();
  const data=ev.dataTransfer.getData('text/plain')||'';
  if(data.startsWith('act:')){
    const id=data.slice(4);const a=DB.activities.find(x=>x.id===id);
    if(a&&a.date!==newDate){const old=a.date;a.date=newDate;logAudit('edit','activity',id,`Movida ${old} → ${newDate}`);saveDB();render()}
  }
}
function filterActs(key,val){
  if(key==='reset'){state.actFilter.range='all';state.actFilter.type='all';state.actFilter.consultant='all';state.actFilter.q='';state.actFilter.docs=false}
  else if(key==='range'){state.actFilter.range=val;state.actFilter.docs=false}
  else if(key==='docs'){state.actFilter.docs=!!val;state.actFilter.range='all'}
  else state.actFilter[key]=val;
  renderActivities($('#content'));
}

/* Mapa de follow-ups por tipo. Devuelve {nextType,daysAhead,title} o null. */
const FOLLOWUP_MAP = {
  meeting: {nextType:'call', daysAhead:7, title:'Follow-up call tras meeting'},
  call:    {nextType:'email',daysAhead:3, title:'Resumen + next steps por email'},
  email:   {nextType:'task', daysAhead:5, title:'Verificar respuesta del cliente'},

function suggestFollowUp(a){
  const cfg=FOLLOWUP_MAP[a.type];
  if(!cfg)return;
  /* Calcular fecha del follow-up */
  const base=a.date?new Date(a.date):new Date();
  base.setDate(base.getDate()+cfg.daysAhead);
  const dateStr=base.toISOString().slice(0,10);
  const cli=findClient(a.clientId);
  const title=cfg.title+(cli?' — '+cli.name:'');
  const msg='Acabas de cerrar: "'+(a.title||a.type)+'"\n\n¿Crear follow-up automático?\n\n  Tipo: '+cfg.nextType+'\n  Fecha: '+dateStr+' ('+cfg.daysAhead+' días)\n  Título: '+title;
  if(!confirm(msg))return;
  DB.activities.push({
    id:uid('a'),type:cfg.nextType,date:dateStr,
    clientId:a.clientId||null,companyId:a.companyId||null,dealId:a.dealId||null,
    title,notes:'Follow-up auto-generado tras "'+(a.title||a.type)+'"',
    done:false,createdBy:DB.currentUserId,

function conPeriodWindow(){
  const now=new Date();const p=state.conPeriod||'year';
  const days=p==='month'?30:p==='quarter'?90:365;
  return {from:new Date(now.getTime()-days*864e5),to:now,key:p,label:p==='month'?'Último mes':p==='quarter'?'Último trimestre':'Último año',days};
}
function dealInPeriod(d,w){
  if(d.closeDate){const dt=new Date(d.closeDate);if(dt>=w.from&&dt<=w.to)return true}
  if(d.createdAt){const dt=new Date(d.createdAt);if(dt>=w.from&&dt<=w.to)return true}
  return false;
}
function consultantStats(){
  const w=conPeriodWindow();
  return DB.consultants.filter(c=>!c.isCEO).map(c=>{
    let nDeals=0,nWon=0,nLost=0,pipelineCredit=0,wonCredit=0;
    DB.deals.forEach(d=>{
      const sp=(d.splits||[]).find(x=>x.u===c.id);if(!sp)return;
      if(!dealInPeriod(d,w))return;
      const credit=d.amount*sp.pct/100;
      nDeals++;
      if(d.stage==='won'){nWon++;wonCredit+=credit}
      else if(d.stage==='lost'){nLost++}
      else pipelineCredit+=credit;
    });
    const closed=nWon+nLost;
    const closing=closed?Math.round(nWon/closed*100):0;
    return {consultantId:c.id,nDeals,nWon,nLost,pipelineCredit,wonCredit,closing};
  });
}
function consultantRichStats(){
  const STAGE_COLORS={prospect:'#94A3B8',qualified:'#60A5FA',proposal:'#F59E0B',negotiation:'#8B5CF6',won:'#16A34A',lost:'#DC2626'};
  const TYPE_COLORS={sale:'#7E2D86',finance:'#2E7BC4',expand:'#0E7A4A',advise:'#D97706',wealth:'#6B7A90'};
  const w=conPeriodWindow();
  return DB.consultants.filter(c=>!c.isCEO).map(c=>{
    let nDeals=0,nWon=0,nLost=0,pipelineCredit=0,wonCredit=0;
    const stageBreakdown={prospect:0,qualified:0,proposal:0,negotiation:0};
    const typeBreakdown={sale:0,finance:0,expand:0,advise:0,wealth:0};
    DB.deals.forEach(d=>{
      const sp=(d.splits||[]).find(x=>x.u===c.id);if(!sp)return;
      if(!dealInPeriod(d,w))return;
      const credit=d.amount*sp.pct/100;
      nDeals++;
      if(d.stage==='won'){nWon++;wonCredit+=credit;typeBreakdown[d.type]=(typeBreakdown[d.type]||0)+credit}
      else if(d.stage==='lost'){nLost++}
      else{pipelineCredit+=credit;if(stageBreakdown[d.stage]!=null)stageBreakdown[d.stage]+=credit;typeBreakdown[d.type]=(typeBreakdown[d.type]||0)+credit}
    });
    const actN=(DB.activities||[]).filter(a=>{const d=new Date(a.date);if(d<w.from||d>w.to)return false;return activityConsultants(a).some(x=>x.id===c.id)}).length;
    const closed=nWon+nLost;const closing=closed?Math.round(nWon/closed*100):0;
    const totalCredit=pipelineCredit+wonCredit;
    return {consultantId:c.id,nDeals,nWon,nLost,pipelineCredit,wonCredit,totalCredit,closing,actN,act30:actN,stageBreakdown,typeBreakdown,STAGE_COLORS,TYPE_COLORS};
  });
}

function conBuckets(){
  const p=state.conPeriod||'year';
  const now=new Date();const buckets=[];
  if(p==='month'){
    for(let i=11;i>=0;i--){
      const d=new Date(now.getFullYear(),now.getMonth()-i,1);
      const nxt=new Date(d.getFullYear(),d.getMonth()+1,1);
      const months=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
      buckets.push({from:d,to:nxt,label:months[d.getMonth()]+(d.getMonth()===0||i===11?' '+String(d.getFullYear()).slice(2):'')});
    }
  } else if(p==='quarter'){
    const qNow=Math.floor(now.getMonth()/3);
    for(let i=7;i>=0;i--){
      const qT=(now.getFullYear()*4+qNow)-i;
      const y=Math.floor(qT/4),q=qT%4;
      buckets.push({from:new Date(y,q*3,1),to:new Date(y,q*3+3,1),label:`Q${q+1} '${String(y).slice(2)}`});
    }
  } else {
    for(let i=4;i>=0;i--){
      const y=now.getFullYear()-i;
      buckets.push({from:new Date(y,0,1),to:new Date(y+1,0,1),label:String(y)});
    }
  }
  return buckets;
}
function conSeriesValues(consultantId,metric,buckets){
  return buckets.map(b=>{
    let v=0;
    if(metric==='wonCredit'){
      DB.deals.forEach(d=>{if(d.stage!=='won'||!d.closeDate)return;const sp=(d.splits||[]).find(x=>x.u===consultantId);if(!sp)return;const dt=new Date(d.closeDate);if(dt<b.from||dt>=b.to)return;v+=d.amount*sp.pct/100});
    } else if(metric==='pipelineCredit'){
      DB.deals.forEach(d=>{if(d.stage==='won'||d.stage==='lost'||!d.createdAt)return;const sp=(d.splits||[]).find(x=>x.u===consultantId);if(!sp)return;const dt=new Date(d.createdAt);if(dt<b.from||dt>=b.to)return;v+=d.amount*sp.pct/100});
    } else if(metric==='actN'){
      (DB.activities||[]).forEach(a=>{const dt=new Date(a.date);if(dt<b.from||dt>=b.to)return;if(activityConsultants(a).some(x=>x.id===consultantId))v++});
    }
    return v;
  });
}

/* ──────────── PUPILOS — internships (estado derivado de fechas) ──────────── */
const PUPILO_COLORS=['linear-gradient(135deg,#0E7A4A,#4FB67E)','linear-gradient(135deg,#7E2D86,#B85DBE)','linear-gradient(135deg,#B25E00,#E69138)','linear-gradient(135deg,#1B4F8C,#2E7BC4)','linear-gradient(135deg,#9B2C2C,#D85959)','linear-gradient(135deg,#0B6BCB,#5BA3E5)'];
const findPupilo=id=>(DB.pupilos||[]).find(p=>p.id===id);
function pupiloAvatar(p,size=32){
  const idx=Math.abs((p.id||'').split('').reduce((s,c)=>s+c.charCodeAt(0),0))%PUPILO_COLORS.length;
  const grad=PUPILO_COLORS[idx];
  return `<div class="avatar" style="background:${grad};width:${size}px;height:${size}px;font-size:${Math.round(size*0.38)}px">${initials(p.name)}</div>`;
}
/* Estado derivado de fechas:
   - sin fechas → 'active' (presente, en curso)
   - startDate en el futuro → 'incoming'
   - endDate en el pasado → 'graduated'
   - en cualquier otro caso → 'active' */
function pupiloStatus(p){
  const today=todayISO();
  if(p.startDate&&today<p.startDate)return 'incoming';
  if(p.endDate&&today>p.endDate)return 'graduated';
  return 'active';
}
function pupiloStatusTag(p){
  const s=pupiloStatus(p);
  const isCons=!!p.consultantId;
  if(s==='active')return isCons?'<span class="tag green">Activo · también consultor</span>':'<span class="tag blue">Activo</span>';
  if(s==='incoming')return '<span class="tag amber">Incoming</span>';
  if(s==='graduated')return isCons?'<span class="tag green">Graduated · sigue como consultor</span>':'<span class="tag gray">Graduated</span>';
  return '<span class="tag">—</span>';
}
function pupiloDurationMonths(p){
  if(!p.startDate||!p.endDate)return 0;
  const a=new Date(p.startDate),b=new Date(p.endDate);
  return Math.max(1,Math.round((b-a)/(1000*60*60*24*30.44)));
}
function pupiloShiftCal(delta){
  const [y,m]=state.pupiloCalCursor.split('-').map(Number);
  const d=new Date(y,m-1+delta,1);
  state.pupiloCalCursor=d.toISOString().slice(0,7);
  render();
}
function pupiloSetTab(t){state.pupiloTab=t;render()}
function pupiloSetFilter(k,v){state.pupiloFilter[k]=v;render()}
function pupiloSortBy(by){if(state.pupiloSort.by===by)state.pupiloSort.dir=state.pupiloSort.dir==='desc'?'asc':'desc';else{state.pupiloSort.by=by;state.pupiloSort.dir='asc'}render()}
function pupiloResetFilters(){state.pupiloFilter={q:'',mentor:'all',university:'all',region:'all',roleType:'all'};render()}
function renderPupilos(root){
  const all=DB.pupilos||[];
  const withStatus=all.map(p=>({...p,_st:pupiloStatus(p)}));
  const counts={active:withStatus.filter(p=>p._st==='active').length,graduated:withStatus.filter(p=>p._st==='graduated').length,incoming:withStatus.filter(p=>p._st==='incoming').length};
  const alsoConsultant=withStatus.filter(p=>p.consultantId).length;
  const tab=state.pupiloTab==='left'?'graduated':state.pupiloTab; /* compat */
  const f=state.pupiloFilter;
  /* filtros */
  const matches=p=>{
    if(p._st!==tab)return false;
    if(f.q){const q=f.q.toLowerCase();if(!(`${p.name} ${p.email||''} ${p.university||''} ${p.program||''} ${p.region||''} ${p.leftCompany||''}`).toLowerCase().includes(q))return false}
    if(f.mentor!=='all'&&p.mentor!==f.mentor)return false;
    if(f.university!=='all'&&p.university!==f.university)return false;
    if(f.region!=='all'&&p.region!==f.region)return false;
    if(f.roleType==='consultant'&&!p.consultantId)return false;
    if(f.roleType==='intern'&&p.consultantId)return false;
    return true;
  };
  const filtered=withStatus.filter(matches);
  /* sort */
  const sortBy=state.pupiloSort.by,sortDir=state.pupiloSort.dir==='desc'?-1:1;
  filtered.sort((a,b)=>{
    const av=a[sortBy]||'',bv=b[sortBy]||'';
    if(sortBy==='duration'){return (pupiloDurationMonths(a)-pupiloDurationMonths(b))*sortDir}
    if(sortBy==='mentor'){const ma=findConsultant(a.mentor);const mb=findConsultant(b.mentor);return ((ma?ma.name:'').localeCompare(mb?mb.name:''))*sortDir}
    return String(av).localeCompare(String(bv))*sortDir;
  });
  /* opciones de filtros (sólo valores presentes) */

  const sortInd=k=>state.pupiloSort.by===k?(state.pupiloSort.dir==='desc'?' ▾':' ▴'):'';

  root.innerHTML=`
    <div class="page-head">
      <div><div class="page-title">Pupilos</div><div class="page-sub">${all.length} pupilos en seguimiento · ${counts.active} activos · ${alsoConsultant} también consultor${alsoConsultant===1?'':'es'}</div></div>
      <div class="flex ac gap-s">
        <div class="map-toggle">${tabBtn('active','Activos',counts.active)}${tabBtn('incoming','Incoming',counts.incoming)}${tabBtn('graduated','Graduated',counts.graduated)}</div>
        ${isAdmin()?'<button class="btn primary" onclick="openNewPupilo()">+ Pupilo</button>':''}
      </div>
    </div>
    <div class="kpis" style="grid-template-columns:repeat(4,1fr)">
      ${kpi('Activos',counts.active,counts.active?'en internship hoy':'sin actividad',true,'users')}
      ${kpi('Incoming',counts.incoming,counts.incoming?'próximas incorporaciones':'sin pipeline',true,'flow')}
      ${kpi('Graduated',counts.graduated,counts.graduated?'completaron su paso':'—',true,'check')}
      ${kpi('También consultores',alsoConsultant,'pupilos con cuenta de consultor',true,'wallet')}
    </div>
    ${renderPupilosCalendar()}
    <div class="card mt-m">
      <div class="hd flex jb ac" style="flex-wrap:wrap;gap:10px">
        <h3>${tab==='active'?'Pupilos activos':tab==='incoming'?'Incoming':'Graduated'} · ${filtered.length} de ${withStatus.filter(p=>p._st===tab).length}</h3>
        <div class="flex ac gap-s" style="flex-wrap:wrap">
          <input type="search" placeholder="Buscar por nombre, universidad…" value="${f.q.replace(/"/g,'&quot;')}" oninput="pupiloSetFilter('q',this.value)" style="min-width:200px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:12.5px" />
          <select onchange="pupiloSetFilter('mentor',this.value)" style="padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:12.5px">
            <option value="all">Todos los mentores</option>
            ${mentorIds.map(id=>{const m=findConsultant(id);return m?`<option value="${id}" ${f.mentor===id?'selected':''}>${m.name}</option>`:''}).join('')}
          </select>
          <select onchange="pupiloSetFilter('university',this.value)" style="padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:12.5px">
            <option value="all">Todas las universidades</option>
            ${universities.map(u=>`<option value="${u}" ${f.university===u?'selected':''}>${u}</option>`).join('')}
          </select>
          <select onchange="pupiloSetFilter('region',this.value)" style="padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:12.5px">
            <option value="all">Todas las regiones</option>
            ${regions.map(r=>`<option value="${r}" ${f.region===r?'selected':''}>${r}</option>`).join('')}
          </select>
          <select onchange="pupiloSetFilter('roleType',this.value)" style="padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:12.5px">
            <option value="all" ${f.roleType==='all'?'selected':''}>Todos</option>
            <option value="intern" ${f.roleType==='intern'?'selected':''}>Sólo interns</option>
            <option value="consultant" ${f.roleType==='consultant'?'selected':''}>Sólo también-consultor</option>
          </select>
          ${savedFilterChips('pupilos')}
          ${filterCount?`<button class="btn sm ghost" onclick="pupiloResetFilters()">Reset (${filterCount})</button>`:''}
        </div>
      </div>
      <div class="bd p0" style="overflow:auto">${filtered.length?renderPupilosTable(filtered,tab,sortInd,sortCls):'<div class="empty" style="padding:30px">Sin pupilos con esos filtros.</div>'}</div>
    </div>
    ${renderPupilosStats(withStatus)}
    <div class="muted mt-m" style="font-size:12px">El estado se calcula automáticamente a partir de las fechas. <b>Activo</b>: hoy está dentro del rango (o no tiene fechas). <b>Incoming</b>: la fecha de inicio es futura. <b>Graduated</b>: la fecha de fin ya pasó. Un pupilo puede ser también consultor (vincúlalo en el formulario).</div>
  `;
}
function renderPupilosTable(list,tab,sortInd,sortCls){
  return `<table class="tbl"><thead><tr>
    <th class="${sortCls('name')}" onclick="pupiloSortBy('name')">Pupilo<span class="sort-i">${sortInd('name')}</span></th>

    <th class="${sortCls('endDate')}" onclick="pupiloSortBy('endDate')">${tab==='graduated'?'Salida':'Fin'}<span class="sort-i">${sortInd('endDate')}</span></th>

/* Estadísticas: distribución por mentor, universidad, destino, duración media, distribución por región */
function renderPupilosStats(list){
  if(!list.length)return '';
  const groupBy=(arr,key,opts={})=>{const m={};arr.forEach(p=>{const k=typeof key==='function'?key(p):p[key];if(!k)return;m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,opts.top||8)};
  const byMentor=groupBy(list,p=>{const m=findConsultant(p.mentor);return m?m.name:null});
  /* 1.6: conversión por mentor — % de pupilos del mentor que se convirtieron en consultor */
  const mentorTotals={};const mentorConvs={};
  list.filter(p=>p._st!=='incoming').forEach(p=>{
    const m=findConsultant(p.mentor);if(!m)return;
    mentorTotals[m.name]=(mentorTotals[m.name]||0)+1;
    if(p.consultantId)mentorConvs[m.name]=(mentorConvs[m.name]||0)+1;
  });
  const byMentorConv=Object.entries(mentorTotals).map(([n,t])=>({n,t,c:mentorConvs[n]||0,pct:t?Math.round((mentorConvs[n]||0)/t*100):0})).sort((a,b)=>b.pct-a.pct||b.c-a.c).slice(0,8);
  const byUni=groupBy(list,'university');
  const byRegion=groupBy(list,'region');
  const byDest=groupBy(list.filter(p=>p._st==='graduated'),'leftCompany');
  const durations=list.filter(p=>pupiloDurationMonths(p)>0).map(p=>pupiloDurationMonths(p));
  const avgDur=durations.length?(durations.reduce((s,n)=>s+n,0)/durations.length):0;
  const totalEligible=list.filter(p=>p._st!=='incoming').length;
  const conversionRate=totalEligible?Math.round(list.filter(p=>p.consultantId).length/totalEligible*100):0;
  const longestStay=list.slice().sort((a,b)=>pupiloDurationMonths(b)-pupiloDurationMonths(a))[0];
  const bar=(v,max)=>`<div class="bar" style="margin-left:auto"><i style="width:${max?(v/max*100):0}%;background:linear-gradient(90deg,var(--brand),var(--brand-2))"></i></div>`;
  const block=(title,sub,entries)=>{const max=Math.max(1,...entries.map(e=>e[1]));return `
    <div class="card"><div class="hd"><h3>${title}</h3><span class="muted" style="font-size:11.5px">${sub}</span></div>
      <div class="bd">${entries.length?entries.map(([k,v])=>`<div class="flex ac jb" style="font-size:12.5px;padding:5px 0;gap:10px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1">${k}</span><span class="sb" style="flex:none;min-width:30px;text-align:right">${v}</span><span style="flex:0 0 100px">${bar(v,max)}</span></div>`).join(''):'<div class="empty">Sin datos.</div>'}</div></div>`};
  return `
    <div class="kpis mt-m" style="grid-template-columns:repeat(4,1fr)">
      ${kpi('Duración media',avgDur?Math.round(avgDur*10)/10+' meses':'—',durations.length+' pupilos con fechas',true,'flow')}
      ${kpi('Tasa conversión',conversionRate+'%','intern → consultor',true,'wallet')}
      ${kpi('Más largo',longestStay&&pupiloDurationMonths(longestStay)?pupiloDurationMonths(longestStay)+' meses':'—',longestStay?longestStay.name.split(' ')[0]:'—',true,'check')}
      ${kpi('Universidades',byUni.length,'distintos centros',true,'users')}
    </div>
    <div class="chart-grid mt-m" style="grid-template-columns:repeat(2,1fr)">
      ${block('Top mentores','pupilos por consultor',byMentor)}
      ${block('Universidades de origen','top 8',byUni)}

/* Calendario tipo Gantt — eje X = meses, filas = pupilos. Muestra intern, conversión y leaves. */
function renderPupilosCalendar(){
  const all=DB.pupilos||[];
  if(!all.length)return '';
  const months=state.pupiloCalMonths||9;
  const [cy,cm]=state.pupiloCalCursor.split('-').map(Number);
  const startMonth=new Date(cy,cm-1,1);
  const endMonth=new Date(cy,cm-1+months,0); /* último día del rango */
  const winStart=startMonth.getTime();
  const winEnd=endMonth.getTime();
  const winSpan=winEnd-winStart;
  /* generar headers de mes */
  const monthLabels=[];
  for(let i=0;i<months;i++){const d=new Date(cy,cm-1+i,1);monthLabels.push({y:d.getFullYear(),m:d.getMonth(),lbl:d.toLocaleDateString('es-ES',{month:'short'})+' '+String(d.getFullYear()).slice(2),isYearStart:d.getMonth()===0})}
  /* incluir todos los pupilos cuyo rango toque la ventana */
  const visible=all.filter(p=>{
    if(!p.startDate||!p.endDate)return false;
    const a=new Date(p.startDate).getTime(),b=new Date(p.endDate).getTime();
    return b>=winStart&&a<=winEnd;
  }).sort((a,b)=>(a.startDate||'').localeCompare(b.startDate||''));
  /* línea de "hoy" */
  const todayT=Date.now();
  const todayPct=(todayT>=winStart&&todayT<=winEnd)?((todayT-winStart)/winSpan*100):null;
  /* color barra por estado computado */
  const barFor=p=>{
    const s=pupiloStatus(p);
    if(s==='incoming')return 'background:repeating-linear-gradient(45deg,#D97706,#D97706 6px,#E69138 6px,#E69138 12px);color:#fff';
    if(s==='graduated')return p.consultantId?'background:linear-gradient(90deg,#0E7A4A,#16A34A);color:#fff':'background:linear-gradient(90deg,#6B7A90,#9AA8BD);color:#fff';
    /* active */
    if(p.consultantId)return 'background:linear-gradient(90deg,#0E7A4A,#16A34A);color:#fff';
    return 'background:linear-gradient(90deg,#1B4F8C,#2E7BC4);color:#fff';
  };
  const rows=visible.map(p=>{
    const a=Math.max(winStart,new Date(p.startDate).getTime());
    const b=Math.min(winEnd,new Date(p.endDate).getTime());
    const left=(a-winStart)/winSpan*100;
    const width=Math.max(2,(b-a)/winSpan*100);
    const dur=pupiloDurationMonths(p);
    const s=pupiloStatus(p);
    const lbl=`${p.name.split(' ')[0]} · ${dur}m${p.consultantId?' · consultor':''}${s==='incoming'?' · incoming':s==='graduated'?' · graduated':''}`;
    const m=findConsultant(p.mentor);
    return `<div class="pup-row" onclick="openPupilo('${p.id}')">
      <div class="pup-row-name"><div class="flex ac gap-xs">${pupiloAvatar(p,26)}<div style="min-width:0"><div class="sb" style="font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.name}</div><div class="muted" style="font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.university||'—'}${m?' · '+m.name.split(' ')[0]:''}</div></div></div></div>
      <div class="pup-row-track">
        <div class="pup-bar" style="left:${left}%;width:${width}%;${barFor(p)}" title="${p.name} · ${fmtDate(p.startDate)} → ${fmtDate(p.endDate)}">${lbl}</div>
      </div>
    </div>`;
  }).join('');
  const headerCols=monthLabels.map((ml,i)=>`<div class="pup-mhd${ml.isYearStart?' yr':''}" style="left:${i/months*100}%;width:${100/months}%">${ml.lbl}</div>`).join('');
  const gridCols=monthLabels.map((ml,i)=>`<div class="pup-gline" style="left:${i/months*100}%"></div>`).join('');
  return `<div class="card mt-m" id="pupCal"><div class="hd">
      <h3>Calendario · cuándo y cuánto viene cada pupilo</h3>
      <div class="flex ac gap-xs">
        <button class="icon-btn" onclick="pupiloShiftCal(-3)" title="Antes">‹</button>
        <span class="muted" style="font-size:12px;min-width:160px;text-align:center">${monthLabels[0].lbl} — ${monthLabels[months-1].lbl}</span>
        <button class="icon-btn" onclick="pupiloShiftCal(3)" title="Después">›</button>
      </div>
    </div>
    <div class="bd">
      ${visible.length?`
      <div class="pup-cal">
        <div class="pup-cal-hd"><div class="pup-row-name muted" style="font-size:11.5px;text-transform:uppercase;letter-spacing:.05em">Pupilo</div><div class="pup-row-track pup-track-hd">${headerCols}</div></div>
        <div class="pup-cal-body">
          <div class="pup-cal-grid">${gridCols}${todayPct!==null?`<div class="pup-today" style="left:${todayPct}%" title="Hoy"></div>`:''}</div>
          ${rows}
        </div>
      </div>
      <div class="flex ac gap-m mt-s muted" style="font-size:11.5px;flex-wrap:wrap">
        <span class="flex ac gap-xs"><span style="display:inline-block;width:18px;height:8px;border-radius:3px;background:linear-gradient(90deg,#1B4F8C,#2E7BC4)"></span>Activo (sólo pupilo)</span>
        <span class="flex ac gap-xs"><span style="display:inline-block;width:18px;height:8px;border-radius:3px;background:linear-gradient(90deg,#0E7A4A,#16A34A)"></span>Pupilo + consultor</span>
        <span class="flex ac gap-xs"><span style="display:inline-block;width:18px;height:8px;border-radius:3px;background:repeating-linear-gradient(45deg,#D97706,#D97706 4px,#E69138 4px,#E69138 8px)"></span>Incoming</span>
        <span class="flex ac gap-xs"><span style="display:inline-block;width:18px;height:8px;border-radius:3px;background:linear-gradient(90deg,#6B7A90,#9AA8BD)"></span>Graduated</span>
        ${todayPct!==null?'<span class="flex ac gap-xs"><span style="display:inline-block;width:2px;height:12px;background:#DC2626"></span>Hoy</span>':''}
      </div>`:'<div class="empty" style="padding:30px">No hay pupilos en este rango. Usa las flechas para mover el calendario.</div>'}
    </div>
  </div>`;
}

async function dropDocOnPupilo(ev,pid){
  ev.preventDefault();
  const dz=document.getElementById('dz_pup_'+pid);if(dz)dz.classList.remove('over');
  const p=findPupilo(pid);if(!p)return;
  const files=ev.dataTransfer&&ev.dataTransfer.files?[...ev.dataTransfer.files]:[];
  if(!files.length)return;
  if(!Array.isArray(p.docs))p.docs=[];
  await ingestDocs(files,p.docs,'pupilo',pid);
  try{saveDB()}catch(e){alert('Algunos archivos no se pudieron guardar (cuota localStorage llena).')}
  openPupilo(pid);
}
function addPupiloDoc(pid){
  const p=findPupilo(pid);if(!p)return;
  const inp=document.createElement('input');inp.type='file';inp.multiple=true;
  inp.onchange=async()=>{
    const files=[...inp.files];if(!files.length)return;
    if(!Array.isArray(p.docs))p.docs=[];
    await ingestDocs(files,p.docs,'pupilo',pid);
    try{saveDB()}catch(e){alert('Algunos archivos no se pudieron guardar (cuota llena).')}
    openPupilo(pid);
  };
  inp.click();
}
function removePupiloDoc(pid,idx){
  const p=findPupilo(pid);if(!p||!p.docs||!p.docs[idx])return;
  if(!confirm('¿Eliminar documento "'+p.docs[idx].name+'"?'))return;
  const name=p.docs[idx].name;
  p.docs.splice(idx,1);
  logAudit('edit','pupilo',pid,'Documento eliminado: '+name);

}
function downloadPupiloDoc(pid,idx){const p=findPupilo(pid);if(!p||!p.docs||!p.docs[idx])return;const dc=p.docs[idx];downloadDoc(dc.dataUrl,dc.name,dc.mime)}

function graduatePupilo(id){const p=findPupilo(id);if(!p)return;const co=prompt('¿A qué empresa se va '+p.name+'? (vacío = sin destino registrado)',p.leftCompany||'');if(co==null)return;const role=prompt('¿En qué rol?',p.leftRole||'')||'';p.leftCompany=co.trim();p.leftRole=role.trim();if(!p.endDate||new Date(p.endDate)>new Date())p.endDate=todayISO();saveDB();openPupilo(id);render()}
function linkPupiloConsultant(id){

function unlinkPupiloConsultant(id){const p=findPupilo(id);if(!p)return;if(!confirm('¿Desvincular la cuenta de consultor de '+p.name+'? El pupilo seguirá existiendo.'))return;delete p.consultantId;saveDB();openPupilo(id);render()}
function deletePupilo(id){

/* ──────────── comisiones ──────────── */
function commissionStats(){
  const rate=state.commRate/100;
  const now=new Date();const yrStart=new Date(now.getFullYear(),0,1);
  return DB.consultants.filter(c=>!c.isCEO).map(c=>{
    let paid=0,pending=0,ytdPaid=0,byType={},bestDeal=null;
    DB.deals.forEach(d=>{
      const sp=(d.splits||[]).find(x=>x.u===c.id);if(!sp)return;
      const credit=d.amount*sp.pct/100;const comm=credit*rate;
      if(d.stage==='won'){
        paid+=comm;
        if(d.closeDate&&new Date(d.closeDate)>=yrStart)ytdPaid+=comm;
        byType[d.type]=(byType[d.type]||0)+comm;
        if(!bestDeal||comm>bestDeal.comm)bestDeal={id:d.id,title:d.title,comm,amount:d.amount,pct:sp.pct};
      } else if(d.stage!=='lost'){
        pending+=comm;
      }
    });
    const totalComm=paid+pending;

  });
}
function renderCommPie(stats,typeColors){
  const mix={};let tot=0;
  stats.forEach(s=>{Object.entries(s.byType).forEach(([k,v])=>{mix[k]=(mix[k]||0)+v;tot+=v})});
  if(!tot)return'<div class="empty">Sin comisiones pagadas aún</div>';
  const parts=DEAL_TYPES.map(t=>({id:t.id,label:t.label,v:mix[t.id]||0})).filter(p=>p.v>0);
  const R=92,cx=110,cy=110;let acc=0;
  const arcs=parts.map(p=>{
    const frac=p.v/tot;const a0=acc*Math.PI*2-Math.PI/2;acc+=frac;const a1=acc*Math.PI*2-Math.PI/2;
    const large=frac>.5?1:0;
    const x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0);
    const x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
    return `<path class="pie-slice" d="M${cx},${cy} L${x0},${y0} A${R},${R} 0 ${large} 1 ${x1},${y1} Z" fill="${typeColors[p.id]}" data-label="${p.label}" data-val="${p.v}" data-pct="${(frac*100).toFixed(1)}"/>`;
  }).join('');
  return `<div style="display:flex;gap:18px;align-items:center">
    <div style="position:relative;flex:none" onmousemove="pieMove(event,this)" onmouseleave="pieHide(this)">
      <svg class="chart-svg pie" viewBox="0 0 220 220" style="width:200px;height:200px">${arcs}
        <circle cx="${cx}" cy="${cy}" r="48" fill="#fff"/>
        <text x="${cx}" y="${cy-2}" text-anchor="middle" class="donut-label">${fmtMoney(tot)}</text>
        <text x="${cx}" y="${cy+14}" text-anchor="middle" class="donut-sub">total</text>
      </svg>
      <div class="pie-tip"></div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:7px;min-width:0">
      ${parts.sort((a,b)=>b.v-a.v).map(p=>`<div class="flex ac jb" style="font-size:12.5px"><div class="flex ac gap-s" style="min-width:0"><span style="width:10px;height:10px;border-radius:3px;background:${typeColors[p.id]};flex:none"></span><span style="color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.label}</span></div><span class="sb" style="color:var(--ink);font-variant-numeric:tabular-nums;flex:none;margin-left:8px">${fmtMoney(p.v)} · ${(p.v/tot*100).toFixed(0)}%</span></div>`).join('')}
    </div>
  </div>`;
}
function pieMove(e,wrap){
  const t=e.target;if(t.tagName!=='path')return pieHide(wrap);
  const tip=wrap.querySelector('.pie-tip');if(!tip)return;
  const l=t.getAttribute('data-label'),v=t.getAttribute('data-val'),p=t.getAttribute('data-pct');
  tip.innerHTML=`<strong>${l}</strong><div style="opacity:.85">${fmtMoney(+v)} · ${p}%</div>`;
  tip.style.opacity=1;
  const r=wrap.getBoundingClientRect();
  tip.style.left=(e.clientX-r.left+14)+'px';
  tip.style.top=(e.clientY-r.top+14)+'px';
}
function pieHide(wrap){const tip=wrap.querySelector('.pie-tip');if(tip)tip.style.opacity=0}

function applyMergeFields(body, ctx){
  return body.replace(/\{\{([A-Z0-9_]+)\}\}/g,(m,k)=>{

function templateFieldList(body){
  const set=new Set();const re=/\{\{([A-Z0-9_]+)\}\}/g;let m;while((m=re.exec(body))!==null)set.add(m[1]);

}

function selectTpl(id){state.tplSel=id;renderTemplates($('#content'))}
function saveTemplateVersion(id){
  const t=TEMPLATES.find(x=>x.id===id);if(!t)return;
  if(!Array.isArray(t._versions))t._versions=[];
  const last=t._versions[t._versions.length-1];
  if(last&&last.body===t.body){alert('Sin cambios respecto a la última versión.');return}
  t._versions.push({ts:nowISO(),userId:DB.currentUserId,body:t.body});
  if(t._versions.length>20)t._versions.shift();
  saveDB();renderTemplates($('#content'));
}
function showTemplateVersions(id){
  const t=TEMPLATES.find(x=>x.id===id);if(!t)return;
  const list=(t._versions||[]).slice().reverse();
  drawerHd.innerHTML=`<div><h2>Versiones — ${t.name}</h2><div class="meta">${list.length} versiones guardadas</div></div><button class="drawer-close" onclick="closeDrawer()">✕</button>`;
  drawerBody.innerHTML=list.length?list.map((v,i)=>{
    const u=findConsultant(v.userId);
    return `<div class="card" style="margin-bottom:10px"><div class="hd"><div><h3>Versión ${list.length-i}</h3><span class="muted" style="font-size:11.5px">${u?u.name:'Sistema'} · ${fmtRelTime(v.ts)}</span></div><button class="btn sm outline" onclick="restoreTemplateVersion('${id}',${(t._versions||[]).indexOf(v)})">Restaurar</button></div><div class="bd"><pre style="white-space:pre-wrap;font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.5;background:var(--surface-2);padding:12px;border-radius:6px;border:1px solid var(--line);max-height:240px;overflow:auto;margin:0">${v.body.replace(/[<>&]/g,m=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[m]))}</pre></div></div>`;
  }).join(''):'<div class="empty">Sin versiones guardadas.</div>';
  openDrawer();
}
function restoreTemplateVersion(id,index){
  const t=TEMPLATES.find(x=>x.id===id);if(!t||!t._versions||!t._versions[index])return;
  if(!confirm('¿Restaurar esta versión? La actual se guardará automáticamente como respaldo.'))return;
  t._versions.push({ts:nowISO(),userId:DB.currentUserId,body:t.body,note:'Backup pre-restore'});
  t.body=t._versions[index].body;
  saveDB();closeDrawer();renderTemplates($('#content'));
}

/* ──────────── mapa D3 (con normalización de nombres) ──────────── */
let WORLD=null;
async function ensureWorld(){
  if(WORLD)return WORLD;
  const res=await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
  WORLD=await res.json();return WORLD;
}
function aggregateByCountry(){
  const map={};
  const region=state.mapRegion||'all';
  scopedClients().forEach(c=>{
    const k=COUNTRY_NORM[c.country]||c.country;
    if(region!=='all'&&REGION_OF[k]!==region)return;
    if(!map[k])map[k]={count:0,nw:0};map[k].count++;map[k].nw+=c.netWorth;
  });
  return map;
}
function renderRegionBar(){
  const bar=$('#regionBar');if(!bar)return;
  const r=state.mapRegion||'all';
  const items=[['all','Mundo'],['latam','Latinoamérica'],['na','Norteamérica'],['eu','Europa'],['africa','África'],['asia','Asia'],['oceania','Oceanía']];
  bar.innerHTML=items.map(([k,lbl])=>`<button class="region-chip ${r===k?'active':''}" data-region="${k}">${lbl}</button>`).join('');
  bar.querySelectorAll('.region-chip').forEach(b=>b.addEventListener('click',()=>{state.mapRegion=b.dataset.region;drawMap();renderRegionBar();if(typeof renderInfluenceTable==='function'&&$('#influenceTbl'))renderInfluenceTable()}));
}
const MAP_PALETTE=['#D6E1EE','#BCD2E8','#90B6DB','#5F93CB','#336DB3','#1B4F8C','#0E2F54'];
async function drawMap(){
  renderRegionBar();
  const svg=d3.select('#worldmap');if(svg.empty())return;
  svg.selectAll('*').remove();
  let world;try{world=await ensureWorld()}catch(e){svg.append('text').attr('x',480).attr('y',250).attr('text-anchor','middle').attr('fill','#6B7A90').text('No se pudo cargar el mapa (sin conexión)');return}
  const raw=topojson.feature(world,world.objects.countries);
  /* Recortamos Antártida y, si hay región seleccionada, todo lo que no pertenezca a ella. */
  const region=state.mapRegion||'all';
  const features=raw.features.filter(f=>f.properties.name!=='Antarctica'&&(region==='all'||REGION_OF[f.properties.name]===region));
  const countries={type:'FeatureCollection',features};
  const vb=svg.attr('viewBox').split(' ');const width=+vb[2],height=+vb[3];
  const projection=d3.geoNaturalEarth1();
  const pad=14;
  if(region==='all'){
    projection.fitExtent([[pad,pad],[width-pad,height-pad]],countries);
  }else{
    /* Encuadre por bbox manual: un rectángulo lon/lat fija el zoom para cada región y evita recortes raros (Oceanía cruzando antimeridiano, Europa hasta los Urales, etc.). */
    const bb=REGION_BBOX[region];
    const polygon={type:'Polygon',coordinates:[[[bb[0][0],bb[0][1]],[bb[1][0],bb[0][1]],[bb[1][0],bb[1][1]],[bb[0][0],bb[1][1]],[bb[0][0],bb[0][1]]]]};
    projection.fitExtent([[pad,pad],[width-pad,height-pad]],polygon);
  }
  const path=d3.geoPath(projection);

  const agg=aggregateByCountry();
  const mode=state.mapMode;
  const values=Object.values(agg).map(v=>mode==='count'?v.count:v.nw);
  const maxVal=Math.max(...values,1);
  const thresholds=MAP_PALETTE.map((_,i)=>maxVal*((i+1)/MAP_PALETTE.length));
  const pickColor=v=>{for(let i=0;i<thresholds.length;i++){if(v<=thresholds[i])return MAP_PALETTE[i]}return MAP_PALETTE[MAP_PALETTE.length-1]};

  const tip=$('#mapTip');
  svg.append('g').selectAll('path').data(countries.features).join('path')
    .attr('class','country').attr('d',path)
    .style('fill',d=>{const name=d.properties.name;const v=agg[name];if(!v)return'#E8ECF2';return pickColor(mode==='count'?v.count:v.nw)})
    .on('mousemove',(e,d)=>{const name=d.properties.name;const v=agg[name];
      if(!v)tip.innerHTML=`<strong>${name}</strong><div style="opacity:.75">sin clientes</div>`;
      else tip.innerHTML=`<strong>${name}</strong><div>${v.count} cliente${v.count>1?'s':''} · ${fmtMoney(v.nw)}</div>`;
      tip.style.opacity=1;tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px';
      d3.select(e.currentTarget).classed('hl',true);
    })
    .on('mouseleave',(e)=>{tip.style.opacity=0;d3.select(e.currentTarget).classed('hl',false)})
    .on('click',(e,d)=>{const name=d.properties.name;const v=agg[name];if(v)filterClientsByCountry(name)});

  /* legend: una celda por banda del scaleQuantize */
  const scaleEl=$('#mapScale');
  if(scaleEl){scaleEl.innerHTML='';MAP_PALETTE.forEach(c=>{const s=document.createElement('span');s.style.background=c;scaleEl.appendChild(s)})}
  const lo=$('#legendLo'),hi=$('#legendHi');
  if(lo)lo.textContent=mode==='count'?'1':'$0';
  if(hi)hi.textContent=mode==='count'?maxVal+' cliente'+(maxVal>1?'s':''):fmtMoney(maxVal);
  const stats=$('#mapStats');
  if(stats){const srcC=scopedClients();const totalC=srcC.length,totalNW=srcC.reduce((s,c)=>s+c.netWorth,0);const cn=Object.keys(agg).length;stats.innerHTML=`<b style="color:var(--ink)">${totalC}</b> clientes · <b style="color:var(--ink)">${fmtMoney(totalNW)}</b> · <b style="color:var(--ink)">${cn}</b> países`}
}
