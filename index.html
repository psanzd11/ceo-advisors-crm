<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CEO Advisors · CRM</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B4F8C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CEO CRM">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@500;600;700&display=swap"
      media="print" onload="this.media='all'">
<noscript>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@500;600;700&display=swap">
</noscript>
<script defer src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script defer src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<style>
  :root{
    --bg:#F6F8FB;--panel:#FFFFFF;--ink:#0F1E33;--ink-2:#3A4A63;--muted:#6B7A90;
    --line:#E4E9F2;--line-2:#EDF1F7;--brand:#1B4F8C;--brand-2:#2E7BC4;--brand-soft:#E8F1FB;
    --accent:#0B6BCB;--success:#16A34A;--warn:#D97706;--danger:#DC2626;
    --positive:#16A34A;
    --surface:#FFFFFF;--surface-2:#FAFBFD;--surface-3:#EEF2F7;--surface-hover:#E7ECF3;
    --tip-bg:#0F1E33;--tip-ink:#FFFFFF;
    --shadow:0 1px 2px rgba(15,30,51,.04),0 4px 12px rgba(15,30,51,.04);
    --nav-w:66px;--nav-w-open:232px;
    --pad-card:16px 18px;--pad-row:11px 14px;--row-gap:14px;--font-base:14px;
  }
  /* Dark mode */
  body.theme-dark{
    --bg:#0E1726;--panel:#15233A;--ink:#E6EDF7;--ink-2:#B7C4D8;--muted:#7E8DA5;
    --line:#22324C;--line-2:#1B2A44;--brand:#5B9BE3;--brand-2:#7DB3EA;--brand-soft:#1E3354;
    --accent:#5B9BE3;--success:#34C759;--warn:#F0A23B;--danger:#F46A6A;
    --positive:#34C759;
    --surface:#15233A;--surface-2:#1B2A44;--surface-3:#22324C;--surface-hover:#2A3A55;
    --tip-bg:#0A1322;--tip-ink:#E6EDF7;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 16px rgba(0,0,0,.32);
  }
  body.theme-dark .login-wrap{background:linear-gradient(135deg,#0E1726 0%,#15233A 100%)}
  body.theme-dark input,body.theme-dark select,body.theme-dark textarea{background:#0E1726;color:var(--ink);border-color:var(--line)}
  body.theme-dark .uswitch,body.theme-dark .udrop,body.theme-dark .notif-dd,body.theme-dark .modal,body.theme-dark .drawer{background:var(--panel)}
  body.theme-dark .search{background:#0E1726}
  body.theme-dark .search:focus-within{background:var(--panel)}
  body.theme-dark .nav-item:hover{background:var(--surface-2)}
  body.theme-dark .udrop-item:hover{background:var(--surface-2)}
  body.theme-dark .tpl-item:hover{background:var(--surface-2)}
  body.theme-dark .activity-item.click:hover,body.theme-dark .today-row.click:hover,body.theme-dark .tl-event:hover,body.theme-dark .tbl tr.click:hover td{background:var(--surface-2)}
  body.theme-dark .icon-btn:hover,body.theme-dark .uswitch:hover,body.theme-dark .btn.outline:hover{background:var(--surface-hover);border-color:var(--line)}
  body.theme-dark .btn.ghost{background:var(--surface-2);color:var(--ink-2)}
  body.theme-dark .btn.ghost:hover{background:var(--surface-hover)}
  body.theme-dark .btn.danger{background:#3A1F1F;color:#F46A6A}
  body.theme-dark .btn.danger:hover{background:#4A2424}
  body.theme-dark .stage{background:var(--surface-2)}
  body.theme-dark .map-toggle{background:var(--surface-2)}
  body.theme-dark .map-toggle button.active{background:var(--surface)}
  body.theme-dark #worldmap .country{stroke:var(--surface)}
  body.theme-dark .deal-card .splits .a,body.theme-dark .ac-avatar,body.theme-dark .ac-more,body.theme-dark .tl-node{border-color:var(--surface)}
  body.theme-dark .login-hint{background:var(--surface-2);color:var(--muted)}
  body.theme-dark .login-hint code{background:var(--surface);color:var(--brand);border-color:var(--line)}
  body.theme-dark .login-err{background:#3A1F1F;color:#F46A6A;border-color:#7A3838}
  body.theme-dark .tag.blue{background:#1F3354;color:#7DB3EA}
  body.theme-dark .tag.green{background:#1F3A2C;color:#5BD17F}
  body.theme-dark .tag.amber{background:#3A2F1A;color:#F0B65A}
  body.theme-dark .tag.purple{background:#2D1F44;color:#B89BEA}
  body.theme-dark .tag.red{background:#3A1F1F;color:#F46A6A}
  body.theme-dark .tag.gray{background:var(--surface-3);color:var(--ink-2)}
  body.theme-dark .tag{background:var(--surface-3);color:var(--ink-2)}
  body.theme-dark .act-ico{background:#1F3354;color:#7DB3EA}
  body.theme-dark .act-ico.meeting{background:#2D1F44;color:#B89BEA}
  body.theme-dark .act-ico.call{background:#1F3A2C;color:#5BD17F}
  body.theme-dark .act-ico.email{background:#3A2F1A;color:#F0B65A}
  body.theme-dark .act-ico.note{background:var(--surface-3);color:var(--ink-2)}
  body.theme-dark .act-ico.task{background:#3A1F1F;color:#F46A6A}
  body.theme-dark .tl-node.meeting{background:#2D1F44;color:#B89BEA}
  body.theme-dark .tl-node.call{background:#1F3A2C;color:#5BD17F}
  body.theme-dark .tl-node.email{background:#3A2F1A;color:#F0B65A}
  body.theme-dark .tl-node.note{background:var(--surface-3);color:var(--ink-2)}
  body.theme-dark .tl-node.task{background:#3A1F1F;color:#F46A6A}
  body.theme-dark .tl-node.deal-open{background:#1F3354;color:#7DB3EA}
  body.theme-dark .tl-node.deal-lost{background:#3A1F1F;color:#F46A6A}
  body.theme-dark .cal-evt.task{background:#3A2F1A;color:#F0B65A}
  body.theme-dark .cal-evt.meeting{background:#1F3354;color:#7DB3EA}
  body.theme-dark .cal-evt.call{background:#1F3A2C;color:#5BD17F}
  body.theme-dark .cal-evt.email{background:#2D1F44;color:#B89BEA}
  body.theme-dark .cal-evt.doc{background:var(--surface-3);color:var(--ink-2)}
  body.theme-dark .drawer-close{background:var(--surface-2);color:var(--muted)}
  body.theme-dark .drawer-close:hover{background:var(--surface-hover);color:var(--ink)}
  body.theme-dark .split-pill{background:var(--surface-2);color:var(--ink-2)}
  body.theme-dark .empty .ilu{background:var(--surface-2);color:var(--muted)}
  /* Compact mode: reduce padding y tipos en bloques densos */
  body.density-compact{--pad-card:10px 13px;--pad-row:7px 10px;--row-gap:9px;--font-base:13px}
  body.density-compact .card .hd{padding:9px 13px}
  body.density-compact .card .bd{padding:10px 13px}
  body.density-compact .kpi{padding:11px 13px}
  body.density-compact .kpi .val{font-size:20px;margin-top:6px}
  body.density-compact .kpis{gap:10px;margin-bottom:12px}
  body.density-compact table td,body.density-compact table th{padding:7px 10px}
  body.density-compact .content{padding:14px 18px 40px}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;letter-spacing:-.003em;font-weight:400;font-feature-settings:"ss01","cv11"}
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:14px}
  a{color:inherit;text-decoration:none}
  /* layout — nav colapsada tipo HubSpot (icon-only, expand on hover) */
  .app{display:grid;grid-template-columns:var(--nav-w) 1fr;height:100vh}
  aside.nav{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;width:var(--nav-w);overflow:hidden;transition:width .22s cubic-bezier(.4,0,.2,1);position:relative;z-index:40}
  aside.nav:hover,aside.nav.pinned{width:var(--nav-w-open);box-shadow:4px 0 24px rgba(15,30,51,.08)}
  .logo{padding:16px 14px 12px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;min-height:58px}
  .logo-brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
  .logo-swoosh{width:38px;height:19px;flex:none}
  .logo-text{display:flex;flex-direction:column;line-height:1;opacity:0;transform:translateX(-4px);transition:opacity .18s,transform .18s}
  aside.nav:hover .logo-text{opacity:1;transform:translateX(0)}
  .logo-text .t1{font-weight:700;color:var(--ink);letter-spacing:.14em;font-size:13px;font-family:'IBM Plex Serif','IBM Plex Sans',serif}
  .logo-text .t2{font-weight:400;color:#8593A6;letter-spacing:.28em;font-size:9.5px;margin-top:3px}
  .nav-list{padding:10px 10px;display:flex;flex-direction:column;gap:2px;flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
  .nav-list::-webkit-scrollbar{width:6px}
  .nav-list::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:3px}
  .nav-list::-webkit-scrollbar-track{background:transparent}
  .nav-section{font-family:'IBM Plex Serif','IBM Plex Sans',serif;font-size:10.5px;font-weight:600;color:#8A98AE;text-transform:uppercase;letter-spacing:.14em;padding:16px 12px 6px;white-space:nowrap;overflow:hidden;opacity:0;transition:opacity .18s}
  aside.nav:hover .nav-section{opacity:1}
  .nav-item{display:flex;align-items:center;gap:14px;padding:9px 12px;border-radius:8px;color:var(--ink-2);font-weight:500;font-size:13.5px;cursor:pointer;user-select:none;white-space:nowrap;overflow:hidden;font-family:'IBM Plex Serif','IBM Plex Sans',serif;letter-spacing:.01em}
  .nav-item:hover{background:var(--surface-2);color:var(--ink)}
  .nav-item.active{background:var(--brand-soft);color:var(--brand);font-weight:600}
  .nav-item svg{width:20px;height:20px;flex:none;stroke-width:1.8}
  .nav-item .lbl{opacity:0;transform:translateX(-4px);transition:opacity .18s,transform .18s}
  aside.nav:hover .nav-item .lbl{opacity:1;transform:translateX(0)}
  .nav-footer{margin-top:auto;padding:12px 14px;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:10px;white-space:nowrap;overflow:hidden}
  .nav-footer .nf-text{opacity:0;transition:opacity .18s}
  aside.nav:hover .nav-footer .nf-text{opacity:1}
  .avatar{width:26px;height:26px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;background:linear-gradient(135deg,var(--brand),var(--brand-2));flex:none}

  main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
  header.topbar{height:58px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:14px;padding:0 22px}
  .crumbs{font-size:13px;color:var(--muted)}
  .crumbs strong{color:var(--ink);font-weight:600}
  .search{flex:1;max-width:380px;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid transparent;border-radius:8px;padding:7px 10px}
  .search:focus-within{background:var(--surface);border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(46,123,196,.15)}
  .search input{border:0;background:transparent;outline:0;flex:1;font-size:13px}
  .search svg{width:15px;height:15px;color:var(--muted)}
  .topbar-actions{display:flex;align-items:center;gap:8px;position:relative}
  .icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:inline-grid;place-items:center;cursor:pointer;transition:.15s;position:relative}
  .icon-btn:hover{border-color:#C9D2E0;background:var(--surface-2);color:var(--ink)}
  .icon-btn svg{width:16px;height:16px}
  body.theme-dark .icon-btn{background:var(--panel);color:var(--ink-2)}
  .notif-wrap{position:relative}
  .notif-badge{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;border-radius:10px;min-width:18px;height:18px;font-size:10.5px;font-weight:700;display:inline-grid;place-items:center;padding:0 5px;border:2px solid var(--panel)}
  .notif-dd{position:absolute;top:42px;right:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 32px rgba(15,30,51,.18);width:360px;max-height:480px;overflow:auto;display:none;z-index:90}
  .notif-dd.show{display:block}
  .notif-dd .hd{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line-2);position:sticky;top:0;background:var(--panel);z-index:1}
  .notif-dd .hd h4{margin:0;font-family:'IBM Plex Serif',serif;font-size:14.5px;font-weight:600}
  .notif-item{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-2);cursor:pointer;transition:.15s}
  .notif-item:hover{background:var(--line-2)}
  .notif-item.unread{background:var(--brand-soft)}
  .notif-item.unread:hover{background:#dde9f6}
  .notif-item .dot{width:8px;height:8px;border-radius:50%;background:var(--brand-2);flex:none;margin-top:6px;visibility:hidden}
  .notif-item.unread .dot{visibility:visible}
  .notif-item .body{flex:1;min-width:0}
  .notif-item .body .lead{font-size:12.5px;color:var(--ink);font-weight:500;line-height:1.35}
  .notif-item .body .meta{font-size:11px;color:var(--muted);margin-top:3px}
  .notif-empty{padding:32px 18px;text-align:center;color:var(--muted);font-size:12.5px}

  /* mentions inline + comments */
  .mention{background:var(--brand-soft);color:var(--brand);padding:0 5px;border-radius:4px;font-weight:600;font-size:12.5px}
  .comments-list{display:flex;flex-direction:column;gap:10px}
  .comment{display:flex;gap:10px;padding:10px 12px;background:var(--bg);border:1px solid var(--line-2);border-radius:10px}
  .comment .body{flex:1;min-width:0}
  .comment .meta{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .comment .meta .nm{font-weight:600;font-size:12.5px;color:var(--ink)}
  .comment .meta .ts{font-size:11px;color:var(--muted)}
  .comment .text{font-size:13px;line-height:1.5;color:var(--ink-2)}
  .comment .del{margin-left:auto;color:var(--muted);font-size:11px;cursor:pointer}
  .comment .del:hover{color:var(--danger)}
  .comment-input-wrap{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
  .comment-input-wrap textarea{flex:1;border:0;outline:0;resize:none;font:inherit;background:transparent;min-height:48px;color:var(--ink)}
  .audit-list{display:flex;flex-direction:column;gap:6px}
  .audit-row{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px}
  .audit-row:hover{background:var(--line-2)}
  .audit-row .ico{width:24px;height:24px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:12px;flex:none}
  .audit-row .body{flex:1}
  .audit-row .body .top{font-size:12.5px;color:var(--ink)}
  .audit-row .body .bot{font-size:11px;color:var(--muted);margin-top:2px}

  /* Calendario actividades */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
  .cal-cell{min-height:88px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 8px;display:flex;flex-direction:column;gap:4px;font-size:12px;cursor:pointer;transition:.15s}
  .cal-cell:hover{border-color:var(--brand-2);box-shadow:0 4px 12px rgba(46,123,196,.08)}
  .cal-cell.muted{opacity:.45}
  .cal-cell.today{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
  .cal-cell .day{font-weight:600;color:var(--ink);font-size:12px}
  .cal-cell .day .wk{color:var(--muted);font-weight:400;margin-left:4px;font-size:10.5px}
  .cal-evt{font-size:10.5px;line-height:1.25;padding:2px 5px;border-radius:4px;background:var(--brand-soft);color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cal-evt.task{background:#FFF7E0;color:#92580A}
  .cal-evt.meeting{background:#E6F1FB;color:var(--brand)}
  .cal-evt.call{background:#E9F7EF;color:#197A4D}
  .cal-evt.email{background:#F2EAFB;color:#6B3FBF}
  .cal-evt.doc{background:var(--surface-2);color:var(--ink-2)}
  .cal-hd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 4px}

  /* Drag&drop área de docs */
  .dz-drop{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);font-size:12.5px;transition:.15s;cursor:pointer}
  .dz-drop:hover,.dz-drop.over{border-color:var(--brand-2);background:var(--brand-soft);color:var(--brand)}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:7px;font-weight:600;font-size:13px;transition:.15s;white-space:nowrap}
  .btn svg{width:15px;height:15px}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:hover{background:#15406F}
  .btn.ghost{background:var(--surface-2);color:var(--ink-2)}
  .btn.ghost:hover{background:#E7ECF3}
  .btn.outline{border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
  .btn.outline:hover{border-color:#C9D2E0;background:var(--surface-2)}
  .btn.sm{padding:5px 10px;font-size:12px;font-weight:500}
  .btn.danger{background:#FCE8E8;color:#B91C1C}
  .btn.danger:hover{background:#F9D5D5}

  /* user switcher */
  .uswitch{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 6px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:.15s}
  .uswitch:hover{border-color:#C9D2E0;background:var(--surface-2)}
  .uswitch .nm{font-weight:600;font-size:12.5px;color:var(--ink);line-height:1}
  .uswitch .rl{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1}
  .uswitch .col{display:flex;flex-direction:column}
  .uswitch svg.chev{width:12px;height:12px;color:var(--muted)}
  .udrop{position:absolute;top:46px;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(15,30,51,.18);min-width:240px;padding:6px;display:none;z-index:80}
  .udrop.show{display:block}
  .udrop-hd{padding:8px 10px 4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  .udrop-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;cursor:pointer}
  .udrop-item:hover{background:var(--surface-2)}
  .udrop-item .nm{font-size:13px;font-weight:600;color:var(--ink);line-height:1.1}
  .udrop-item .rl{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.1}
  .udrop-item.current{background:var(--brand-soft)}
  .udrop-item .check{margin-left:auto;color:var(--brand);font-weight:700;font-size:14px}

  /* login — overlay fijo que cubre toda la pantalla */
  .login-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:40px 24px;background:linear-gradient(135deg,#F7FAFD 0%,#EEF3F9 100%);z-index:200;overflow:auto}
  .login-card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 48px rgba(15,30,51,.10);padding:28px 28px 24px}
  .login-brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .login-brand .t1{font-family:'IBM Plex Serif',serif;font-size:22px;font-weight:600;color:var(--brand);letter-spacing:-.01em}
  .login-brand .t2{font-family:'IBM Plex Serif',serif;font-size:13.5px;letter-spacing:.22em;color:var(--muted);font-weight:500}
  .login-h{font-family:'IBM Plex Serif',serif;font-size:22px;font-weight:600;color:var(--ink);letter-spacing:-.01em;margin:6px 0 4px}
  .login-sub{color:var(--muted);font-size:13px;margin-bottom:20px}
  .login-field{margin-bottom:14px}
  .login-field label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
  .login-field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;color:var(--ink);background:var(--surface);transition:border .15s,box-shadow .15s}
  .login-field input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .login-err{background:#FEF2F2;color:#B91C1C;border:1px solid #FCA5A5;padding:9px 11px;border-radius:8px;font-size:12.5px;margin-bottom:14px}
  .login-btn{width:100%;padding:12px;background:var(--brand);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s}
  .login-btn:hover{background:#123D6B}
  .login-hint{margin-top:18px;padding:12px 14px;background:var(--surface-2);border-radius:8px;font-size:11.5px;color:var(--muted);line-height:1.55}
  .login-hint b{color:var(--ink);font-weight:600}
  .login-hint code{background:var(--surface);padding:1px 6px;border-radius:4px;border:1px solid var(--line);font-size:11px;color:var(--brand)}
  /* cuando hay login activo, el overlay cubre todo; no tocamos el grid */

  .content{flex:1;overflow:auto;padding:22px 26px 60px}
  .page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:14px;flex-wrap:wrap}
  .page-title{font-family:'IBM Plex Serif','IBM Plex Sans',serif;font-size:23px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
  .page-sub{font-family:'IBM Plex Serif','IBM Plex Sans',serif;color:var(--muted);font-size:13px;margin-top:3px;letter-spacing:.005em}

  /* cards / kpi */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
  .card .hd{padding:14px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;justify-content:space-between;gap:10px}
  .card .hd h3{margin:0;font-size:14px;font-weight:600}
  .card .bd{padding:16px 18px}
  .card .bd.p0{padding:0}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);position:relative}
  .kpi.click{cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}
  .kpi.click:hover{transform:translateY(-2px);border-color:var(--brand-2);box-shadow:0 8px 22px rgba(46,123,196,.14)}
  .kpi-chev{position:absolute;top:12px;right:14px;color:var(--muted);font-size:18px;opacity:.4;transition:opacity .15s,color .15s}
  .kpi.click:hover .kpi-chev{opacity:1;color:var(--brand)}
  .kpi .lbl{color:var(--muted);font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px}
  .kpi .lbl .ico{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
  .kpi .lbl .ico svg{width:14px;height:14px}
  .kpi .val{font-size:24px;font-weight:700;margin-top:10px;letter-spacing:-.02em}
  .kpi .sub{color:var(--muted);font-size:12px;margin-top:4px}
  .kpi .sub .up{color:var(--success);font-weight:600}.kpi .sub .down{color:var(--danger);font-weight:600}
  .grid-2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
  @media(max-width:1100px){.grid-2{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}

  /* tables */
  table.tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:10px 16px;background:var(--surface-2);border-bottom:1px solid var(--line-2);user-select:none}
  .tbl th.sortable{cursor:pointer}
  .tbl th.sortable:hover{color:var(--brand)}
  .tbl th .sort-i{display:inline-block;margin-left:4px;opacity:.4;transition:.1s}
  .tbl th.sorted .sort-i{opacity:1;color:var(--brand)}
  .tbl td{padding:12px 16px;border-bottom:1px solid var(--line-2);color:var(--ink-2);vertical-align:middle}
  .tbl tr:last-child td{border-bottom:0}
  .tbl tr.click{cursor:pointer}
  .tbl tr.click:hover td{background:var(--surface-2)}
  .tbl .name{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:600}
  .tbl .pill-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#B0C4E0,#6E96C4);color:#fff;display:grid;place-items:center;font-weight:700;font-size:11px;flex:none}
  .tbl .pill-avatar.c{background:linear-gradient(135deg,#D4A574,#B97F45)}
  .tbl .num{font-variant-numeric:tabular-nums}
  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}
  .empty .ilu{width:44px;height:44px;margin:0 auto 10px;background:var(--surface-2);border-radius:50%;display:grid;place-items:center;color:var(--muted)}

  .tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
  .tag.blue{background:#E8F1FB;color:#1E5BA0}.tag.green{background:#E6F6EC;color:#15803D}
  .tag.amber{background:#FDF4E3;color:#B45309}.tag.purple{background:#F1E9FB;color:#6D28D9}
  .tag.red{background:#FCE8E8;color:#B91C1C}.tag.gray{background:var(--surface-3);color:#475569}

  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .toolbar .sep{flex:1}
  .chip{padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--ink-2);cursor:pointer}
  .chip:hover{border-color:#C9D2E0}
  .chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}

  /* filters bar (clients) */
  .filterbar{display:grid;grid-template-columns:1.2fr 180px 180px 320px;gap:12px;align-items:end;margin-bottom:14px}
  .filterbar.clients{grid-template-columns:1.2fr 200px 320px}
  @media(max-width:1100px){.filterbar,.filterbar.clients{grid-template-columns:1fr}}
  .tpl-item{padding:10px 16px;border-left:3px solid transparent;cursor:pointer;transition:background .12s}
  .tpl-item:hover{background:var(--surface-2)}
  .tpl-item.active{background:var(--brand-soft);border-left-color:var(--brand)}
  .fb-field label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:5px}
  .fb-input{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;height:36px}
  .fb-input:focus-within{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(46,123,196,.15)}
  .fb-input input,.fb-input select{border:0;background:transparent;outline:0;flex:1;font-size:13px;color:var(--ink)}
  .fb-input svg{width:14px;height:14px;color:var(--muted)}

  /* dual range slider (Zillow-style) */
  .dr-wrap{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px 8px;height:auto}
  .dr-labels{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:5px;font-variant-numeric:tabular-nums}
  .dr-slider{position:relative;height:22px}
  .dr-track{position:absolute;left:0;right:0;top:9px;height:4px;background:#E4E9F2;border-radius:2px}
  .dr-fill{position:absolute;top:9px;height:4px;background:var(--brand);border-radius:2px}
  .dr-slider input[type=range]{position:absolute;left:0;right:0;top:0;width:100%;height:22px;-webkit-appearance:none;appearance:none;background:transparent;pointer-events:none;margin:0}
  .dr-slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:var(--surface);border:2px solid var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:grab;pointer-events:auto;margin-top:-7px}
  .dr-slider input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--surface);border:2px solid var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:grab;pointer-events:auto}

  /* pipeline */
  .pipeline{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;align-items:start;overflow-x:auto;padding-bottom:14px}
  .stage{background:var(--surface-3);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:300px}
  .stage-hd{padding:10px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .stage-title{font-size:12.5px;font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
  .stage-dot{width:8px;height:8px;border-radius:50%;background:var(--brand-2)}
  .stage-count{font-size:11px;color:var(--muted);background:var(--surface);padding:1px 7px;border-radius:999px;border:1px solid var(--line)}
  .stage-total{font-size:11.5px;color:var(--muted);padding:8px 13px 6px}
  .stage-body{padding:6px 10px 12px;display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:60px}
  .deal-card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 11px;cursor:pointer;transition:.15s;box-shadow:0 1px 1px rgba(15,30,51,.03)}
  .deal-card:hover{border-color:var(--brand-2);box-shadow:0 4px 10px rgba(46,123,196,.12)}
  .deal-card .t{font-weight:600;font-size:13px;color:var(--ink);line-height:1.25}
  .deal-card .c{color:var(--muted);font-size:11.5px;margin-top:3px}
  .deal-card .row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
  .deal-card .amt{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
  .deal-card .splits{display:flex;margin-top:6px;gap:-4px}
  .deal-card .splits .a{width:20px;height:20px;border-radius:50%;border:2px solid var(--surface);font-size:9.5px;font-weight:700;color:#fff;display:grid;place-items:center;margin-left:-6px}
  .deal-card .splits .a:first-child{margin-left:0}
  .deal-card[draggable="true"]{cursor:grab}
  .deal-card.dragging{opacity:.4;cursor:grabbing}
  .stage.drag-over{background:#DCE8F6;border-color:var(--brand-2);box-shadow:inset 0 0 0 2px var(--brand-2)}
  /* forecast */
  .forecast-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:0 1px 2px rgba(15,30,51,.04)}
  .forecast-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-bottom:16px}
  .fc-kpi{padding:0 18px;position:relative}
  .fc-kpi+.fc-kpi{border-left:1px solid var(--line)}
  .fc-kpi:first-child{padding-left:0}
  .fc-kpi:last-child{padding-right:0}
  .fc-lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:6px}
  .fc-val{font-size:24px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .fc-sub{font-size:11.5px;color:var(--muted);margin-top:4px}
  .forecast-bar{display:flex;height:12px;border-radius:8px;overflow:hidden;background:var(--surface-3);margin:0 0 10px}
  .forecast-seg{transition:flex .4s}
  .forecast-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:11.5px;color:var(--muted)}
  .forecast-legend>div{display:inline-flex;align-items:center;gap:6px}
  .forecast-legend .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .forecast-legend .sb{color:var(--ink)}
  /* filter bar */
  .filter-bar{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
  .filter-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;white-space:nowrap}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

  /* map */
  .map-wrap{position:relative}
  .map-legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
  .map-scale{display:flex;border-radius:3px;overflow:hidden;border:1px solid var(--line)}
  .map-scale span{width:18px;height:10px}
  .map-tooltip{position:fixed;pointer-events:none;background:#0F1E33;color:#fff;padding:7px 10px;border-radius:6px;font-size:12px;line-height:1.35;opacity:0;transition:opacity .1s;white-space:nowrap;z-index:200;box-shadow:0 6px 18px rgba(0,0,0,.25)}
  .map-tooltip strong{display:block;font-weight:600;margin-bottom:2px}
  .pie-tip{position:absolute;pointer-events:none;background:#0F1E33;color:#fff;padding:7px 10px;border-radius:6px;font-size:12px;line-height:1.35;opacity:0;transition:opacity .1s;white-space:nowrap;z-index:10;box-shadow:0 6px 18px rgba(0,0,0,.25);top:0;left:0}
  .pie-tip strong{display:block;font-weight:600;margin-bottom:2px}
  .pie .pie-slice{transition:transform .15s ease-out,filter .15s;transform-origin:center;cursor:pointer}
  .pie .pie-slice:hover{filter:brightness(1.08) drop-shadow(0 2px 6px rgba(15,30,51,.2));transform:scale(1.03)}
  #worldmap{width:100%;height:auto;display:block;background:linear-gradient(180deg,#F2F6FB,#EAF0F7);border-radius:10px}
  body.theme-dark #worldmap{background:linear-gradient(180deg,#0E1726,#15233A)}
  .region-bar{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px 0}
  .region-chip{font-size:11.5px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;transition:.12s;font-family:inherit}
  .region-chip:hover{background:var(--surface-hover)}
  .region-chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  /* OJO: sin 'fill' en CSS — en SVG la prop CSS pisa los atributos, y necesitamos que d3 pinte cada país */
  #worldmap .country{stroke:#fff;stroke-width:.45;transition:stroke .15s,stroke-width .15s;cursor:pointer}
  #worldmap .country.hl{stroke:#0F1E33;stroke-width:1.1}
  .map-toggle{display:inline-flex;background:var(--surface-2);border-radius:7px;padding:2px}
  .map-toggle button{padding:5px 10px;border-radius:5px;font-size:12px;font-weight:600;color:var(--muted)}
  .map-toggle button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(15,30,51,.08)}

  /* Pupilos — calendario / gantt */
  .pup-cal{border:1px solid var(--line-2);border-radius:8px;background:var(--surface);overflow:hidden}
  .pup-cal-hd{display:flex;border-bottom:1px solid var(--line-2);background:var(--surface-2)}
  .pup-cal-body{position:relative}
  .pup-row{display:flex;align-items:center;border-bottom:1px solid var(--line-2);position:relative;cursor:pointer;transition:background .12s}
  .pup-row:last-child{border-bottom:0}
  .pup-row:hover{background:var(--surface-2)}
  .pup-row-name{flex:0 0 220px;padding:8px 12px;border-right:1px solid var(--line-2);background:var(--surface)}
  body.theme-dark .pup-row-name{background:var(--panel)}
  .pup-row:hover .pup-row-name{background:var(--surface-2)}
  .pup-row-track{flex:1;position:relative;height:42px;min-width:0}
  .pup-track-hd{height:32px}
  .pup-mhd{position:absolute;top:0;height:100%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-right:1px solid var(--line-2);box-sizing:border-box}
  .pup-mhd.yr{color:var(--ink);font-weight:700}
  .pup-mhd:last-child{border-right:0}
  .pup-cal-grid{position:absolute;inset:0;pointer-events:none;margin-left:220px}
  .pup-gline{position:absolute;top:0;bottom:0;width:1px;background:var(--line-2)}
  .pup-today{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);z-index:2;box-shadow:0 0 0 2px rgba(220,38,38,.15)}
  .pup-bar{position:absolute;top:50%;transform:translateY(-50%);height:24px;border-radius:6px;display:flex;align-items:center;padding:0 8px;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 2px rgba(15,30,51,.12);transition:transform .12s,box-shadow .12s}
  .pup-bar:hover{transform:translateY(-50%) scale(1.02);box-shadow:0 2px 6px rgba(15,30,51,.18);z-index:3}
  .gap-xs{gap:6px}

  /* dashboard charts */
  .chart-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
  @media(max-width:1200px){.chart-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:800px){.chart-grid{grid-template-columns:1fr}}
  .today-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  @media(max-width:1000px){.today-grid{grid-template-columns:1fr}}
  .today-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;transition:background .12s}
  .today-row+.today-row{border-top:1px dashed var(--line-2)}
  .today-row.click{cursor:pointer}
  .today-row.click:hover{background:var(--surface-2)}
  .tier-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:5px;vertical-align:1px}
  .vips-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:10px}
  .vip-card{padding:11px 13px;border:1px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .vip-card:hover{border-color:var(--brand-2);box-shadow:0 6px 18px rgba(46,123,196,.12)}
  .co-chips{display:flex;gap:6px;flex-wrap:wrap}
  .co-chip{display:inline-flex;align-items:center;gap:7px;padding:5px 10px 5px 5px;border:1px solid var(--border);border-radius:22px;background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .co-chip:hover{border-color:var(--brand-2);box-shadow:0 3px 10px rgba(46,123,196,.12)}
  .co-chip.add{color:var(--muted);border-style:dashed;padding:5px 12px;font-weight:500}
  .co-chip.add:hover{color:var(--brand);border-color:var(--brand-2)}
  .tl-chips{display:flex;gap:6px;flex-wrap:wrap}
  .tl-chip{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:5px 11px;font-size:12px;color:var(--ink-2);cursor:pointer;font-weight:500;transition:all .12s}
  .tl-chip:hover{border-color:var(--brand-2);color:var(--brand)}
  .tl-chip.active{background:var(--brand);border-color:var(--brand);color:#fff}
  .tl-wrap{position:relative}
  .tl-month{margin-top:10px}
  .tl-month-hd{font-family:'IBM Plex Serif','IBM Plex Sans',serif;text-transform:capitalize;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;padding:8px 0 6px;border-bottom:1px solid var(--line-2);margin-bottom:8px}
  .tl-event{position:relative;display:flex;gap:12px;padding:8px 10px 8px 8px;margin-left:14px;border-radius:8px;cursor:pointer;transition:background .12s}
  .tl-event:hover{background:var(--surface-2)}
  .tl-event::before{content:'';position:absolute;left:-7px;top:0;bottom:-8px;width:2px;background:var(--line-2)}
  .tl-event:last-child::before{bottom:50%}
  .tl-node{width:30px;height:30px;border-radius:50%;background:var(--surface-3);color:var(--brand);display:grid;place-items:center;flex:none;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--border);z-index:1;margin-left:-22px}
  .tl-node.meeting{background:#F1E9FB;color:#6D28D9}
  .tl-node.call{background:#E6F6EC;color:#15803D}
  .tl-node.email{background:#FDF4E3;color:#B45309}
  .tl-node.note{background:var(--surface-3);color:#475569}
  .tl-node.task{background:#FCE8E8;color:#B91C1C}
  .tl-node.doc{background:var(--surface-3);color:var(--brand)}
  .tl-node.deal-open{background:#E8F1FB;color:var(--brand)}
  .tl-node.deal-won{background:#DCFCE7;color:#166534}
  .tl-node.deal-lost{background:#FEE2E2;color:#991B1B}
  .tl-body{flex:1;min-width:0;padding-top:2px}
  .chart-svg{width:100%;height:auto;display:block;overflow:visible}
  .chart-lbl{font-size:11px;fill:var(--muted);font-family:inherit}
  .chart-val{font-size:12px;fill:var(--ink);font-weight:600;font-family:inherit;font-variant-numeric:tabular-nums}
  .chart-axis{stroke:var(--line);stroke-width:1}
  .chart-grid-line{stroke:var(--line-2);stroke-width:1;stroke-dasharray:2 3}
  .funnel-stage{transition:opacity .15s}
  .funnel-stage:hover{opacity:.85}
  .donut-label{font-size:12px;fill:var(--ink);font-weight:600;font-family:inherit}
  .donut-sub{font-size:10.5px;fill:var(--muted);font-family:inherit}
  .mini-kpi{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;background:var(--surface-2);margin-top:8px;font-size:12px}
  .mini-kpi .v{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
  .chart-tip{position:absolute;pointer-events:none;background:rgba(15,30,51,.94);color:#fff;padding:6px 10px;border-radius:6px;font-size:11.5px;white-space:nowrap;display:none;z-index:8;line-height:1.4;font-variant-numeric:tabular-nums;box-shadow:0 4px 12px rgba(15,30,51,.18)}
  .chart-tip b{color:#fff;font-weight:700}
  .ratio-box{padding:14px;background:var(--surface-2);border-radius:10px;text-align:center;border:1px solid var(--line)}
  .ratio-box .lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
  .ratio-box .val{font-size:26px;font-weight:700;margin-top:4px;line-height:1;font-variant-numeric:tabular-nums}
  .ratio-box .sub{font-size:11px;color:var(--muted);margin-top:4px}
  .l2c-select{font-size:11.5px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer;font-weight:500}
  .legend-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .legend-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2)}
  .legend-pill .sw{width:10px;height:10px;border-radius:3px}

  /* drawer */
  .drawer-back{position:fixed;inset:0;background:rgba(15,30,51,.42);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
  .drawer-back.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:-820px;width:min(820px,100vw);height:100vh;background:var(--surface);box-shadow:-8px 0 32px rgba(15,30,51,.14);transition:right .25s cubic-bezier(.4,0,.2,1);z-index:60;display:flex;flex-direction:column}
  .drawer.show{right:0}
  .drawer-hd{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
  .drawer-hd h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em}
  .drawer-hd .meta{color:var(--muted);font-size:13px;margin-top:4px}
  .drawer-close{width:32px;height:32px;border-radius:7px;display:grid;place-items:center;color:var(--muted);background:var(--surface-2);flex:none}
  .drawer-close:hover{background:#E7ECF3;color:var(--ink)}
  .drawer-body{flex:1;overflow:auto;padding:18px 22px;display:flex;flex-direction:column;gap:16px}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-8px 0 0}
  .tab{padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
  .tab.active{color:var(--brand);border-bottom-color:var(--brand)}
  .tab:hover{color:var(--ink)}
  .field-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 20px}
  .field{display:flex;flex-direction:column;gap:3px}
  .field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
  .field .v{font-size:14px;color:var(--ink);font-weight:500}
  .field .v a{color:var(--accent);text-decoration:underline;text-decoration-color:rgba(11,107,203,.3);text-underline-offset:2px;cursor:pointer}

  .activity-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line-2)}
  .activity-item:last-child{border:0}
  .activity-item.click{cursor:pointer;margin:0 -10px;padding:10px;border-radius:8px;transition:background .12s}
  .activity-item.click:hover{background:var(--surface-2)}
  .act-consultants{display:flex}
  .ac-avatar{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);font-size:9px;font-weight:700;color:#fff;display:grid;place-items:center;margin-left:-6px;box-shadow:0 0 0 1px var(--border)}
  .ac-more{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);background:var(--surface-3);color:var(--muted);font-size:11px;font-weight:700;display:grid;place-items:center;margin-left:-6px}
  .act-ico{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;flex:none;background:#E8F1FB;color:var(--brand)}
  .act-ico.meeting{background:#F1E9FB;color:#6D28D9}
  .act-ico.call{background:#E6F6EC;color:#15803D}
  .act-ico.email{background:#FDF4E3;color:#B45309}
  .act-ico.note{background:var(--surface-3);color:#475569}
  .act-ico.task{background:#FCE8E8;color:#B91C1C}
  .act-ico svg{width:15px;height:15px}
  .act-body{flex:1;min-width:0}
  .act-title{font-weight:600;font-size:13.5px}
  .act-meta{color:var(--muted);font-size:12px;margin-top:2px}
  .act-note{color:var(--ink-2);font-size:13px;margin-top:6px;line-height:1.45}

  /* splits */
  .split-pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;font-size:12px;font-weight:600;color:var(--ink-2);margin:2px}
  .split-pill .pct{color:var(--muted);font-weight:600;margin-left:4px}
  .split-row{display:grid;grid-template-columns:1fr 80px 30px;gap:8px;align-items:center;margin-bottom:6px}
  .split-row select,.split-row input{border:1px solid var(--line);border-radius:7px;padding:7px 10px;outline:0;background:var(--surface);width:100%}
  .split-row .rmv{border:1px solid var(--line);border-radius:7px;width:30px;height:34px;display:grid;place-items:center;color:var(--muted);background:var(--surface);cursor:pointer}
  .split-total{font-size:12px;color:var(--muted);margin-top:6px}
  .split-total b{color:var(--ink)}
  .split-total.bad b{color:var(--danger)}
  .split-total.ok b{color:var(--success)}

  /* rank table specific */
  .rank-row td{padding:14px 16px}
  .rank-pos{font-weight:700;color:var(--muted);font-size:14px;width:38px}
  .rank-pos.gold{color:#B8860B}.rank-pos.silver{color:#7B868C}.rank-pos.bronze{color:#A0522D}
  .bar{height:6px;background:var(--surface-3);border-radius:999px;overflow:hidden;margin-top:5px;width:160px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2))}

  /* modal */
  .modal-back{position:fixed;inset:0;background:rgba(15,30,51,.5);display:none;z-index:70;align-items:center;justify-content:center;padding:20px}
  .modal-back.show{display:flex}
  .modal{background:var(--surface);border-radius:12px;width:min(620px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .modal-hd{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .modal-hd h3{margin:0;font-size:17px;font-weight:700}
  .modal-body{padding:18px 22px;overflow:auto}
  .modal-body .field{margin-bottom:14px}
  .modal-body .field label{margin-bottom:4px}
  .modal-body .field input,.modal-body .field select,.modal-body .field textarea{
    border:1px solid var(--line);border-radius:7px;padding:8px 10px;outline:0;transition:.15s;width:100%;background:var(--surface);color:var(--ink)
  }
  .modal-body .field input:focus,.modal-body .field select:focus,.modal-body .field textarea:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(46,123,196,.15)}
  .modal-body .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal-ft{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}

  /* utilities */
  .flex{display:flex}.ac{align-items:center}.jc{justify-content:center}.jb{justify-content:space-between}
  .gap-s{gap:6px}.gap-m{gap:10px}.gap-l{gap:16px}
  .mt-s{margin-top:8px}.mt-m{margin-top:14px}.mt-l{margin-top:22px}
  .muted{color:var(--muted)}.b{font-weight:700}.sb{font-weight:600}

  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#D5DCE7;border:2px solid transparent;background-clip:padding-box;border-radius:10px}
  ::-webkit-scrollbar-thumb:hover{background:#B9C3D3;background-clip:padding-box;border:2px solid transparent}

  /* ── F12 Mobile UX polish ── */
  @media (max-width: 768px) {
    /* Touch targets ≥44px */
    .btn { min-height: 40px; padding: 9px 14px }
    .btn.sm { min-height: 36px; padding: 7px 12px }
    .icon-btn { width: 40px; height: 40px }
    .nav-item { padding: 12px 14px; min-height: 44px }
    /* Topbar más compacta — solo iconos en botones secundarios */
    header .btn.outline span:not(.lbl) { display: none }
    header .btn.outline { padding: 9px 12px }
    /* Drawer fullscreen */
    .drawer { width: 100% !important; max-width: 100% !important; right: 0 !important }
    /* Tablas scroll horizontal */
    .tbl, table.tbl { font-size: 12px }
    .bd[style*="overflow:auto"], .bd { overflow-x: auto !important }
    /* Forms en mobile: row flex → column */
    .row { flex-direction: column; gap: 10px }
    /* KPIs grid: forzar 1-2 columnas */
    .kpis { grid-template-columns: repeat(2, 1fr) !important; gap: 8px }
    .kpi { padding: 10px }
    /* Page-head: stack en móvil */
    .page-head { flex-direction: column; align-items: flex-start; gap: 10px }
    /* Filterbar más compacta */
    .filterbar { flex-direction: column; align-items: stretch }
    .fb-field { width: 100% }
    /* Drawers: padding más generoso para fingers */
    .drawer-body .field { padding: 10px 0 }
    /* Bulk bar bottom: full width en mobile */
    #bulkBar { left: 8px !important; right: 8px !important; transform: none !important; bottom: 12px !important; flex-wrap: wrap; padding: 10px 12px !important; border-radius: 12px !important }
  }
  @media (max-width: 480px) {
    /* Layout aún más compacto en phones */
    .kpis { grid-template-columns: 1fr !important }
    .page-title { font-size: 18px }
    .nav-item .lbl { opacity: 1 !important; transform: none !important }
    aside.nav { width: 100%; height: auto; position: static }
    .nav-rail { display: flex; flex-wrap: wrap; gap: 4px }
    main { padding-top: 0 }
    /* Login overlay mobile-friendly */
    .login-card { padding: 18px; max-width: 95vw }
  }
  /* ── F9.3 Print stylesheet ── */
  @media print {
    aside.nav, header, .icon-btn, .btn, .uswitch, .udrop, .notif-dd, #bulkBar, #helpShortcuts, #gsDropdown, #mentionDD { display:none !important }
    body { background:#fff !important; color:#000 !important }
    .drawer-bg, .drawer { position:static !important; width:100% !important; box-shadow:none !important; transform:none !important; padding:0 !important }
    .content { padding:0 !important }
    .card { break-inside:avoid; border:1px solid #ccc; box-shadow:none !important }
    .page-head { border-bottom:2px solid #000; padding-bottom:8px; margin-bottom:14px }
    a { color:#000 !important; text-decoration:none }
    /* Header de impresión */
    body::before { content:"CEO Advisors CRM — Confidencial"; display:block; font-size:10pt; color:#666; padding:8px; border-bottom:1px solid #ccc; margin-bottom:14px }
  }

#chatFab{
  position:fixed; right:20px; bottom:88px; z-index:9000;
  width:56px; height:56px; border-radius:50%;
  background:#0071e3; color:#fff; border:0; cursor:pointer;
  font-size:24px; display:flex; align-items:center; justify-content:center;
  box-shadow:0 6px 18px rgba(0,113,227,.45);
  transition:transform .15s ease;

  position:absolute; top:6px; right:6px; width:10px; height:10px; border-radius:50%;
  background:#ff3b30; border:2px solid #fff;
}
#chatPopup{
  position:fixed; right:20px; bottom:156px; z-index:9001;
  width:400px; max-width:calc(100vw - 24px); height:520px; max-height:calc(100vh - 188px);
  background:var(--bg,#fff); color:var(--text,#1d1d1f);
  border:1px solid rgba(0,0,0,.08); border-radius:14px;
  box-shadow:0 16px 48px rgba(0,0,0,.18);
  display:flex; flex-direction:column; overflow:hidden;
}
#chatPopup[hidden]{display:none}
#chatPopup header{
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 14px; border-bottom:1px solid rgba(0,0,0,.06);
  background:rgba(0,0,0,.02);
}
#chatPopup header h3{margin:0; font-size:14px; font-weight:600}
#chatPopup .chat-actions{display:flex; gap:6px}
#chatPopup .chat-actions button{
  background:none; border:0; cursor:pointer; padding:4px 8px;
  font-size:14px; color:var(--text,#1d1d1f); opacity:.65;
}
#chatPopup .chat-actions button:hover{opacity:1}
#chatMessages{
  flex:1; overflow-y:auto; padding:12px;
  display:flex; flex-direction:column; gap:8px;
  font-size:13px; line-height:1.45;
}
.chat-msg{max-width:88%; padding:8px 12px; border-radius:14px; word-wrap:break-word}
.chat-msg-user{align-self:flex-end; background:#0071e3; color:#fff; border-bottom-right-radius:4px}
.chat-msg-assistant{align-self:flex-start; background:#f0f0f2; color:#1d1d1f; border-bottom-left-radius:4px}
.chat-msg-error{align-self:stretch; background:#fff0f0; color:#c00; padding:8px 12px; border-radius:8px; font-size:12px}
.chat-msg-info{align-self:stretch; background:#fffbe6; color:#7a5a00; padding:6px 10px; border-radius:6px; font-size:11px}
.chat-msg-assistant table{border-collapse:collapse; margin:4px 0; font-size:12px}
.chat-msg-assistant th, .chat-msg-assistant td{border:1px solid rgba(0,0,0,.08); padding:3px 6px; text-align:left}
.chat-msg-assistant th{background:rgba(0,0,0,.04); font-weight:600}
.chat-msg-assistant code{background:rgba(0,0,0,.06); padding:1px 4px; border-radius:3px; font-family:ui-monospace,monospace; font-size:11px}
.chat-msg-assistant pre{background:rgba(0,0,0,.06); padding:6px 8px; border-radius:6px; overflow-x:auto; font-size:11px}
.chat-msg-assistant ul, .chat-msg-assistant ol{padding-left:18px; margin:4px 0}
.chat-msg-assistant a{color:#0071e3; text-decoration:underline}
.chat-cursor::after{content:"▌"; opacity:.5; animation:chat-blink 1s steps(1) infinite}
@keyframes chat-blink{50%{opacity:0}}
#chatForm{display:flex; gap:6px; padding:8px 10px; border-top:1px solid rgba(0,0,0,.06); background:rgba(0,0,0,.02)}
#chatInput{
  flex:1; resize:none; padding:6px 10px;
  border:1px solid rgba(0,0,0,.12); border-radius:8px;
  font-family:inherit; font-size:13px; background:var(--bg,#fff); color:var(--text,#1d1d1f);
}
#chatInput:focus{outline:none; border-color:#0071e3}
#chatSend{
  background:#0071e3; color:#fff; border:0; cursor:pointer;
  width:36px; border-radius:8px; font-size:16px; font-weight:600;
  align-self:stretch;
}
#chatSend:disabled{background:#999; cursor:not-allowed}
@media (max-width:480px){
  #chatPopup{right:8px; bottom:156px; width:calc(100vw - 16px); height:calc(100vh - 188px)}
}
</style>

    applyMigrations(fresh);
    DB=fresh;
    Storage.write(JSON.stringify(DB));
    /* F15.4d: cargar notifs desde Supabase y mergear con locales (las locales sin _supaNotifId se pueden migrar) */
    try{
      const remoteNotifs = await _supaLoadNotifications();
      if(remoteNotifs.length){
        // mergear: si una local tiene mismo id que una remote, preservar el local (mas reciente UX)
        const localIds = new Set((DB.notifications||[]).map(n=>n.id));
        const newOnes = remoteNotifs.filter(n => !localIds.has(n.id));

    try{ _supaUpdateSnapshot() }catch(e){ console.warn('snapshot:',e) }
    supaSetOfflineBanner(false);

    console.warn('[Supabase] fetch falló, usando cache local:',e.message);

/* ──────────── 2.0 Escritura a Supabase (F15.3d) ──────────────
   Estrategia: debounce 500ms tras saveDB(). Diff por snapshot (sólo se envía lo que cambió).
   Cola offline persistida en localStorage si Supabase no responde o falla.
   Deletes detectados comparando snapshot vs estado actual. */
const SUPA_QUEUE_KEY = 'ceoadvisors_supa_queue_v1';
const SUPA_SNAPSHOT_KEY = 'ceoadvisors_supa_snapshot_v2';
const SUPA_LAST_ERROR_KEY = 'ceoadvisors_supa_last_error_v1';
const SUPA_QUARANTINE_KEY = 'ceoadvisors_supa_quarantine_v1';
let _supaFlushTimer = null;
let _supaFlushInflight = false;
let _supaRetryTimer = null;
let _supaRetryStep = 0;
const _SUPA_RETRY_DELAYS = [5000, 15000, 45000, 120000]; // 5s · 15s · 45s · 2min · stop

function _supaRecordError(table, op, e){
  try{
    const payload = {
      ts: Date.now(),
      table,
      op,
      error: e && (e.message || String(e)) || 'unknown',
      code: e && e.code || null,
      details: e && e.details || null,
      hint: e && e.hint || null,
      httpStatus: e && (e.status || e.statusCode) || null
    };
    localStorage.setItem(SUPA_LAST_ERROR_KEY, JSON.stringify(payload));
  }catch(_){}
}
function _supaClearError(){
  try{ localStorage.removeItem(SUPA_LAST_ERROR_KEY); }catch(_){}
}
function _supaReadError(){
  try{ return JSON.parse(localStorage.getItem(SUPA_LAST_ERROR_KEY) || 'null'); }catch(_){ return null; }
}

function _supaSanitizeQueue(){
  // Mueve items malformados (sin id local) a cuarentena. Evita que aticen la cola eternamente.
  let q;
  try{ q = JSON.parse(localStorage.getItem(SUPA_QUEUE_KEY)||'{"upserts":{},"deletes":{}}'); }
  catch(_){ return { quarantined:0 }; }
  let quar = {};
  try{ quar = JSON.parse(localStorage.getItem(SUPA_QUARANTINE_KEY)||'{}'); }catch(_){}
  let moved = 0;
  for(const t in q.upserts||{}){
    const bag = q.upserts[t] || {};
    for(const k of Object.keys(bag)){
      const row = bag[k];
      const bad = !row || typeof row!=='object' || !row.id;
      if(bad){
        (quar[t] = quar[t] || []).push({op:'upsert', key:k, row, ts:Date.now()});
        delete bag[k];
        moved++;
      }
    }
    if(!Object.keys(bag).length) delete q.upserts[t];
  }
  for(const t in q.deletes||{}){
    const arr = q.deletes[t] || [];
    const keep = [];
    for(const id of arr){
      if(!id){
        (quar[t] = quar[t] || []).push({op:'delete', id, ts:Date.now()});
        moved++;
      } else keep.push(id);
    }
    if(keep.length) q.deletes[t] = keep; else delete q.deletes[t];
  }
  if(moved){
    try{ localStorage.setItem(SUPA_QUEUE_KEY, JSON.stringify(q)); }catch(_){}
    try{ localStorage.setItem(SUPA_QUARANTINE_KEY, JSON.stringify(quar)); }catch(_){}
    console.warn('[Supabase] '+moved+' item(s) malformados movidos a cuarentena');
  }
  return { quarantined: moved };
}

function _supaResolveUuid(type, code){
  if(!code) return null;
  const list = ({u:DB.consultants,c:DB.clients,co:DB.companies,d:DB.deals,a:DB.activities,p:DB.pupilos})[type] || [];
  const x = list.find(r => r && r.id === code);
  return (x && x._supaId) || null;
}

function _supaEnsureSupaId(x){
  if(x._supaId) return x._supaId;
  /* F15.4-hotfix: antes de generar UUID nuevo, intentar resolverlo desde el snapshot.
     Si la fila YA existe en backend (otro device la creó, o el _supaId se perdió por una
     migración local), recuperar su UUID real evita conflict 409 por unique(code). */
  try{
    const snap = JSON.parse(localStorage.getItem(SUPA_SNAPSHOT_KEY)||'{}');
    for(const t of Object.keys(snap)){
      const entry = snap[t] && snap[t][x.id];
      if(entry && entry.supaId){ x._supaId = entry.supaId; return x._supaId; }
    }
  }catch(e){}
  /* Fila genuinamente nueva: generar UUID v4 */
  try{ x._supaId = (crypto.randomUUID ? crypto.randomUUID() : ('xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,ch=>{const r=Math.random()*16|0;return (ch==='x'?r:(r&0x3|0x8)).toString(16)}))); }
  catch(e){ x._supaId = 'fallback-'+Date.now()+'-'+Math.random().toString(36).slice(2,10); }
  return x._supaId;
}

function _supaToRow(table, x){

  const ACT_TYPES   = ['meeting','call','email','note','task','other'];
  const TIERS       = ['A','B','C','D'];
  if(table==='consultants') return Object.assign(base, {
    name:x.name||'', role:x.role||'', is_ceo:!!x.isCEO, is_admin:!!x.isAdmin,
    email:x.email||'', region:x.region||'', bio:x.bio||'',
    prefs: (x.prefs && typeof x.prefs==='object') ? x.prefs : {}
  });
  if(table==='clients') return Object.assign(base, {
    is_demo:!!x._isDemo, name:x.name||'', email:x.email||'', phone:x.phone||'',
    country:x.country||'', city:x.city||'', net_worth:Number(x.netWorth)||0,
    source:x.source||'', tier:(TIERS.includes(x.tier)?x.tier:null),
    notes:x.notes||'',
    comments: Array.isArray(x.comments)?x.comments:[],
    tags: Array.isArray(x.tags)?x.tags:[]
  });
  if(table==='companies') return Object.assign(base, {
    is_demo:!!x._isDemo, name:x.name||'', industry:x.industry||'',
    country:x.country||'', employees:Number(x.employees)||0,
    net_worth:Number(x.netWorth)||0, website:x.website||'',
    client_ids:(x.clientIds||[]).map(c=>_supaResolveUuid('c',c)).filter(Boolean),
    notes:x.notes||'',
    comments: Array.isArray(x.comments)?x.comments:[]
  });
  if(table==='deals'){
    const type  = DEAL_TYPES.includes(x.type)  ? x.type  : 'mandate';
    const stage = DEAL_STAGES.includes(x.stage)? x.stage : 'lead';
    if(x.type && !DEAL_TYPES.includes(x.type))   console.warn('[supa] deal type inválido descartado:', x.type, '→ mandate');
    if(x.stage && !DEAL_STAGES.includes(x.stage)) console.warn('[supa] deal stage inválido descartado:', x.stage, '→ lead');
    return Object.assign(base, {
      is_demo:!!x._isDemo, title:x.title||'',
      client_id:_supaResolveUuid('c',x.clientId),
      company_id:_supaResolveUuid('co',x.companyId),
      type, stage, amount:Number(x.amount)||0,
      close_date:x.closeDate||null,
      splits:(x.splits||[]).map(s=>({u:_supaResolveUuid('u',s.u), pct:Number(s.pct)||0})).filter(s=>s.u),
      notes:x.notes||'',
      comments: Array.isArray(x.comments)?x.comments:[],
      stage_history: Array.isArray(x.stageHistory)?x.stageHistory:[],
      lost_reason: x.lostReason||null,
      won_at: x.wonAt||null,
      lost_at: x.lostAt||null,
      tags: Array.isArray(x.tags)?x.tags:[]
    });
  }
  if(table==='activities'){
    const type = ACT_TYPES.includes(x.type) ? x.type : 'note';
    if(x.type && !ACT_TYPES.includes(x.type)) console.warn('[supa] activity type inválido descartado:', x.type, '→ note');
    return Object.assign(base, {
      is_demo:!!x._isDemo, type, date:x.date||null,
      client_id:_supaResolveUuid('c',x.clientId),
      company_id:_supaResolveUuid('co',x.companyId),
      deal_id:_supaResolveUuid('d',x.dealId),
      title:x.title||'', notes:x.notes||'', done:!!x.done,
      created_by:_supaResolveUuid('u',x.createdBy),
      assigned_to:_supaResolveUuid('u',x.assignedTo)
    });
  }
  if(table==='pupilos') return Object.assign(base, {
    name:x.name||'', email:x.email||'', university:x.university||'',
    program:x.program||'', start_date:x.startDate||null, end_date:x.endDate||null,
    mentor:x.mentor||'', region:x.region||'',
    consultant_id:_supaResolveUuid('u',x.consultantId),
    left_company:x.leftCompany||'', left_role:x.leftRole||'',
    notes:x.notes||'', docs:Array.isArray(x.docs)?x.docs:[]
  });
  return null;
}

function _supaSignature(table, x){
  const r = _supaToRow(table, x);
  if(!r) return '';
  return JSON.stringify(r);
}

function _supaLoadSnapshot(){
  try{ return JSON.parse(localStorage.getItem(SUPA_SNAPSHOT_KEY) || '{}') }catch(e){ return {} }
}
function _supaSaveSnapshot(snap){
  try{ localStorage.setItem(SUPA_SNAPSHOT_KEY, JSON.stringify(snap)) }catch(e){}
}
function _supaUpdateSnapshot(){
  const tables = {consultants:DB.consultants, clients:DB.clients, companies:DB.companies, deals:DB.deals, activities:DB.activities, pupilos:DB.pupilos};
  const snap = {};
  for(const [t, rows] of Object.entries(tables)){
    if(!Array.isArray(rows)) continue;
    snap[t] = {};
    rows.forEach(r => {
      if(!r || !r.id) return;
      snap[t][r.id] = { sig: _supaSignature(t, r), supaId: r._supaId || null };
    });
  }
  _supaSaveSnapshot(snap);
}

function _supaComputeDirty(){
  const tables = {consultants:DB.consultants, clients:DB.clients, companies:DB.companies, deals:DB.deals, activities:DB.activities, pupilos:DB.pupilos};
  const snap = _supaLoadSnapshot();
  const dirty = {};
  for(const [t, rows] of Object.entries(tables)){
    if(!Array.isArray(rows)) continue;
    const prev = snap[t] || {};
    const changed = rows.filter(r => r && r.id && _supaSignature(t, r) !== (prev[r.id] && prev[r.id].sig));
    if(changed.length) dirty[t] = changed;
  }
  return dirty;
}

function _supaComputeDeletes(){
  const tables = {consultants:DB.consultants, clients:DB.clients, companies:DB.companies, deals:DB.deals, activities:DB.activities, pupilos:DB.pupilos};
  const snap = _supaLoadSnapshot();
  const out = {};
  for(const [t, rows] of Object.entries(tables)){
    if(!Array.isArray(rows)) continue;
    const currentCodes = new Set(rows.map(r => r && r.id).filter(Boolean));
    const prev = snap[t] || {};
    const missing = Object.entries(prev)
      .filter(([code, info]) => !currentCodes.has(code) && info && info.supaId)
      .map(([code, info]) => info.supaId);
    if(missing.length) out[t] = missing;
  }
  return out;
}

function _supaLoadQueue(){
  try{
    const q = JSON.parse(localStorage.getItem(SUPA_QUEUE_KEY) || '{}');
    if(!q.upserts) q.upserts = {};
    if(!q.deletes) q.deletes = {};
    return q;
  }catch(e){ return {upserts:{}, deletes:{}} }
}
function _supaSaveQueue(q){
  try{ localStorage.setItem(SUPA_QUEUE_KEY, JSON.stringify(q)) }catch(e){}
}
function _supaQueueMerge(dirty, deletes){
  const q = _supaLoadQueue();
  for(const [t, rows] of Object.entries(dirty || {})){
    if(!q.upserts[t]) q.upserts[t] = {};
    rows.forEach(r => { if(r && r.id) q.upserts[t][r.id] = r; });
  }
  for(const [t, ids] of Object.entries(deletes || {})){
    if(!q.deletes[t]) q.deletes[t] = [];
    ids.forEach(id => { if(!q.deletes[t].includes(id)) q.deletes[t].push(id); });
  }
  _supaSaveQueue(q);
}
function _supaQueueCount(q){
  q = q || _supaLoadQueue();
  let n = 0;
  for(const t in q.upserts) n += Object.keys(q.upserts[t] || {}).length;
  for(const t in q.deletes) n += (q.deletes[t] || []).length;
  return n;
}

async function _supaUpsertTable(table, rows){
  if(!window.sb) throw new Error('no client');
  const supaRows = rows.map(r => _supaToRow(table, r)).filter(Boolean);
  if(!supaRows.length) return { sent:0, applied:0, rejected:[] };
  // F15.4f: RPC que sólo aplica si excluded.updated_at >= existing.updated_at
  const rpcName = 'upsert_'+table+'_if_newer';
  const { data, error } = await sb.rpc(rpcName, { rows: supaRows });
  if(error) throw error;
  const appliedIds = new Set((data||[]).map(x => typeof x==='string'?x:x.id));
  const rejected = supaRows.filter(r => !appliedIds.has(r.id));
  if(rejected.length){
    console.warn('[supa] '+rejected.length+' filas rechazadas en '+table+' (server más reciente)');
    _supaQueueConflicts(table, rejected, rows);
  }
  return { sent: supaRows.length, applied: appliedIds.size, rejected };
}

// F15.4f: cola y modal de conflictos
const SUPA_CONFLICTS_KEY = 'ceoadvisors_supa_conflicts_v1';
function _supaQueueConflicts(table, rejectedRows, localRows){
  try{
    const cur = JSON.parse(localStorage.getItem(SUPA_CONFLICTS_KEY)||'{}');
    if(!cur[table]) cur[table] = [];
    rejectedRows.forEach(r => {
      const localRow = localRows.find(lr => lr._supaId===r.id);
      cur[table].push({ id:r.id, code:r.code, ts:Date.now(), local:localRow });
    });
    localStorage.setItem(SUPA_CONFLICTS_KEY, JSON.stringify(cur));
  }catch(e){ console.warn('queueConflicts:',e) }
  setTimeout(()=>showConflictModalIfAny(),100);
}

async function flushSupabase(){
  if(_supaFlushInflight) return { skipped:true };
  _supaFlushInflight = true;
  try{
    const dirty = _supaComputeDirty();
    const deletes = _supaComputeDeletes();
    if(Object.keys(dirty).length || Object.keys(deletes).length){
      _supaQueueMerge(dirty, deletes);
    }
    const q = _supaLoadQueue();
    const total = _supaQueueCount(q);
    if(!total){ supaSetSyncBanner('ok'); return { sent:0 }; }
    if(!window.sb || !navigator.onLine){ supaSetSyncBanner('queued', total); return { queued:total }; }

    supaSetSyncBanner('syncing', total);

    // F15.4a: continue tras error en cada tabla, no break
    const errors = [];
    for(const t of ['consultants','clients','companies','deals','activities','pupilos']){
      const byId = q.upserts[t] || {};
      const rows = Object.values(byId);
      if(!rows.length) continue;
      try{
        const res = await _supaUpsertTable(t, rows);
        // limpiar SÓLO las filas aplicadas; las rechazadas quedan en la cola (F15.4f las gestiona)
        const appliedCodes = new Set();
        if(res && res.rejected){
          const rejectedCodes = new Set(res.rejected.map(r=>r.code));
          rows.forEach(r => { if(!rejectedCodes.has(r.id)) appliedCodes.add(r.id); });
        } else {
          rows.forEach(r => appliedCodes.add(r.id));
        }
        appliedCodes.forEach(code => { delete q.upserts[t][code]; });
        if(!Object.keys(q.upserts[t]).length) delete q.upserts[t];
        _supaSaveQueue(q);
      }catch(e){
        console.warn('[Supabase] upsert '+t+' falló:', e.message||e);
        _supaRecordError(t, 'upsert', e);
        errors.push({table:t, op:'upsert', error:e.message||String(e)});
      }
    }

    for(const t of ['activities','deals','pupilos','companies','clients','consultants']){
      const ids = q.deletes[t] || [];
      if(!ids.length) continue;
      try{
        await _supaDeleteIds(t, ids);
        delete q.deletes[t];
        _supaSaveQueue(q);
      }catch(e){
        console.warn('[Supabase] delete '+t+' falló:', e.message||e);
        _supaRecordError(t, 'delete', e);
        errors.push({table:t, op:'delete', error:e.message||String(e)});
      }
    }

    if(errors.length){
      const remaining = _supaQueueCount();
      supaSetSyncBanner('queued', remaining);
      _supaScheduleRetry();
      return { errors, queued: remaining };
    }

    _supaUpdateSnapshot();
    _supaClearError();
    _supaCancelRetry();
    supaSetSyncBanner('ok');
    return { sent: total };
  }finally{
    _supaFlushInflight = false;
  }
}

function scheduleSupabaseFlush(){
  if(!window.sb) return;
  if(_supaFlushTimer) clearTimeout(_supaFlushTimer);
  _supaFlushTimer = setTimeout(()=>{ _supaFlushTimer = null; flushSupabase().catch(e=>console.warn('flush:',e)); }, 500);
}

function _supaScheduleRetry(){
  if(_supaRetryStep >= _SUPA_RETRY_DELAYS.length) return; // stop tras agotar
  const delay = _SUPA_RETRY_DELAYS[_supaRetryStep++];
  if(_supaRetryTimer) clearTimeout(_supaRetryTimer);
  _supaRetryTimer = setTimeout(()=>{
    _supaRetryTimer = null;
    if(!window.sb || !navigator.onLine) return; // online listener disparará el flush
    flushSupabase().catch(e=>console.warn('retry flush:',e));
  }, delay);
}
function _supaCancelRetry(){
  if(_supaRetryTimer) clearTimeout(_supaRetryTimer);
  _supaRetryTimer = null;
  _supaRetryStep = 0;
}

if(typeof window !== 'undefined'){
  window.addEventListener('online', ()=>{ _supaCancelRetry(); flushSupabase().catch(()=>{}) });

const MIGRATIONS = [
  /* Cada migración recibe el DB y retorna el DB modificado. Se aplican en orden si _schemaApplied < to. */
  {to:1, fn:d=>{
    if(!Array.isArray(d.audit))d.audit=[];
    if(!Array.isArray(d.notifications))d.notifications=[];
    if(!Array.isArray(d.winLossReasons))d.winLossReasons=['Pricing','Timing','Competitor','Fit del producto','Cambio decisor','Presupuesto','Otro'];
    if(!Array.isArray(d.pupilos))d.pupilos=seedPupilos();
    return d;
  }},
  {to:2, fn:d=>{
    /* pupilos: deprecar track/convertedTo/status, asegurar docs[] */
    (d.pupilos||[]).forEach(p=>{
      if(p.track==='consultant'&&!p.consultantId)p.consultantId=p.convertedTo||null;
      ['track','convertedTo','status'].forEach(k=>{if(k in p)delete p[k]});
      if(!Array.isArray(p.docs))p.docs=[];
    });
    return d;
  }},
  {to:3, fn:d=>{
    /* deals: comments[], stageHistory sintético si falta */
    (d.deals||[]).forEach(x=>{
      if(!Array.isArray(x.comments))x.comments=[];
      if(!Array.isArray(x.stageHistory))x.stageHistory=[{stage:x.stage,ts:(x.createdAt||new Date().toISOString().slice(0,10))}];
      if(x.stageHistory.length<=1&&x.stage!=='prospect')x.stageHistory=synthStageHistory(x);
    });
    return d;
  }},
  {to:4, fn:d=>{
    /* clients/companies: comments[]; activities: assignedTo + done */
    (d.clients||[]).forEach(x=>{if(!Array.isArray(x.comments))x.comments=[];if(!x.tier&&x.netWorth)x.tier=(function(n){return n>=50000000?'A':n>=10000000?'B':n>0?'C':''})(x.netWorth)});
    (d.companies||[]).forEach(x=>{if(!Array.isArray(x.comments))x.comments=[]});
    (d.activities||[]).forEach(x=>{
      if(x.type==='task'&&!x.assignedTo)x.assignedTo=x.createdBy||'u0';
      if(typeof x.done==='undefined')x.done=false;
    });
    return d;
  }},
  {to:5, fn:d=>{
    /* F15.4g: purgar campos legacy de password de localStorage existente */
    (d.consultants||[]).forEach(c=>{
      delete c.password;
      delete c.passwordHash;
      delete c.passwordSalt;
      delete c.passwordIters;
      delete c.passwordMustChange;
    });
    return d;
  }},
];
function applyMigrations(d){
  if(!d)return d;
  const cur=d._schemaApplied||0;
  MIGRATIONS.filter(m=>m.to>cur).forEach(m=>{m.fn(d);d._schemaApplied=m.to});
  return d;
}

/* Integridad referencial: activity → deal → company → client. Si una actividad tiene dealId,
   hereda clientId y companyId del deal. Si un deal tiene companyId, lo forzamos a un cliente
   válido (el primero del array clientIds de la empresa si el actual no está vinculado).
   Si una empresa pierde sus clientIds, los deals/actividades asociados mantienen su companyId
   pero quedan sin cliente hasta que se reasigne. */
function normalizeRelations(){
  DB.deals.forEach(d=>{
    if(d.companyId){const co=findCompany(d.companyId);if(co&&co.clientIds&&co.clientIds.length&&!co.clientIds.includes(d.clientId)){d.clientId=co.clientIds[0]}}
  });
  DB.activities.forEach(a=>{
    if(a.dealId){const d=findDeal(a.dealId);if(d){a.clientId=d.clientId||a.clientId;a.companyId=d.companyId||a.companyId}}
    else if(a.companyId&&!a.clientId){const co=findCompany(a.companyId);if(co&&co.clientIds&&co.clientIds[0])a.clientId=co.clientIds[0]}
  });
}
/* uid → ID secuencial estable (p10, p11, c20, d50…) que sobrevive al round-trip Excel ↔ CRM.
   Encuentra el mayor sufijo numérico del prefijo en TODA la base y devuelve el siguiente. */
function uid(p){
  const buckets={u:DB.consultants||[],c:DB.clients||[],co:DB.companies||[],d:DB.deals||[],a:DB.activities||[],p:DB.pupilos||[]};
  const all=buckets[p]||[];
  const re=new RegExp('^'+p+'(\\d+)$');
  let max=0;
  all.forEach(x=>{const m=(x.id||'').match(re);if(m){const n=+m[1];if(n>max)max=n}});
  return p+(max+1);
}

/* Stage history en deals */
/* Sintetiza un stageHistory plausible para un deal cuando no se tiene registro real
   (deals seed o migrados). Idempotente: tras la primera pasada, length>1 y ya no se reemplaza.
   STAGE_PATH local porque synthStageHistory se llama desde migrateExtra durante loadDB,
   antes de que cualquier const top-level posterior se haya evaluado (TDZ). */
function synthStageHistory(d){
  const STAGE_PATH=['prospect','qualified','proposal','negotiation'];
  const start=d.createdAt?new Date(d.createdAt):new Date();
  const end=d.closeDate?new Date(d.closeDate):new Date();
  const path=[];
  if(d.stage==='won')path.push(...STAGE_PATH,'won');
  else if(d.stage==='lost'){
    const lastIdx=Math.min(STAGE_PATH.length-1, 1+Math.floor(Math.random()*STAGE_PATH.length));
    path.push(...STAGE_PATH.slice(0,lastIdx+1),'lost');
  } else {
    const idx=STAGE_PATH.indexOf(d.stage);
    path.push(...STAGE_PATH.slice(0,Math.max(0,idx)+1));
  }
  const dur=Math.max(1,end-start);
  return path.map((stage,i,arr)=>{
    const f=arr.length>1?i/(arr.length-1):0;
    const t=new Date(start.getTime()+dur*f);
    return {stage,ts:t.toISOString()};
  });
}

/* Probabilidad dinámica de cierre por etapa.
   Calcula % de deals que pasaron por la etapa X y terminaron en Won
   sobre los que pasaron por X y ya terminaron (Won + Lost).
   Cache global con _probCacheBox para evitar TDZ — si invalidateProbCache se llama
   demasiado pronto, simplemente no rompe. */
const _probCacheBox={value:null};
function invalidateProbCache(){_probCacheBox.value=null}
function dynamicStageProbs(){
  if(_probCacheBox.value)return _probCacheBox.value;
  const closed=(DB&&DB.deals?DB.deals:[]).filter(d=>d.stage==='won'||d.stage==='lost');
  const out={};
  PIPELINE_STAGES.forEach(s=>{
    if(s.id==='won'){out[s.id]={prob:100,n:0,source:'fixed'};return}
    if(s.id==='lost'){out[s.id]={prob:0,n:0,source:'fixed'};return}
    let touched=0,wins=0;
    closed.forEach(d=>{
      const sh=d.stageHistory||[];
      if(sh.some(h=>h.stage===s.id)){
        touched++;
        if(d.stage==='won')wins++;
      }
    });
    if(touched>=4){out[s.id]={prob:Math.round(wins/touched*100),n:touched,source:'dynamic'}}
    else{out[s.id]={prob:s.prob,n:touched,source:'fallback'}}
  });
  _probCacheBox.value=out;return out;
}
function getStageProb(stageId){const p=dynamicStageProbs()[stageId];return p?p.prob:0}
function stageProbInfo(stageId){return dynamicStageProbs()[stageId]||{prob:0,n:0,source:'fallback'}}
function recordStageMove(deal, fromStage, toStage){
  if(!Array.isArray(deal.stageHistory))deal.stageHistory=[];
  deal.stageHistory.push({stage:toStage,ts:nowISO(),from:fromStage,by:DB.currentUserId});
  logAudit('stage',`deal`,deal.id,`${fromStage} → ${toStage}`);
}
function fmtRelTime(iso){
  if(!iso)return '—';
  const d=new Date(iso),now=new Date(),s=Math.round((now-d)/1000);
  if(s<60)return 'ahora';
  if(s<3600)return Math.round(s/60)+'m';
  if(s<86400)return Math.round(s/3600)+'h';
  if(s<604800)return Math.round(s/86400)+'d';
  return d.toLocaleDateString('es-ES',{day:'2-digit',month:'short'});
}

/* ──────────── health score: tier + cadencia + score 0-100 ──────────── */
/* Tiers por Net Worth. Cadencia = días objetivo entre toques significativos. */
const CLIENT_TIERS=[
  {id:'platinum',label:'Platinum',min:500_000_000,cadence:14,color:'#1B4F8C'},
  {id:'gold',label:'Gold',min:100_000_000,cadence:30,color:'#B25E00'},
  {id:'silver',label:'Silver',min:20_000_000,cadence:60,color:'#6B7A90'},
  {id:'bronze',label:'Bronze',min:0,cadence:90,color:'#8A98AE'},
];
const clientTier=c=>CLIENT_TIERS.find(t=>c.netWorth>=t.min)||CLIENT_TIERS[CLIENT_TIERS.length-1];
function clientHealth(c){
  const tier=clientTier(c);
  /* "Toques" = actividades meeting/call/email del cliente */
  const touches=DB.activities.filter(a=>a.clientId===c.id&&['meeting','call','email'].includes(a.type)&&a.date<=new Date().toISOString().slice(0,10)).map(a=>a.date).sort();
  const last=touches.length?touches[touches.length-1]:null;
  const now=new Date();
  const DAY=864e5;
  const lastTouchDays=last?Math.round((now-new Date(last))/DAY):null;
  /* Score base sobre cadencia: 100 dentro de ventana; baja linealmente hasta 0 en 3× cadencia */
  let score;
  if(last===null){score=10}
  else if(lastTouchDays<=tier.cadence){score=100-Math.round((lastTouchDays/tier.cadence)*15)} /* 100 → 85 dentro de cadencia */
  else{const over=lastTouchDays-tier.cadence;const window=tier.cadence*2;score=Math.max(0,Math.round(85-(over/window)*85))}
  /* Pequeño ajuste por momentum: deals abiertos suman, estancados restan */
  const openDeals=DB.deals.filter(d=>d.clientId===c.id&&d.stage!=='won'&&d.stage!=='lost');
  if(openDeals.length){score=Math.min(100,score+Math.min(8,openDeals.length*3))}
  const status=score>=70?'healthy':score>=40?'watch':'cold';
  const daysOverdue=last&&lastTouchDays>tier.cadence?lastTouchDays-tier.cadence:0;
  return {tier,score,status,cadenceDays:tier.cadence,lastTouchDays,last,daysOverdue};
}
function healthBadge(h,size='sm'){
  const color=h.status==='healthy'?'var(--positive)':h.status==='watch'?'#D97706':'#B91C1C';
  const bg=h.status==='healthy'?'#E6F6EC':h.status==='watch'?'#FDF4E3':'#FEF2F2';
  const label=h.status==='healthy'?'Sana':h.status==='watch'?'Atención':'Fría';
  const S=size==='lg'?{h:26,fs:12,pad:'4px 10px'}:{h:20,fs:10.5,pad:'2px 8px'};
  return `<span title="Score ${h.score}/100 · ${h.tier.label} · cadencia ${h.cadenceDays}d · último toque ${h.lastTouchDays==null?'—':h.lastTouchDays+'d'}" style="display:inline-flex;align-items:center;gap:5px;padding:${S.pad};border-radius:${S.h/2}px;background:${bg};color:${color};font-size:${S.fs}px;font-weight:600;line-height:1"><span style="width:6px;height:6px;border-radius:50%;background:${color}"></span>${label} · ${h.score}</span>`;
}
